<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title data-i18n="order_title">接单</title>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
html,body{margin:0;background:#f3f0ea;color:#111;font-family:-apple-system,"PingFang SC",sans-serif}
.w{padding:12px 12px 88px}
h1{margin:6px 0 4px;font-size:18px}
.tip{color:#6b7280;font-size:13px;margin:0 0 12px}
.card{display:block;background:#fff;border-radius:12px;padding:12px;margin:0 0 10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card b{display:block;font-size:15px;line-height:1.35}
.card em{display:block;margin-top:4px;font-style:normal;color:#6b7280;font-size:12px}
.card button{margin-top:10px;height:36px;padding:0 14px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700}
/* sheet sits above the fixed #tabbar (56px + safe-area) so its buttons are never covered */
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:flex-end;justify-content:center;box-sizing:border-box;padding:0 8px calc(66px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.mask.on{display:flex}
.sheet{box-sizing:border-box;width:100%;max-width:560px;max-height:calc(100% - 16px - env(safe-area-inset-top,0px));overflow:auto;background:#fff;border-radius:16px;padding:16px;box-shadow:0 8px 28px rgba(0,0,0,.22)}
.sheet h3{margin:0 0 8px;font-size:16px}
.sheet p{margin:0 0 14px;color:#6b7280;font-size:13px;line-height:1.5;white-space:pre-line}
.sheet .row{display:flex;gap:8px}
.sheet button{flex:1;height:44px;border-radius:10px;border:0;font-weight:700}
.ok{background:#111;color:#fff}
.no{background:#eee}
html[data-theme=dark],html[data-theme=dark] body{background:#05060a;color:#e6edf3}
html[data-theme=dark] .card,html[data-theme=dark] .sheet{background:#161b22}
html[data-theme=dark] .card em,html[data-theme=dark] .sheet p{color:#9aa8b6}
html[data-theme=dark] .ok{background:#2563eb}
html[data-theme=dark] .card button{background:#2563eb;color:#fff;box-shadow:0 0 0 1px rgba(88,166,255,.35)}
html[data-theme=dark] .card button:active{background:#1d4ed8}
html[data-theme=dark] .no{background:#30363d;color:#e6edf3}
</style>
<link rel="icon" href="favicon.ico"/>
</head>
<body>
<div class="w">
  <h1 data-i18n="order_title">接单</h1>
  <p class="tip" id="tip" data-i18n="loading">正在加载任务…</p>
  <div id="list"></div>
</div>
<div class="mask" id="mask">
  <div class="sheet">
    <h3 id="mt"></h3>
    <p id="md"></p>
    <div class="row">
      <button class="no" id="cancel" type="button" data-i18n="order_cancel">取消</button>
      <button class="ok" id="take" type="button" data-i18n="order_ok">确认接单</button>
    </div>
  </div>
</div>
<script>
(function(){
  var list=document.getElementById('list');
  var tip=document.getElementById('tip');
  var mask=document.getElementById('mask');
  var cur=null;
  function paint(jobs){
    jobs=(jobs||[]).filter(function(j){return j&&j.title&&j.url;});
    if(!jobs.length){tip.textContent=(window.I18N&&I18N.t('empty'))||'没有任务';return;}
    tip.textContent='';tip.style.display='none';
    window.__jobs=jobs;
    list.innerHTML=jobs.map(function(j,i){
      return '<div class="card" data-i="'+i+'"><b>'+esc(j.title)+'</b><em>'+esc([j.company,j.cat,j.pay].filter(Boolean).join(' · '))+'</em><button type="button">接单</button></div>';
    }).join('');
    /* v284: Back from the job site returns to the same place in the list */
    var back=false;try{var n=performance.getEntriesByType('navigation')[0];back=!!n&&n.type==='back_forward';}catch(e){}
    var y=+(sessionStorage.getItem('order_y')||0);
    if(back&&y) requestAnimationFrame(function(){window.scrollTo(0,y);});
  }
  function saveY(){try{sessionStorage.setItem('order_y',String(Math.round(window.scrollY||0)));}catch(e){}}
  window.addEventListener('pagehide',saveY);
  function load(url){return fetch(url).then(function(r){if(!r.ok)throw 1;return r.json();});}
  load('./data/jobs.json?v=315').then(function(d){paint(d.jobs);}).catch(function(){
    return load('/api/jobs').then(function(d){paint(d.jobs);}).catch(function(){return load('data/jobs.json').then(function(d){paint(d.jobs||d);});});
  }).catch(function(){tip.textContent=(window.I18N&&I18N.t('order_fail'))||'Failed to load';});
  list.onclick=function(e){
    var card=e.target.closest('.card'); if(!card)return;
    var j=(window.__jobs||[])[+card.dataset.i]; if(!j)return;
    cur=j;
    document.getElementById('mt').textContent=j.title;
    document.getElementById('md').textContent=[j.company,j.pay].filter(Boolean).join(' · ');
    mask.className='mask on';
  };
  function closeSheet(){mask.className='mask';cur=null;}
  document.getElementById('cancel').onclick=closeSheet;
  mask.addEventListener('click',function(e){if(e.target===mask)closeSheet();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&mask.className.indexOf('on')>=0)closeSheet();});
  document.getElementById('take').onclick=function(){
    if(!cur||!cur.url)return;
    mask.className='mask';
    saveY();
    location.href=cur.url; /* same tab: browser Back returns here */
  };
  function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);});}
})();
</script>
<script src="./i18n.js?v=286"></script>
<script src="./langboot.js?v=286"></script>
<script src="tabbar.js?v=315"></script>
</body></html>
