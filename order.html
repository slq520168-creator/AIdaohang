<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>接单</title>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
html,body{margin:0;background:#f3f0ea;color:#111;font-family:-apple-system,"PingFang SC",sans-serif}
.w{padding:12px 12px 88px}
h1{margin:6px 0 4px;font-size:18px}
.tip{color:#6b7280;font-size:13px;margin:0 0 12px}
.card{display:block;background:#fff;border-radius:12px;padding:12px;margin:0 0 10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card b{display:block;font-size:15px;line-height:1.35}
.card em{display:block;margin-top:4px;font-style:normal;color:#6b7280;font-size:12px}
.card button{margin-top:10px;height:36px;padding:0 14px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700}
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:flex-end}
.mask.on{display:flex}
.sheet{width:100%;background:#fff;border-radius:16px 16px 0 0;padding:16px 16px 28px}
.sheet h3{margin:0 0 8px;font-size:16px}
.sheet p{margin:0 0 14px;color:#6b7280;font-size:13px;line-height:1.5}
.sheet .row{display:flex;gap:8px}
.sheet button{flex:1;height:44px;border-radius:10px;border:0;font-weight:700}
.ok{background:#111;color:#fff}
.no{background:#eee}
html[data-theme=dark],html[data-theme=dark] body{background:#05060a;color:#e6edf3}
html[data-theme=dark] .card,html[data-theme=dark] .sheet{background:#161b22}
html[data-theme=dark] .card em,html[data-theme=dark] .sheet p{color:#9aa8b6}
html[data-theme=dark] .ok{background:#2563eb}
html[data-theme=dark] .no{background:#30363d;color:#e6edf3}
</style>
</head>
<body>
<div class="w">
  <h1>真实任务</h1>
  <p class="tip" id="tip">正在抓取最新任务…</p>
  <div id="list"></div>
</div>
<div class="mask" id="mask">
  <div class="sheet">
    <h3 id="mt"></h3>
    <p id="md"></p>
    <div class="row">
      <button class="no" id="cancel" type="button">取消</button>
      <button class="ok" id="take" type="button">接单并打开平台</button>
    </div>
  </div>
</div>
<script>
(function(){
  var list=document.getElementById('list');
  var tip=document.getElementById('tip');
  var mask=document.getElementById('mask');
  var cur=null;
  fetch('/api/jobs').then(function(r){return r.json();}).then(function(d){
    var jobs=(d&&d.jobs)||[];
    if(!jobs.length){tip.textContent='暂时抓不到，稍后刷';return;}
    tip.textContent='当前 '+jobs.length+'条真实任务，点开后可接单';
    list.innerHTML=jobs.map(function(j,i){
      return '<div class="card" data-i="'+i+'"><b>'+esc(j.title)+'</b><em>'+esc([j.company,j.cat,j.pay,j.from].filter(Boolean).join(' · '))+'</em><button type="button">接单</button></div>';
    }).join('');
    window.__jobs=jobs;
  }).catch(function(){tip.textContent='抓取失败';});
  list.onclick=function(e){
    var card=e.target.closest('.card'); if(!card)return;
    var j=(window.__jobs||[])[+card.dataset.i]; if(!j)return;
    cur=j;
    document.getElementById('mt').textContent=j.title;
    document.getElementById('md').textContent=(j.company||'')+' · '+(j.from||'')+'\n接单后会打开原平台去投递。';
    mask.className='mask on';
  };
  document.getElementById('cancel').onclick=function(){mask.className='mask';cur=null;};
  document.getElementById('take').onclick=function(){
    if(!cur||!cur.url)return;
    mask.className='mask';
    location.href=cur.url;
  };
  function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);});}
})();
</script>
<script src="tabbar.js?v=313"></script>
</body></html>
