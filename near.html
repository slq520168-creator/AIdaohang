<!DOCTYPE html><html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#ffffff"/><title>附近</title><style>body{margin:0;font-family:-apple-system,sans-serif;background:#fff;color:#111827;padding:16px 14px 80px}h1{font-size:18px}.list a{display:block;padding:12px;margin:8px 0;background:#f3f4f6;color:#111827;text-decoration:none;border-radius:10px;border:1px solid #e5e7eb}p{color:#6b7280;font-size:13px}</style></head><body><h1>附近</h1><p id="loc">正在获取位置…</p><div class="list"><a href="https://map.baidu.com/">百度地图</a><a href="https://www.google.com/maps">Google Maps</a></div><script>if(navigator.geolocation){navigator.geolocation.getCurrentPosition(function(p){document.getElementById('loc').textContent='当前约 '+p.coords.latitude.toFixed(4)+','+p.coords.longitude.toFixed(4)},function(){document.getElementById('loc').textContent='未授权定位'});}else{document.getElementById('loc').textContent='不支持定位';}</script><script src="tabbar.js?v=4"></script></body></html>
