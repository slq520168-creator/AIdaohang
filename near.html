<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>附近</title><link rel="stylesheet" href="tabbar.css"/><style>body{margin:0;font-family:-apple-system,sans-serif;background:#111;color:#eee;padding:16px 14px 80px}h1{font-size:18px;color:#e8a87c}a{display:block;padding:12px;margin:8px 0;background:#1c1c1c;color:#cfe;text-decoration:none;border-radius:10px}p{color:#999;font-size:13px}</style></head><body><h1>附近</h1><p id="loc">正在获取位置…</p><a href="https://map.baidu.com/">百度地图</a><a href="https://www.google.com/maps">Google Maps</a><script>if(navigator.geolocation){navigator.geolocation.getCurrentPosition(function(p){document.getElementById('loc').textContent='当前约 '+p.coords.latitude.toFixed(4)+','+p.coords.longitude.toFixed(4)},function(){document.getElementById('loc').textContent='未授权定位，可手动打开地图'});}else{document.getElementById('loc').textContent='浏览器不支持定位';}</script><script src="tabbar.js"></script></body></html>
