<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>本站出图</title>
<script>try{var _t=localStorage.getItem('theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<link rel="stylesheet" href="./sub.css?v=317"/>
<style>
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;font-size:18px;margin:0}
.own{margin-left:auto;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:12px}
.maker{display:none;margin:8px 0}
.maker.on{display:block}
textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:12px;padding:8px;font-size:16px;background:var(--card);color:var(--txt)}
.row{display:flex;gap:8px;margin:8px 0}
select,.go{height:38px;border-radius:10px}
select{flex:1;border:1px solid var(--line);background:var(--card);color:var(--txt)}
.go{flex:0 0 72px;background:var(--btn);color:#fff;border:0;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card img{display:block;width:100%;height:132px;object-fit:cover}
.meta{display:flex;align-items:center;gap:6px;padding:6px 8px}
.meta b{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta button{flex:0 0 auto;height:26px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--txt);font-size:12px}
</style>
</head>
<body>
<div class="w draw">
  <div class="top"><a class="back" href="./tools.html?home=1">返回</a><h1>本站出图</h1><button class="own" id="own" type="button">自己做图</button></div>
  <div class="maker" id="maker">
    <textarea id="p" placeholder="写提示词"></textarea>
    <div class="row"><select id="size"><option value="1024x1024">1024方图</option><option value="1280x720">1280横图</option></select><button class="go" id="go" type="button">写真</button></div>
    <div id="st"></div>
  </div>
  <div class="grid" id="gallery"></div>
</div>
<script>
var S=[["街灯人像", "night street portrait, cinematic, real skin", "https://picsum.photos/id/1011/800/600"], ["海边日落", "seaside sunset photoreal", "https://picsum.photos/id/1015/800/600"], ["咖啡馆", "cafe window natural light", "https://picsum.photos/id/1060/800/600"], ["雨夜城市", "rainy neon city street", "https://picsum.photos/id/1016/800/600"], ["雪山", "snow mountain clear daylight", "https://picsum.photos/id/1018/800/600"], ["森林小路", "forest path morning light", "https://picsum.photos/id/15/800/600"], ["都市天际", "city skyline dusk", "https://picsum.photos/id/1031/800/600"], ["鲜花特写", "flower macro sharp", "https://picsum.photos/id/106/800/600"], ["书桌", "desk still life window light", "https://picsum.photos/id/24/800/600"], ["火车窗外", "train window landscape", "https://picsum.photos/id/133/800/600"], ["厨房", "kitchen morning photoreal", "https://picsum.photos/id/292/800/600"], ["书店", "bookstore aisle warm light", "https://picsum.photos/id/367/800/600"], ["海边礁石", "coast rocks clear water", "https://picsum.photos/id/1015/900/600"], ["夜市", "night market lights", "https://picsum.photos/id/1036/800/600"], ["雪山湖", "alpine lake reflection", "https://picsum.photos/id/1011/900/600"], ["旧街", "old town street daylight", "https://picsum.photos/id/1019/800/600"], ["工作室", "studio portrait soft light", "https://picsum.photos/id/1027/800/600"], ["公路", "open road desert", "https://picsum.photos/id/101/800/600"], ["图书馆", "library reading room", "https://picsum.photos/id/20/800/600"], ["屋顶", "rooftop city evening", "https://picsum.photos/id/1031/900/600"], ["花园", "garden path spring", "https://picsum.photos/id/106/900/600"], ["港口", "harbor boats morning", "https://picsum.photos/id/1016/900/600"]];
var box=document.getElementById('gallery');
function add(name,prompt,url){
  var d=document.createElement('div'); d.className='card';
  d.innerHTML='<img alt=""><div class="meta"><b></b><button type="button">复制</button></div>';
  d.querySelector('img').src=url; d.querySelector('b').textContent=name;
  d.querySelector('button').onclick=function(){navigator.clipboard.writeText(prompt).then(function(){d.querySelector('button').textContent='已复制';});};
  box.appendChild(d);
}
S.forEach(function(x){add(x[0],x[1],x[2]);});
document.getElementById('own').onclick=function(){document.getElementById('maker').classList.toggle('on');};
document.getElementById('go').onclick=function(){
  var t=(document.getElementById('p').value||'').trim(); if(!t) return;
  var wh=document.getElementById('size').value.split('x');
  var url='/api/draw?p='+encodeURIComponent(t)+'&w='+wh[0]+'&h='+wh[1]+'&seed='+Date.now();
  document.getElementById('st').textContent='生成中';
  var img=new Image();
  img.onload=function(){document.getElementById('st').textContent=''; add(t.slice(0,12),t,url);};
  img.onerror=function(){document.getElementById('st').textContent='失败';};
  img.src=url;
};
</script>
<script src="tabbar.js?v=317"></script>
</body>
</html>
