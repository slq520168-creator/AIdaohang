<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>本站出图</title>
<script>try{var _t=localStorage.getItem('theme');if(_t==='dark'||_t==='light')document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<link rel="stylesheet" href="./sub.css?v=280"/>
<style>
.draw textarea{display:block;width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px;background:var(--card);color:var(--txt);font-family:inherit}
.draw .row{display:flex;gap:8px;margin:10px 0}
.draw select,.draw .go{height:42px;border-radius:10px;font-size:15px}
.draw select{flex:1;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:0 8px}
.draw .go{flex:1.2;background:var(--btn);color:#fff;border:0;font-weight:700}
.draw .go:disabled{opacity:.6}
.draw .st{min-height:20px;font-size:13px;line-height:1.5;color:var(--muted);margin:2px 0 8px}
.draw .st.err{color:#dc2626}
html[data-theme="dark"] .draw .st.err{color:#f87171}
.draw .st.ok{color:#16a34a}
html[data-theme="dark"] .draw .st.ok{color:#4ade80}
.draw .res{display:none;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.draw .res.on{display:block}
.draw .res img.out{display:block;width:100%;height:auto;min-height:0}
.draw .wait{display:none;align-items:center;justify-content:center;gap:10px;height:180px;border-radius:14px;background:var(--card);border:1px dashed var(--line);color:var(--muted);font-size:13px}
.draw .wait.on{display:flex}
.draw .spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--btn);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.draw .dl{display:none;margin-top:10px;text-align:center;text-decoration:none;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
.draw .dl.on{display:block}
</style>
</head>
<body>
<div id="sitebg" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div class="w draw">
  <div class="top"><a class="back" href="./tools.html?home=1" data-i18n="back">返回</a><h1 data-i18n="draw_title">本站出图</h1></div>
  <p class="tip" data-i18n="draw_tip">免费 Pollinations，不用登录、不用手机号、不用密钥。免费通道要排队，一般 30–60 秒；图片右下角带小水印。</p>
  <textarea id="p" maxlength="600" placeholder="写提示词，中英文都可" data-i18n-placeholder="draw_ph"></textarea>
  <div class="row">
    <select id="size">
      <option value="768x1024">768×1024</option>
      <option value="1024x1024">1024×1024</option>
      <option value="1024x768">1024×768</option>
      <option value="512x768">512×768</option>
    </select>
    <button class="go" id="go" type="button" data-i18n="draw_go">生成</button>
  </div>
  <div class="st" id="st" aria-live="polite"></div>
  <div class="wait" id="wait"><span class="spin"></span><span id="waitTxt"></span></div>
  <div class="res" id="res"><img class="out" id="out" alt=""/></div>
</div>
<script src="./i18n.js?v=280"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var API='https://image.pollinations.ai/prompt/';   /* legacy anonymous endpoint, no key; plain <img>, no fetch/CORS */
  var TIMEOUT=120000;                               /* per attempt */
  var busy=false,timer=null;
  function T(k,s){var v=(window.I18N&&window.I18N.t)?window.I18N.t(k):k;return s==null?v:String(v).replace('{s}',s);}
  try{document.title=T('draw_title');}catch(e){}
  function status(txt,cls){var el=$('st');el.textContent=txt||'';el.className='st'+(cls?' '+cls:'');}
  function buildUrl(text){
    var wh=$('size').value.split('x');
    var seed=Math.floor(Math.random()*2000000000);
    return API+encodeURIComponent(text)+'?width='+wh[0]+'&height='+wh[1]+'&nologo=true&seed='+seed;
  }
  function once(url,cb){
    var im=new Image(),done=false;
    var to=setTimeout(function(){if(done)return;done=true;im.onload=im.onerror=null;im.src='';cb(false,url);},TIMEOUT);
    im.onload=function(){if(done)return;done=true;clearTimeout(to);cb(im.naturalWidth>0,url);};
    im.onerror=function(){if(done)return;done=true;clearTimeout(to);cb(false,url);};
    im.src=url;
  }
  $('go').onclick=function(){
    if(busy) return;
    var text=($('p').value||'').trim();
    if(!text){status(T('draw_empty'),'err');$('p').focus();return;}
    busy=true;$('go').disabled=true;
    $('res').className='res';status('');
    var t0=Date.now(),phase='draw_wait';
    function tick(){var s=Math.round((Date.now()-t0)/1000);$('waitTxt').textContent=T(phase,s);}
    function end(ok,url){
      clearInterval(timer);busy=false;$('go').disabled=false;$('wait').className='wait';
      if(ok){$('out').src=url;$('res').className='res on';status(T('draw_done',Math.round((Date.now()-t0)/1000)),'ok');}
      else status(T('draw_fail'),'err');
    }
    $('wait').className='wait on';tick();timer=setInterval(tick,1000);
    once(buildUrl(text),function(ok,url){
      if(ok) return end(true,url);
      phase='draw_retry';tick();
      setTimeout(function(){once(buildUrl(text),end);},4000);
    });
  };
})();
</script>
<script src="./tabbar.js?v=280"></script>
</body>
</html>
