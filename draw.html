<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>做图</title>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="./sub.css?v=321"/>
<style>
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:18px}.own{margin-left:auto;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px}
.kicker{font-size:12px;color:var(--muted)}
h2{margin:2px 0 4px;font-size:18px}
.sub{color:var(--muted);font-size:13px}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px;background:var(--card);color:var(--txt);box-sizing:border-box}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.acts button{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt)}
.acts .go{background:#2563eb;color:#fff;border:0;font-weight:700}
.bar{display:flex;gap:8px}
.bar button{flex:1;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;padding:8px}
.bar button.on{border-color:#2563eb}
.bar span{display:block;font-size:11px;color:var(--muted)}
.bar b{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chips[hidden]{display:none}
.chips button{height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:13px}
.chips button.on{background:#2563eb;color:#fff;border:0}
.out-title{font-size:14px;font-weight:800;margin:8px 2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shot{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.shot img{width:100%;display:block;background:#111}
.shot .st{min-height:120px;display:grid;place-items:center;color:var(--muted);font-size:13px;padding:8px;text-align:center}
.meta{display:flex;align-items:center;gap:6px;padding:6px 8px}
.meta b{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta button{height:26px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--txt);font-size:12px}
</style>
</head>
<body>
<div class="w">
  <div class="top"><a class="back" href="./tools.html?home=1">返回</a><h1>做图</h1><button class="own" id="own" type="button">自己做图</button></div>
  <div id="maker" style="display:none"><section class="card"><div class="kicker">AI 做图</div><h2>真人写真优先</h2><div class="sub">直接描述人物、服装、环境、镜头和光线。</div></section>
  <section class="card">
    <div style="font-weight:700;margin-bottom:6px">提示词</div>
    <textarea id="p" placeholder="例如：年轻女性，长发，白色连衣裙，海边落日散步，自然光，真实摄影质感"></textarea>
    <div class="acts"><button id="clear" type="button">清空</button><button class="go" id="go" type="button">生成</button></div>
  </section>
  <section class="card">
    <div class="bar">
      <button type="button" id="bStyle" data-open="style"><span>风格</span><b id="lStyle">电影人像</b></button>
      <button type="button" id="bShape" data-open="shape"><span>比例</span><b id="lShape">9:16</b></button>
      <button type="button" id="bCount" data-open="count"><span>数量</span><b id="lCount">1 张</b></button>
    </div>
    <div class="chips" id="pStyle" hidden></div>
    <div class="chips" id="pShape" hidden></div>
    <div class="chips" id="pCount" hidden></div>
  </section>
  </div><div class="out-title">出图在这里</div>
  <div class="grid" id="out"></div>
  <div class="out-title">模板</div>
  <div class="grid" id="gallery"></div>
</div>
<script>
var STYLES=[["人像写真","photorealistic portrait, natural skin, detailed eyes"],["自然写真","natural lifestyle portrait, soft daylight"],["棚拍人像","studio portrait, softbox, realistic skin"],["时尚人像","fashion editorial portrait, photoreal"],["电影人像","cinematic portrait, filmic light"],["随手拍","candid real-life photograph"],["专业摄影","sharp professional photograph"],["电影感","cinematic shot, dynamic lighting"],["通用","high detail photograph"],["动漫","anime illustration, clean line"],["萌系","cute illustration, soft color"],["数字绘画","digital painting, detailed"],["油画","oil painting texture"],["水彩","watercolor illustration"],["素描","pencil sketch"],["卡通","cartoon style"],["奇幻风景","fantasy landscape, sharp"]];
var SHAPES=[["1:1",1024,1024],["3:4",832,1216],["9:16",768,1344],["4:3",1216,832],["16:9",1344,768]];
var COUNTS=[1,2,4];
var st={style:4,shape:2,count:1};
function fill(box,items,key,cur,label){box.innerHTML=items.map(function(x,i){var t=Array.isArray(x)?x[0]:(x+" 张");return '<button type="button" data-i="'+i+'" class="'+(i===cur?"on":"")+'">'+t+"</button>";}).join("");box.onclick=function(e){var b=e.target.closest("button");if(!b)return;st[key]=+b.dataset.i;document.getElementById(label).textContent=key==="count"?COUNTS[st.count]+" 张":items[st[key]][0];fill(box,items,key,st[key],label);};
}
fill(document.getElementById("pStyle"),STYLES,"style",st.style,"lStyle");
fill(document.getElementById("pShape"),SHAPES,"shape",st.shape,"lShape");
fill(document.getElementById("pCount"),COUNTS,"count",st.count,"lCount");
document.querySelector(".bar").onclick=function(e){
  var b=e.target.closest("[data-open]"); if(!b) return;
  var map={style:"pStyle",shape:"pShape",count:"pCount"};
  var id=map[b.dataset.open];
  ["pStyle","pShape","pCount"].forEach(function(x){var el=document.getElementById(x); if(x!==id) el.hidden=true;});
  var cur=document.getElementById(id); cur.hidden=!cur.hidden;
};
document.getElementById("own").onclick=function(){var m=document.getElementById("maker");m.style.display=m.style.display==="none"?"block":"none";};
document.getElementById("clear").onclick=function(){document.getElementById("p").value="";};
function card(name,prompt,url){var d=document.createElement("div");d.className="shot";d.innerHTML='<img alt=""><div class="meta"><b></b><button type="button">复制</button></div>';d.querySelector("img").src=url;d.querySelector("b").textContent=name;d.querySelector("button").onclick=function(){navigator.clipboard.writeText(prompt).then(function(){d.querySelector("button").textContent="已复制";});};return d;}
var samples=[["街灯人像", "night street portrait, real skin", "/api/draw?p=%E8%A1%97%E7%81%AF%E4%BA%BA%E5%83%8F%EF%BC%8Cnight%20street%20portrait%2C%20real%20skin%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["海边日落", "seaside sunset photoreal", "/api/draw?p=%E6%B5%B7%E8%BE%B9%E6%97%A5%E8%90%BD%EF%BC%8Cseaside%20sunset%20photoreal%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["咖啡馆", "cafe window natural light", "/api/draw?p=%E5%92%96%E5%95%A1%E9%A6%86%EF%BC%8Ccafe%20window%20natural%20light%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["雨夜城市", "rainy neon city", "/api/draw?p=%E9%9B%A8%E5%A4%9C%E5%9F%8E%E5%B8%82%EF%BC%8Crainy%20neon%20city%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["雪山", "snow mountain daylight", "/api/draw?p=%E9%9B%AA%E5%B1%B1%EF%BC%8Csnow%20mountain%20daylight%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["森林", "forest path morning", "/api/draw?p=%E6%A3%AE%E6%9E%97%EF%BC%8Cforest%20path%20morning%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["天际", "city skyline dusk", "/api/draw?p=%E5%A4%A9%E9%99%85%EF%BC%8Ccity%20skyline%20dusk%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["鲜花", "flower macro", "/api/draw?p=%E9%B2%9C%E8%8A%B1%EF%BC%8Cflower%20macro%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["书桌", "desk window light", "/api/draw?p=%E4%B9%A6%E6%A1%8C%EF%BC%8Cdesk%20window%20light%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["火车", "train window", "/api/draw?p=%E7%81%AB%E8%BD%A6%EF%BC%8Ctrain%20window%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["厨房", "kitchen morning", "/api/draw?p=%E5%8E%A8%E6%88%BF%EF%BC%8Ckitchen%20morning%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["书店", "bookstore aisle", "/api/draw?p=%E4%B9%A6%E5%BA%97%EF%BC%8Cbookstore%20aisle%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["礁石", "coast rocks", "/api/draw?p=%E7%A4%81%E7%9F%B3%EF%BC%8Ccoast%20rocks%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["夜市", "night market", "/api/draw?p=%E5%A4%9C%E5%B8%82%EF%BC%8Cnight%20market%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["湖面", "alpine lake", "/api/draw?p=%E6%B9%96%E9%9D%A2%EF%BC%8Calpine%20lake%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["旧街", "old town street", "/api/draw?p=%E6%97%A7%E8%A1%97%EF%BC%8Cold%20town%20street%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["人像", "studio portrait", "/api/draw?p=%E4%BA%BA%E5%83%8F%EF%BC%8Cstudio%20portrait%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["公路", "open road", "/api/draw?p=%E5%85%AC%E8%B7%AF%EF%BC%8Copen%20road%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["图书馆", "library hall", "/api/draw?p=%E5%9B%BE%E4%B9%A6%E9%A6%86%EF%BC%8Clibrary%20hall%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["屋顶", "rooftop evening", "/api/draw?p=%E5%B1%8B%E9%A1%B6%EF%BC%8Crooftop%20evening%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["花园", "garden path", "/api/draw?p=%E8%8A%B1%E5%9B%AD%EF%BC%8Cgarden%20path%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"], ["港口", "harbor morning", "/api/draw?p=%E6%B8%AF%E5%8F%A3%EF%BC%8Charbor%20morning%EF%BC%8C%E6%B8%85%E6%99%B0%E7%85%A7%E7%89%87&w=1024&h=1024&seed=3"]];
var gal=document.getElementById("gallery");samples.forEach(function(x){gal.appendChild(card(x[0],x[1],x[2]));});
document.getElementById("go").onclick=async function(){
  var text=(document.getElementById("p").value||"").trim(); if(!text) return;
  var go=document.getElementById("go"); go.disabled=true; go.textContent="生成中";
  var box=document.getElementById("out"); box.innerHTML=""; box.scrollIntoView({block:"start"});
  var shape=SHAPES[st.shape], style=STYLES[st.style][1], n=COUNTS[st.count];
  for(var i=0;i<n;i++){
    var tile=document.createElement("div"); tile.className="shot"; tile.innerHTML='<div class="st">生成中</div>'; box.appendChild(tile);
    var url="/api/draw?p="+encodeURIComponent(style+", "+text)+"&w="+shape[1]+"&h="+shape[2]+"&seed="+(Date.now()+i);
    await new Promise(function(res){
      var img=new Image();
      img.onload=function(){tile.innerHTML="";tile.appendChild(img);var m=document.createElement("div");m.className="meta";m.innerHTML="<b></b><button type='button'>复制</button>";m.querySelector("b").textContent=text.slice(0,12);m.querySelector("button").onclick=function(){navigator.clipboard.writeText(text);this.textContent="已复制";};tile.appendChild(m);res();};
      img.onerror=function(){tile.querySelector(".st").textContent="失败";res();};
      img.src=url;
    });
  }
  go.disabled=false; go.textContent="生成";
};
</script>
<script src="tabbar.js?v=321"></script>
</body></html>
