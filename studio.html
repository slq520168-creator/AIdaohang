<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>优选创作</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b0b0f;color:#eee;font-family:-apple-system,"PingFang SC",sans-serif}
body{min-height:100dvh;background:radial-gradient(800px 400px at 50% -10%,rgba(255,47,146,.18),transparent 55%),#0b0b0f}
.w{max-width:480px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px 24px}
.nav{display:flex;justify-content:space-between;margin-bottom:16px}
.nav a{color:#fff;text-decoration:none;background:#1c1c22;border-radius:999px;padding:7px 12px;font-size:13px}
h1{margin:0 0 16px;font-size:22px;text-align:center;line-height:1.45}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.modes button{background:#17171d;border:1px solid #2a2a33;color:#ddd;border-radius:12px;padding:12px 8px;font-size:14px}
.modes button.on{border-color:#ff2f92;background:#21101a;color:#fff}
.box{border:1.5px solid #ff2f92;border-radius:18px;padding:14px;background:#121218}
.up{width:100%;min-height:120px;border:1.5px dashed #555;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#999;overflow:hidden;background:#1a1a22}
.up img{width:100%;height:180px;object-fit:cover;display:block}
textarea,.sel{width:100%;margin-top:10px;background:#1c1c24;border:0;color:#fff;border-radius:10px;padding:12px;font-size:15px}
button.go{width:100%;margin-top:10px;border:0;border-radius:12px;padding:14px;background:linear-gradient(90deg,#ff4da6,#c44bff);color:#fff;font-size:16px}
.hint{font-size:12px;color:#888;margin-top:10px;line-height:1.5}
.stage{display:none;margin-top:12px;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9}
.stage.on{display:block}
.stage.v{aspect-ratio:9/16;max-height:70vh}
.stage.s{aspect-ratio:1/1}
.stage img{width:120%;height:120%;object-fit:cover;animation:kb 6s ease-in-out forwards}
@keyframes kb{from{transform:translate(-4%,-4%) scale(1)}to{transform:translate(-12%,-8%) scale(1.18)}}
.ok{display:none;margin-top:8px;color:#86efac;font-size:13px}
</style>
</head>
<body>
<div class="w">
  <div class="nav"><a href="./">返回导航</a><a href="create.html">创作入口</a></div>
  <h1>一张图，一句话，<br>生成可发布的短视频</h1>
  <div class="modes">
    <button class="on" data-m="i2v">图生视频</button>
    <button data-m="t2v">文生视频</button>
    <button data-m="t2i">文生图</button>
    <button data-m="i2i">图生图</button>
  </div>
  <div class="box">
    <div class="up" id="up">点这里上传图片</div>
    <input id="file" type="file" accept="image/*" hidden>
    <textarea id="prompt" placeholder="请输入你的想象，例如：缓慢推近"></textarea>
    <select class="sel" id="spec">
      <option value="16">16:9 / 6秒</option>
      <option value="9">9:16 / 6秒</option>
      <option value="1">1:1 / 6秒</option>
    </select>
    <button class="go" id="go">生成</button>
    <p class="hint">点上传 → 点生成，图片会推镜运动。iPhone Safari 录不了文件，用系统录屏保存。</p>
    <div class="stage" id="stage"><img id="anim" alt=""></div>
    <div class="ok" id="ok">已生成运镜预览</div>
  </div>
</div>
<script>
var imgURL='', mode='i2v';
document.querySelectorAll('.modes button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.modes button').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on'); mode=b.dataset.m;
  };
});
document.getElementById('up').onclick=function(){document.getElementById('file').click();};
document.getElementById('file').onchange=function(){
  var f=this.files&&this.files[0]; if(!f) return;
  if(imgURL) URL.revokeObjectURL(imgURL);
  imgURL=URL.createObjectURL(f);
  document.getElementById('up').innerHTML='<img src="'+imgURL+'">';
};
document.getElementById('go').onclick=function(){
  if(mode!=='i2v'&&mode!=='i2i'){alert('当前只开通图生视频，请先上传图片');return;}
  if(!imgURL){alert('先点上面上传一张图');return;}
  var stage=document.getElementById('stage');
  var anim=document.getElementById('anim');
  var spec=document.getElementById('spec').value;
  stage.className='stage on'+(spec==='9'?' v':spec==='1'?' s':'');
  anim.style.animation='none';
  anim.src=imgURL;
  void anim.offsetWidth;
  anim.style.animation='kb 6s ease-in-out forwards';
  document.getElementById('ok').style.display='block';
  stage.scrollIntoView({behavior:'smooth',block:'center'});
};
</script>
</body>
</html>
