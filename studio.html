<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>免费做视频</title>
<script>try{var _t=localStorage.getItem('theme');if(_t==='dark'||_t==='light')document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<link rel="stylesheet" href="./sub.css?v=280"/>
<style>
.vid .card{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px}
.vid .card .tx{flex:1;min-width:0}
.vid .card .n{font-weight:700;font-size:15px}
.vid .card .d{font-size:12px;line-height:1.45;color:var(--muted);margin-top:3px}
.vid .card .b{display:inline-block;font-size:11px;line-height:1.4;border-radius:999px;padding:1px 8px;margin-top:5px;background:var(--soft);color:var(--muted)}
.vid .card .b.free{background:#dcfce7;color:#166534}
html[data-theme="dark"] .vid .card .b.free{background:#14532d;color:#bbf7d0}
.vid .card .open{flex:none;text-decoration:none;background:var(--btn);color:#fff;font-weight:700;font-size:14px;border-radius:10px;padding:9px 14px;white-space:nowrap}
</style>
</head>
<body>
<div id="sitebg" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div class="w vid">
  <div class="top"><a class="back" href="./tools.html?home=1" data-i18n="back">返回</a><h1 data-i18n="vid_title">免费做视频</h1></div>
  <p class="tip" data-i18n="vid_intro">说明：目前没有“免登录、免密钥、能直接在本站里生成”的免费视频接口。下面是能免费做视频的正规网站，点“打开”在新窗口使用。</p>
  <div id="list"></div>
</div>
<script src="./i18n.js?v=280"></script>
<script>
(function(){
  function T(k){return (window.I18N&&window.I18N.t)?window.I18N.t(k):k;}
  function zh(){return ((window.I18N&&window.I18N.lang)||'zh')==='zh';}
  /* real sites, each URL checked to load (v280). cn = URL for Chinese users, g = global */
  var SITES=[
    {k:'jimeng',cn:'https://jimeng.jianying.com/',g:'https://dreamina.capcut.com/',free:0},
    {k:'kling',cn:'https://app.klingai.com/cn/',g:'https://klingai.com/',free:0},
    {k:'hailuo',cn:'https://hailuoai.com/',g:'https://hailuoai.video/',free:0},
    {k:'vidu',cn:'https://www.vidu.cn/',g:'https://www.vidu.com/',free:0},
    {k:'wan',cn:'https://tongyi.aliyun.com/wan/',g:'https://wan.video/',free:0},
    {k:'pixverse',cn:'https://app.pixverse.ai/',g:'https://app.pixverse.ai/',free:0},
    {k:'hfwan',cn:'https://huggingface.co/spaces/zerogpu-aoti/wan2-2-fp8da-aoti-faster',g:'https://huggingface.co/spaces/zerogpu-aoti/wan2-2-fp8da-aoti-faster',free:1},
    {k:'hfltx',cn:'https://huggingface.co/spaces/Lightricks/ltx-video-distilled',g:'https://huggingface.co/spaces/Lightricks/ltx-video-distilled',free:1}
  ];
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function paint(){
    try{document.title=T('vid_title');}catch(e){}
    var z=zh();
    document.getElementById('list').innerHTML=SITES.map(function(s){
      return '<div class="card"><div class="tx"><div class="n">'+esc(T('vid_n_'+s.k))+'</div><div class="d">'+esc(T('vid_d_'+s.k))+'</div>'+
        '<span class="b'+(s.free?' free':'')+'">'+esc(T(s.free?'vid_nologin':'vid_login'))+'</span></div>'+
        '<a class="open" href="'+esc(z?s.cn:s.g)+'" target="_blank" rel="noopener noreferrer">'+esc(T('vid_open'))+'</a></div>';
    }).join('');
  }
  paint();
  window.paintVid=paint;
})();
</script>
<script src="./tabbar.js?v=280"></script>
</body>
</html>
