<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>创作台 · 做图 视频 音乐</title>
<link rel="apple-touch-icon" href="IMG_7049.jpeg"/>
<style>
html,body{margin:0;min-height:100%;min-height:100dvh;background:transparent;color:#3b2f2c;font-family:-apple-system,"PingFang SC",sans-serif}
#sitebg{position:fixed;inset:0;width:100%;height:100%;height:100dvh;object-fit:cover;z-index:0;pointer-events:none}
.w{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{color:#fff;text-decoration:none;background:rgba(0,0,0,.35);border-radius:999px;padding:8px 12px;font-size:14px}
h1{font-size:18px;margin:0;flex:1;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tabs button{flex:1;border:0;border-radius:12px;padding:10px 0;font-size:15px;font-weight:700;background:rgba(255,255,255,.55);color:#111}
.tabs button.on{background:#d97888;color:#fff}
.panel{background:rgba(255,255,255,.78);border-radius:16px;padding:12px}
textarea{width:100%;min-height:96px;border:0;border-radius:14px;padding:12px;font-size:15px;resize:vertical;box-sizing:border-box;background:#fff;line-height:1.4}
.go{width:100%;margin-top:10px;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:#d97888;color:#fff}
.go[disabled]{opacity:.55}
.box{margin-top:14px;background:rgba(255,255,255,.88);color:#111;border-radius:16px;padding:10px}
.box img,.box video,.box audio{width:100%;border-radius:12px;display:block;background:transparent}
.box pre{white-space:pre-wrap;font-size:14px;line-height:1.45;margin:0;font-family:inherit}
.wait{text-align:center;padding:16px 8px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
</style>
</head>
<body>
<img id="sitebg" src="IMG_7049.jpeg" alt="" aria-hidden="true"/>
<div class="w">
  <div class="top">
    <a class="back" href="./tools.html">返回</a>
    <h1>创作台</h1>
  </div>
  <div class="tabs">
    <button type="button" class="on" data-k="img">做图</button>
    <button type="button" data-k="vid">视频</button>
    <button type="button" data-k="mus">音乐</button>
  </div>
  <div class="panel">
    <textarea id="p"></textarea>
    <button class="go" id="go" type="button">生成</button>
  </div>
  <div id="out"></div>
</div>
<script>
(function(){
  var k='img', busy=false, audioCtx=null, nodes=[];
  var preset={
    img:'电影级写真，东亚年轻女人靠在深色窗边，金色夕阳光打在侧脸和锁骨，皮肤毛孔清晰，浅景深，85mm镜头，8K超高清，胶片质感，电影调色',
    vid:'电影级运镜短片，黄昏海边女主角回眸，金色轮廓光，慢速向前推镜头，发丝随风，8K超高清，宽银幕电影调色，写真质感',
    mus:'电影级中文抒情主题曲，管弦乐铺底，钢琴主旋律，高保真录音，温暖女声，雨夜城市，史诗而克制'
  };
  var q=document.getElementById('p');
  q.value=preset.img;
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
      k=b.getAttribute('data-k');
      q.value=preset[k];
      stopMus();
    };
  });
  function enc(s){return encodeURIComponent(String(s||'').trim())}
  function quality(s){
    return s+' , cinematic film still, ultra HD 8K, photorealistic portrait photography, movie grade color grading, sharp focus, studio lighting';
  }
  function imgUrl(prompt,w,h,seed){
    return 'https://image.pollinations.ai/prompt/'+enc(quality(prompt))+'?width='+(w||1280)+'&height='+(h||1600)+'&nologo=true&enhance=true&model=sana&seed='+(seed||Math.floor(Math.random()*99999));
  }
  function loadImg(url){
    return new Promise(function(res,rej){
      var im=new Image();
      im.crossOrigin='anonymous';
      im.onload=function(){res(im)};
      im.onerror=function(){rej(new Error('图失败'))};
      im.src=url;
    });
  }
  function pickMime(){
    var list=['video/mp4','video/webm;codecs=vp9','video/webm'];
    if(!window.MediaRecorder) return '';
    for(var i=0;i<list.length;i++) if(MediaRecorder.isTypeSupported(list[i])) return list[i];
    return '';
  }
  function showWait(t){document.getElementById('out').innerHTML='<p class="wait">'+(t||'正在生成…')+'</p>'}
  function showBox(html){document.getElementById('out').innerHTML='<div class="box">'+html+'</div>'}

  async function makeImg(){
    var prompt=q.value.trim()||preset.img;
    var url=imgUrl(prompt,1280,1600);
    showWait('正在出图');
    await loadImg(url);
    showBox('<img alt="" src="'+url+'">');
  }

  async function makeVid(){
    var prompt=q.value.trim()||preset.vid;
    showWait('正在出片');
    var im=await loadImg(imgUrl(prompt,1080,1920));
    var canvas=document.createElement('canvas');
    canvas.width=1080; canvas.height=1920;
    var ctx=canvas.getContext('2d');
    var mime=pickMime();
    var seconds=5;
    if(!mime || !canvas.captureStream){
      showBox('<img alt="" src="'+im.src+'">');
      return;
    }
    var stream=canvas.captureStream(30);
    var rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000});
    var chunks=[];
    rec.ondataavailable=function(e){if(e.data&&e.data.size) chunks.push(e.data)};
    var done=new Promise(function(res){rec.onstop=res});
    rec.start();
    var t0=performance.now();
    function draw(now){
      var p=Math.min(1,(now-t0)/(seconds*1000));
      var z=1+0.22*p;
      var w=1080*z, h=1920*z;
      ctx.drawImage(im,(1080-w)/2,(1920-h)/2,w,h);
      if(p<1) requestAnimationFrame(draw);
      else rec.stop();
    }
    requestAnimationFrame(draw);
    await done;
    var blob=new Blob(chunks,{type:mime});
    showBox('<video controls playsinline src="'+URL.createObjectURL(blob)+'"></video>');
  }

  function stopMus(){
    nodes.forEach(function(n){try{n.stop()}catch(e){} try{n.disconnect()}catch(e2){}});
    nodes=[];
    if(window.speechSynthesis) speechSynthesis.cancel();
  }
  function tone(ctx, type, freq, t, dur, gain){
    var o=ctx.createOscillator();
    var g=ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(gain,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t+dur+0.02);
    nodes.push(o);
  }
  async function makeMus(){
    var prompt=q.value.trim()||preset.mus;
    showWait('正在出歌');
    stopMus();
    var lyrics='';
    try{
      var ask='用中文写一首8行电影主题歌词，只要歌词：'+prompt;
      var r=await fetch('https://text.pollinations.ai/'+enc(ask)+'?model=openai-fast');
      lyrics=(await r.text()).replace(/^["\'\\s]+|["\'\\s]+$/g,'').slice(0,800);
    }catch(e){
      lyrics='夜色铺在窗上\\n灯火一格一格亮\\n我想把这首歌\\n唱得很干净';
    }
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') await audioCtx.resume();
    var now=audioCtx.currentTime+0.05;
    var bpm=84, beat=60/bpm;
    var scale=[196,220,247,262,294,330,349,392];
    for(var i=0;i<40;i++){
      var t=now+i*beat;
      if(i%4===0) tone(audioCtx,'sine',98,t,0.22,0.18);
      if(i%2===0) tone(audioCtx,'triangle',49,t,0.16,0.1);
      if(i%2===1) tone(audioCtx,'sine',scale[i%scale.length],t,0.36,0.08);
    }
    showBox('<pre>'+lyrics.replace(/[<>]/g,'')+'</pre>');
    try{
      var u=new SpeechSynthesisUtterance(lyrics.replace(/\\n/g,'，'));
      u.lang='zh-CN'; u.rate=0.9; u.pitch=1;
      speechSynthesis.speak(u);
    }catch(e2){}
  }

  document.getElementById('go').onclick=async function(){
    if(busy) return;
    busy=true; this.disabled=true;
    try{
      if(k==='img') await makeImg();
      else if(k==='vid') await makeVid();
      else await makeMus();
    }catch(e){
      showBox('<p>这次没生成成功，再点一次。</p>');
    }
    busy=false; this.disabled=false;
  };
})();
</script>
</body>
</html>
