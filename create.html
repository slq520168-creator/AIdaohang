<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>免费创作入口</title>
<link rel="apple-touch-icon" href="IMG_7049.jpeg"/>
<style>
html,body{margin:0;min-height:100%;min-height:100dvh;background:#000;color:#3b2f2c;font-family:-apple-system,"PingFang SC",sans-serif}
#sitebg{position:fixed;inset:0;width:100%;height:100%;height:100dvh;object-fit:cover;z-index:0;pointer-events:none}
.w{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{color:#fff;text-decoration:none;background:rgba(0,0,0,.35);border-radius:999px;padding:8px 12px;font-size:14px}
h1{font-size:18px;margin:0;flex:1;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.note{color:#fff;font-size:12px;opacity:.9;margin:0 0 14px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.sec{background:rgba(255,255,255,.82);border-radius:16px;padding:12px;margin:0 0 12px}
.sec h2{margin:0 0 10px;font-size:16px}
a.card{display:block;background:#fff;border-radius:12px;padding:10px 12px;margin:0 0 8px;text-decoration:none;color:#111}
a.card:last-child{margin:0}
.n{font-weight:700;font-size:15px}
.t{font-size:12px;opacity:.72;margin-top:3px;line-height:1.4}
.tag{display:inline-block;font-size:11px;background:#d97888;color:#fff;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
</style>
</head>
<body>
<img id="sitebg" src="IMG_7049.jpeg" alt="" aria-hidden="true"/>
<div class="w">
  <div class="top">
    <a class="back" href="./">返回</a>
    <h1>免费创作</h1>
  </div>
  <p class="note">优选创作是本站自建页。其余仍打开对方网站。</p>

  <section class="sec">
    <h2>视频创作</h2>
    <a class="card" href="studio.html">
      <div class="n">优选创作<span class="tag">本站</span></div>
      <div class="t">图生视频：上传图片本地运镜成片，可下载。</div>
    </a>
    <a class="card" href="https://jimeng.jianying.com" target="_blank" rel="noopener">
      <div class="n">即梦</div>
      <div class="t">字节绘画+视频。写提示词出镜头。</div>
    </a>
    <a class="card" href="https://klingai.com" target="_blank" rel="noopener">
      <div class="n">可灵</div>
      <div class="t">快手文生/图生视频。</div>
    </a>
  </section>

  <section class="sec">
    <h2>音乐创作</h2>
    <a class="card" href="https://suno.com" target="_blank" rel="noopener">
      <div class="n">Suno<span class="tag">主入口</span></div>
      <div class="t">每日50积分，约10首完整歌。</div>
    </a>
    <a class="card" href="https://boomy.com" target="_blank" rel="noopener">
      <div class="n">Boomy</div>
      <div class="t">无限生成可下载MP3。</div>
    </a>
    <a class="card" href="https://pixabay.com/music/" target="_blank" rel="noopener">
      <div class="n">Pixabay Music</div>
      <div class="t">可反复下载配乐。</div>
    </a>
  </section>

  <section class="sec">
    <h2>菜单与菜品图</h2>
    <a class="card" href="https://leonardo.ai" target="_blank" rel="noopener">
      <div class="n">Leonardo AI</div>
      <div class="t">菜品图、餐厅宣传图。</div>
    </a>
    <a class="card" href="https://www.canva.com" target="_blank" rel="noopener">
      <div class="n">Canva</div>
      <div class="t">菜单模板制作。</div>
    </a>
  </section>
</div>
</body>
</html>
