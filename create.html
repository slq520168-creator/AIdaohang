<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>创作台 · 做图 视频 音乐</title>
<link rel="apple-touch-icon" href="IMG_7049.jpeg"/>
<style>
html,body{margin:0;min-height:100%;min-height:100dvh;background:transparent;color:#3b2f2c;font-family:-apple-system,"PingFang SC",sans-serif}
#sitebg{position:fixed;inset:0;width:100%;height:100%;height:100dvh;object-fit:cover;z-index:0;pointer-events:none}
.w{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{color:#fff;text-decoration:none;background:rgba(0,0,0,.35);border-radius:999px;padding:8px 12px;font-size:14px}
h1{font-size:18px;margin:0;flex:1;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tabs button{flex:1;border:0;border-radius:12px;padding:10px 0;font-size:15px;font-weight:700;background:rgba(255,255,255,.55);color:#111}
.tabs button.on{background:#d97888;color:#fff}
.panel{background:rgba(255,255,255,.78);border-radius:16px;padding:12px}
textarea{width:100%;min-height:96px;border:0;border-radius:14px;padding:12px;font-size:15px;resize:vertical;box-sizing:border-box;background:#fff;line-height:1.4}
.go{width:100%;margin-top:10px;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:#d97888;color:#fff}
.go[disabled]{opacity:.55}
.box{margin-top:14px;background:rgba(255,255,255,.88);color:#111;border-radius:16px;padding:10px}
.box img,.box video,.box audio{width:100%;border-radius:12px;display:block;background:#111}
.cap{margin:8px 2px 0;font-size:12px;opacity:.7}
.wait{text-align:center;padding:16px 8px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
</style>
</head>
<body>
<img id="sitebg" src="IMG_7049.jpeg" alt="" aria-hidden="true"/>
<div class="w">
  <div class="top">
    <a class="back" href="./">返回</a>
    <h1>创作台</h1>
  </div>
  <div class="tabs">
    <button type="button" class="on" data-k="img">做图</button>
    <button type="button" data-k="vid">视频</button>
    <button type="button" data-k="mus">音乐</button>
  </div>
  <div class="panel">
    <textarea id="p"></textarea>
    <button class="go" id="go" type="button">生成</button>
  </div>
  <div id="out"></div>
</div>
<script>
(function(){
  var k='img', busy=false, esRef=null;
  var FLUX='https://black-forest-labs-flux-1-schnell.hf.space';
  var ACE='https://ace-step-ace-step-v1-5.hf.space';
  var WAN='https://wan-ai-wan2-1.hf.space';
  var preset={
    img:'电影级写真，东亚年轻女人靠在深色窗边，金色夕阳光打在侧脸和锁骨，皮肤毛孔清晰，浅景深，85mm镜头，8K超高清，胶片质感，电影调色',
    vid:'电影级运镜短片，黄昏海边女主角回眸，金色轮廓光，慢速向前推镜头，发丝随风，8K超高清，宽银幕电影调色，写真质感',
    mus:'电影级中文抒情主题曲，管弦乐铺底，钢琴主旋律，高保真录音，温暖女声，雨夜城市，史诗而克制'
  };
  var q=document.getElementById('p');
  q.value=preset.img;
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
      k=b.getAttribute('data-k');
      q.value=preset[k];
      closeEs();
    };
  });
  function showWait(t){document.getElementById('out').innerHTML='<p class="wait">'+(t||'正在生成…')+'</p>'}
  function showBox(html){document.getElementById('out').innerHTML='<div class="box">'+html+'</div>'}
  function closeEs(){ if(esRef){ try{esRef.close()}catch(e){} esRef=null; } }
  function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
  function fileUrl(x, base){
    function abs(u){
      if(!u) return '';
      u=String(u);
      if(/^https?:/i.test(u)) return u;
      if(u.indexOf('//')===0) return location.protocol+u;
      if(base && u.charAt(0)==='/') return base+u;
      if(base && u.indexOf('gradio_api/file')===-1) return base+'/gradio_api/file='+u;
      return u;
    }
    if(!x) return '';
    if(typeof x==='string') return abs(x);
    if(Array.isArray(x)){
      for(var i=0;i<x.length;i++){ var u=fileUrl(x[i], base); if(u) return u; }
      return '';
    }
    if(typeof x==='object'){
      if(x.url) return abs(x.url);
      if(x.path) return abs(x.path);
      return fileUrl(x.video, base)||fileUrl(x.image, base)||fileUrl(x.value, base);
    }
    return '';
  }
  function runGradio(base, apiName, fnIndex, data, onInfo){
    closeEs();
    return new Promise(function(resolve, reject){
      var session=Math.random().toString(36).slice(2)+Date.now().toString(36);
      fetch(base+'/gradio_api/queue/join',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({data:data, fn_index:fnIndex, session_hash:session, api_name:apiName})
      }).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||j.detail||('HTTP '+r.status)); return j; }); })
      .then(function(j){
        if(!j.event_id) throw new Error('排队失败');
        var es=new EventSource(base+'/gradio_api/queue/data?session_hash='+encodeURIComponent(session));
        esRef=es;
        var done=false;
        function finish(fn){ if(done) return; done=true; closeEs(); fn(); }
        es.onmessage=function(ev){
          var msg; try{ msg=JSON.parse(ev.data); }catch(e){ return; }
          if(msg.msg==='estimation' && onInfo){
            var eta=Math.round(msg.rank_eta||0);
            onInfo('排队第 '+(msg.rank||0)+' 位 · 约 '+eta+' 秒');
          }
          if(msg.msg==='process_starts' && onInfo) onInfo('模型正在跑…');
          if(msg.msg==='progress' && onInfo) onInfo('生成中…');
          if(msg.msg==='process_completed'){
            var err=msg.output && msg.output.error;
            if(msg.success===false || err){
              finish(function(){ reject(new Error(String(err||msg.title||'失败'))); });
              return;
            }
            finish(function(){ resolve((msg.output && msg.output.data) || []); });
          }
          if(msg.msg==='close_stream'){
            finish(function(){ reject(new Error('连接断开')); });
          }
        };
        es.onerror=function(){ finish(function(){ reject(new Error('连接失败')); }); };
      }).catch(reject);
    });
  }
  function niceErr(e){
    var s=String((e && e.message)||e||'失败');
    if(/ZeroGPU|quota/i.test(s)) return '这块免费 GPU 额度用完了，过几分钟再试。模型是真的，不是假图。';
    if(/login|auth|token|unauthor/i.test(s)) return '这个模型要登录才能用，这一次没拿到结果。';
    return s.replace(/https?:\/\/\S+/g,'').slice(0,180);
  }

  async function makeImg(){
    var prompt=q.value.trim()||preset.img;
    showWait('FLUX.1-schnell 排队中');
    var data=await runGradio(FLUX, '/infer', 2, [prompt, 0, true, 768, 1024, 4], function(t){ showWait('FLUX.1-schnell · '+t); });
    var url=fileUrl(data, FLUX);
    if(!url) throw new Error('没返回图片');
    showBox('<img alt="" src="'+esc(url)+'"><p class="cap">FLUX.1-schnell · 768×1024</p>');
  }

  function aceData(prompt){
    return [
      'acestep-v15-xl-turbo','simple',prompt,'zh',
      prompt,'',0,'','','zh',
      8,7.0,true,'-1',null,
      -1,1,null,null,0.0,
      -1,'Fill the audio semantic mask based on the given conditions:',1.0,'text2music',false,
      0.0,1.0,3.0,'ode','',
      'mp3',0.85,false,2.0,0,
      0.9,'NO USER INPUT',true,true,true,
      false,true,false,false,0.5,
      8,null,[],false
    ];
  }

  async function makeMus(){
    var prompt=q.value.trim()||preset.mus;
    showWait('ACE-Step v1.5 排队中');
    var data=await runGradio(ACE, '/generation_wrapper', 77, aceData(prompt), function(t){ showWait('ACE-Step v1.5 · '+t); });
    var url=fileUrl(data, ACE);
    if(!url) throw new Error('没返回音频');
    showBox('<audio controls src="'+esc(url)+'"></audio><p class="cap">ACE-Step v1.5 XL Turbo</p>');
  }

  async function makeVid(){
    var prompt=q.value.trim()||preset.vid;
    showWait('Wan 2.1 提交中');
    var data=await runGradio(WAN, '/t2v_generation_async', 5, [prompt, '832*480', false, -1], function(t){ showWait('Wan 2.1 · '+t); });
    var url=fileUrl(data, WAN);
    if(!url){
      showWait('Wan 2.1 等成片');
      for(var i=0;i<24 && !url;i++){
        await new Promise(function(r){ setTimeout(r, 8000); });
        try{
          var d2=await runGradio(WAN, '/status_refresh', 7, [], function(t){ showWait('Wan 2.1 · '+t); });
          url=fileUrl(d2, WAN);
        }catch(e){}
      }
    }
    if(!url) throw new Error('Wan 2.1 这次没给出视频（队列或额度）。不会用静图假装成片。');
    showBox('<video controls playsinline src="'+esc(url)+'"></video><p class="cap">Wan 2.1 · 832×480</p>');
  }

  document.getElementById('go').onclick=async function(){
    if(busy) return;
    busy=true; this.disabled=true;
    try{
      if(k==='img') await makeImg();
      else if(k==='vid') await makeVid();
      else await makeMus();
    }catch(e){
      showBox('<p>'+esc(niceErr(e))+'</p>');
    }
    busy=false; this.disabled=false;
  };
})();
</script>
</body>
</html>
