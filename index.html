<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Global AI Directory</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="stylesheet" href="tabbar.css?v=3"/>
<style>
html,body{margin:0;min-height:100%;font-family:-apple-system,sans-serif;color:#3b2f2c;background:#000}
body{min-height:100dvh;background:#000 url("IMG_7049.jpeg") center/cover no-repeat fixed}
.w{max-width:430px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(80px + env(safe-area-inset-bottom))}
.b{background:rgba(255,255,255,.86);color:#111827;border-radius:10px;padding:8px 10px;line-height:1.35;font-size:12px}
.enter{display:block;text-align:center;background:#d97888;color:#fff;text-decoration:none;padding:14px;border-radius:16px;font-weight:700;font-size:16px;margin:10px 0 0}
.rh{background:linear-gradient(135deg,#7c5cff,#ff5ea8);color:#fff}
</style>
</head>
<body>
<div class="w">
<a class="enter rh" href="https://www.runninghub.ai/" id="goRh" target="_blank" rel="noopener">Web Image · RunningHub</a>
<div class="b" id="hello">Hello. Welcome to Global AI Directory.</div>
<a class="enter" id="goHome" href="./tools.html?v=250&home=1&lang=en">Enter home</a>
<a class="enter" id="goMake" href="./create.html" style="background:#1f2937">Image · Video · Music</a>
</div>
<script>
(function(){
  try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}
  var q=new URLSearchParams(location.search).get('lang');
  var lang=q||localStorage.getItem('lang')||'en';
  if(lang==='zh'){
    document.documentElement.lang='zh-CN';
    document.title='全球优选AI导航';
    document.getElementById('hello').textContent='你好，欢迎来到全球优选AI导航。';
    document.getElementById('goHome').textContent='进入首页';
    document.getElementById('goHome').href='./tools.html?v=250&home=1&lang=zh';
    document.getElementById('goMake').textContent='做图 · 视频 · 音乐';
    document.getElementById('goRh').textContent='网页出图 · RunningHub';
  }
})();
</script>
<script src="tabbar.js?v=6"></script>
</body>
</html>
