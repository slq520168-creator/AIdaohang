<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#05060a"/>
<title>全球优选AI导航</title>
<link rel="manifest" href="manifest.webmanifest"/>
<style>
html,body{margin:0;min-height:100%;background:#05060a}
body{
  min-height:100dvh;cursor:pointer;position:relative;overflow:hidden;
  background:
    radial-gradient(1200px 800px at 12% 18%, rgba(88,70,255,.38), transparent 58%),
    radial-gradient(900px 700px at 88% 12%, rgba(56,189,248,.28), transparent 55%),
    radial-gradient(1000px 800px at 70% 88%, rgba(236,72,153,.22), transparent 60%),
    radial-gradient(700px 500px at 30% 75%, rgba(34,211,238,.16), transparent 55%),
    linear-gradient(165deg, #07080f 0%, #0b1020 42%, #05060a 100%);
}
body::before{
  content:"";position:fixed;inset:-20%;
  background:
    radial-gradient(circle at 30% 40%, rgba(255,255,255,.06), transparent 42%),
    radial-gradient(circle at 70% 60%, rgba(124,58,237,.14), transparent 45%);
  animation:drift 18s ease-in-out infinite alternate;
  pointer-events:none;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;
  opacity:.5;mix-blend-mode:overlay;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.015) 2px,rgba(255,255,255,.015) 3px);
}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,1.5%,0) scale(1.06)}}
</style>
<script src="./noscale.js?v=263"></script>
</head>
<body>
<script>
try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}
document.body.addEventListener("click",function(){location.href="./tools.html?home=1&v=263"});
document.body.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" ")location.href="./tools.html?home=1&v=263"});
</script>
</body>
</html>
