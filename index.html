<!DOCTYPE html>

<head>

<style>
html,body{margin:0;min-height:100svh;font-family:-apple-system,sans-serif;color:#3b2f2c;background:#000}

.w{max-width:430px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;box-sizing:border-box;padding:calc(10px + env(safe-area-inset-top)) 14px 24px}
.b{background:rgba(255,255,255,.86);color:#111827;border-radius:14px;padding:12px;line-height:1.45;font-size:15px}
.enter{display:block;text-align:center;background:#d97888;color:#fff;text-decoration:none;padding:16px;border-radius:14px;font-weight:700;font-size:17px;margin:12px 0;flex:none}

</style>
</head>
<body>
<div class="w">
<div class="b" id="hello">你好，欢迎来到全球优选AI导航。我是安安。点下面进入首页，也可以先看视频。</div>
<a class="enter" id="goHome" href="./tools.html?v=192&home=1&lang=zh">进入首页</a>
<video id="v" playsinline webkit-playsinline controls preload="metadata">
  <source src="_users_a225812b-2be1-4613-a32e-8cc822793592_generated_5562c574-e0b1-4b20-8e93-616e70fe0ea6_generated_video.mp4" type="video/mp4"/>
</video>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search).get('lang');
  var lang=q||localStorage.getItem('lang')||'zh';
  if(lang==='en'){
    document.documentElement.lang='en';
    document.title='Global AI Directory';
    document.getElementById('hello').textContent='Hello. Welcome to Global AI Directory. I am Anan. Tap below to enter, or watch the video first.';
    document.getElementById('goHome').textContent='Enter home';
    document.getElementById('goHome').href='./tools.html?v=192&home=1&lang=en';
  }
  document.getElementById('goHome').addEventListener('click',function(){
    localStorage.setItem('aid_welcome','1');
    sessionStorage.setItem('aid_welcome','1');
  });
})();
</script>
