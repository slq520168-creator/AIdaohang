<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>안안 인사</title>
<style>
html,body{margin:0;background:#f4ece6;color:#3b2f2c;font-family:-apple-system,sans-serif}
.wrap{max-width:430px;margin:0 auto;padding:14px;min-height:100dvh;box-sizing:border-box}
a{color:#c56b7a;text-decoration:none;font-size:14px}
.bubble{background:#fff;border-radius:16px 16px 16px 4px;padding:12px 14px;margin:14px 24px 12px 0;line-height:1.7;box-shadow:0 6px 16px #00000012}
button{width:100%;border:0;background:#d97888;color:#fff;padding:14px;border-radius:16px;font-size:16px}
</style>
</head>
<body>
<div class="wrap">
  <a href="./index.html?v=39">← 도마</a>
  <div class="bubble" id="hi">안녕하세요. 글로벌 우수 AI 도마에 오신 것을 환영합니다. 저는 안안입니다.</div>
  <p style="text-align:center;color:#7a6a66">안안 · 한국어 인사</p>
  <button type="button" id="say">한국어로 인사</button>
</div>
<script>
const text='안녕하세요. 글로벌 우수 AI 도마에 오신 것을 환영합니다. 저는 안안입니다.';
function speak(){
  if(!window.speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ko-KR';u.rate=0.95;u.pitch=1.15;
  const vs=speechSynthesis.getVoices();
  const ko=vs.find(v=>v.lang.startsWith('ko'));
  if(ko) u.voice=ko;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
speechSynthesis.onvoiceschanged=()=>{};
document.getElementById('say').onclick=speak;
document.body.addEventListener('click',function once(){speak();document.body.removeEventListener('click',once)},{passive:true});
</script>
</body>
</html>
