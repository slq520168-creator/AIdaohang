<script>
const t='안녕하세요. 글로벌 우수 AI 도마에 오신 것을 환영합니다. 저는 안안입니다.';
document.getElementById('say').onclick=function(){
  const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.95;u.pitch=1.15;
  const v=speechSynthesis.getVoices().find(function(x){return x.lang&&x.lang.indexOf('ko')===0});
  if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);
};
