<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>欢迎 · 全球优选AI导航</title>
<style>
:root{--bg:#fff7f4;--ink:#3a2a28;--pink:#e8899a}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,sans-serif;text-align:center}
.wrap{min-height:100dvh;padding:24px 16px 40px;box-sizing:border-box}
a.back{color:var(--pink);text-decoration:none;font-size:14px}
.stage{width:220px;height:260px;margin:18px auto 8px;position:relative}
.face{width:160px;height:180px;margin:0 auto;background:#f3d0c4;border-radius:80px 80px 70px 70px;position:relative;box-shadow:0 10px 30px #e7b8b055}
.hair{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:188px;height:120px;background:#2b2422;border-radius:90px 90px 20px 20px}
.eye{position:absolute;top:78px;width:14px;height:16px;background:#2b2422;border-radius:50%}
.eye.l{left:48px}.eye.r{right:48px}
.blush{position:absolute;top:100px;width:22px;height:12px;background:#f0a3a388;border-radius:50%}
.blush.l{left:32px}.blush.r{right:32px}
.mouth{position:absolute;left:50%;bottom:42px;width:28px;height:14px;margin-left:-14px;border:3px solid #c45b6a;border-top:none;border-radius:0 0 16px 16px;animation:smile 2.4s ease-in-out infinite}
@keyframes smile{50%{width:34px;margin-left:-17px;height:16px}}
.wave{font-size:28px;animation:w 1.6s ease-in-out infinite}
@keyframes w{50%{transform:rotate(16deg)}}
h1{font-size:20px;margin:8px 0 6px}
p{margin:6px auto;max-width:320px;line-height:1.6;font-size:15px}
button{border:0;background:var(--pink);color:#fff;padding:12px 22px;border-radius:22px;font-size:16px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./index.html?v=39">← 回导航</a>
  <div class="stage">
    <div class="hair"></div>
    <div class="face">
      <i class="eye l"></i><i class="eye r"></i>
      <i class="blush l"></i><i class="blush r"></i>
      <i class="mouth"></i>
    </div>
  </div>
  <div class="wave">👋</div>
  <h1>安安</h1>
  <p>韩国味·柔柔·娇小，体重不过百。欢迎来到全球优选AI导航。</p>
  <p id="line">点下面按钮，听我说一句欢迎。</p>
  <p><button type="button" id="say">微笑打招呼</button></p>
</div>
<script>
const text='你好，欢迎来到全球优选AI导航。我是安安，今晚还顺便吗？';
function speak(){
  document.getElementById('line').textContent=text;
  if(!window.speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';u.rate=0.92;u.pitch=1.25;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
document.getElementById('say').onclick=speak;
setTimeout(speak,600);
</script>
</body>
</html>
