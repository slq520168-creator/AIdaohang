<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>안안</title>
<style>
body{margin:0;background:#f4ece6;font-family:-apple-system,sans-serif;color:#3b2f2c}
.w{max-width:430px;margin:0 auto;padding:14px}
a{color:#c56b7a;text-decoration:none}
img{width:100%;border-radius:18px;display:block;margin:12px 0;background:#e7d0c2;min-height:240px}
.b{background:#fff;border-radius:16px;padding:12px;line-height:1.7}
button{width:100%;border:0;background:#d97888;color:#fff;padding:14px;border-radius:16px;margin-top:12px;font-size:16px}
</style>
</head>
<body>
<div class="w">
<a href="./index.html?v=40">← 导航</a>
<p style="text-align:center;margin:10px 0 0">안안</p>
<img alt="안안" src="annan.jpg"/>
<div class="b">안녕하세요. 글로벌 우수 AI 도마에 오신 것을 환영합니다. 저는 안안입니다.</div>
<button type="button" id="say">한국어로 인사</button>
</div>
<script>
const t='안녕하세요. 글로벌 우수 AI 도마에 오신 것을 환영합니다. 저는 안안입니다.';
document.getElementById('say').onclick=function(){
  const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.95;u.pitch=1.15;
  const v=speechSynthesis.getVoices().find(function(x){return x.lang&&x.lang.indexOf('ko')===0});
  if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);
};
</script>
</body>
</html>
