<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta http-equiv="Cache-Control" content="no-cache"/>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Global AI Directory</title>
<link rel="icon" href="favicon.ico"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="stylesheet" href="style.css?v=316"/>
<style>
#fraudBtn,#makeBtn,#rhBtn,.chip,#lang,#theme{border:1px solid #e5e7eb;background:#fff;color:#111827;border-radius:999px;padding:0 8px;font-size:12px;line-height:26px;height:26px;text-decoration:none;white-space:nowrap;box-sizing:border-box}
.chip,#lang,#theme{display:inline-flex;align-items:center;justify-content:center;height:26px;min-width:0}
html[data-theme="dark"] .chip{background:#21262d;color:#e6edf3;border-color:#30363d}
.search{background:rgba(244,246,251,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 0 0 100vmax rgba(244,246,251,.97);clip-path:inset(0 -100vmax)}
.search.stuck{clip-path:inset(calc(-13px - env(safe-area-inset-top,0px)) -100vmax 0 -100vmax)}
html[data-theme="dark"] .search{background:rgba(7,9,16,.97);box-shadow:0 0 0 100vmax rgba(7,9,16,.97)}
.search.stuck{background:#f4f6fb;box-shadow:0 0 0 100vmax #f4f6fb}
html[data-theme="dark"] .search.stuck{background:#070910;box-shadow:0 0 0 100vmax #070910}
.rank{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:0 10px}

.rank a{padding:4px 2px;gap:6px}
.rank i{width:16px;font-size:12px;line-height:1.2}
.rank strong{font-size:12px;line-height:1.25}
.rank em{font-size:10px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
#searchResults{margin:0 0 12px}
#searchResults:empty{display:none}
</style>
<script src="./noscale.js?v=285"></script>
</head>
<body>
<div id="sitebg" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grain"></div></div>
<div id="scroll">
<header class="top" style="position:relative">
  <div><h1 id="brand" data-i18n="brand">全球优选AI导航</h1></div>
  <div class="acts">
    <a class="chip" href="./face-translate.html" data-i18n="translate">翻译</a>
    <a class="chip" href="./fraud.html" data-i18n="fraud">防骗</a>
    <button id="lang" type="button">Lang</button>
    <button id="theme" type="button">深色</button>
  </div>
  <div id="langBar" class="langbar"></div>
</header>
<form class="search" id="sf"><div class="box"><input id="q" type="search" autocomplete="off" data-i18n-placeholder="search" placeholder="搜索工具"/><button type="submit" id="go">🔍</button></div></form>
<main id="searchResults" class="grid"></main>
<section class="block" id="hotBlock"><div class="block-h"><h2 id="hotTitle" data-i18n="hot">今日热点</h2></div><ol id="hot" class="rank"></ol></section>
<section class="block"><div class="block-h"><h2 id="listTitle" data-i18n="allTools">全部工具</h2></div><div id="side" class="cats"></div><div class="under" id="under"><div id="tags" class="fine"></div><div id="pop"><main id="list" class="grid"></main></div></div></section>
</div>
<script src="./i18n.js?v=285"></script>
<script src="langboot.js?v=190"></script>
<script src="langset.js?v=190"></script>
<script src="tagsplus.js?v=281"></script>
<script src="./app.js?v=288"></script>
<script src="./direct.js?v=3"></script>
<script src="loadmore.js?v=281"></script>
<script>(function(){var sc=document.getElementById("scroll"),f=document.getElementById("sf");if(!sc||!f)return;function u(){var st=sc.scrollTop>0&&f.getBoundingClientRect().top-sc.getBoundingClientRect().top<=parseFloat(getComputedStyle(sc).paddingTop)+1;f.classList.toggle("stuck",st);}sc.addEventListener("scroll",u,{passive:true});window.addEventListener("resize",u);u();})();</script>
<script src="tabbar.js?v=285"></script>
<script src="navapply.js?v=5"></script>
</body>
</html>
