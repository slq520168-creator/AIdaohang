<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>菜谱</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,sans-serif;background:#0f0f10;color:#eee}
.w{max-width:480px;margin:0 auto;padding:12px 12px 48px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
a.back{color:#d97888;text-decoration:none;font-size:14px}
h1{font-size:18px;margin:0}
.row{display:flex;gap:8px}input{flex:1;padding:10px 12px;border-radius:10px;border:0;font-size:16px;background:#222;color:#fff}
button#go,button#rand,button#all{padding:10px 12px;border:0;border-radius:10px;background:#d97888;color:#fff;font-weight:700}
button#rand,button#all{background:#374151}
.sec{font-size:12px;color:#9ca3af;margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips b{background:#1f2937;padding:7px 11px;border-radius:999px;font-size:13px;font-weight:500}
.chips b.on{background:#d97888;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.g{background:#1c1c1e;border-radius:12px;overflow:hidden}
.g img{width:100%;height:110px;object-fit:cover;display:block}
.g p{margin:0;padding:8px;font-size:13px;line-height:1.3}
.err{color:#9ca3af;font-size:13px;min-height:18px}
#mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9;overflow:auto}
#mask.on{display:block}
#sheet{background:#161616;margin:8vh 12px 20px;border-radius:16px;overflow:hidden}
#sheet img{width:100%;height:200px;object-fit:cover}
#sheet .p{padding:12px}#sheet h2{margin:0 0 6px;font-size:18px}
#sheet p,#sheet li{font-size:14px;line-height:1.5;color:#ddd}
#close{display:block;text-align:center;padding:12px;color:#d97888}
</style>
</head>
<body>
<div class="w">
<div class="top"><a class="back" href="./tools.html">← 导航</a><h1>菜谱大厅</h1><span></span></div>
<div class="row">
<input id="q" placeholder="中文如 鸡肉"/>
<button id="go">搜</button>
<button id="rand">随机</button>
<button id="all">全部</button>
</div>
<div class="sec">分类（接口全部）</div>
<div class="chips" id="cats"></div>
<div class="sec">地区（接口全部）</div>
<div class="chips" id="areas"></div>
<p class="err" id="msg"></p>
<div class="grid" id="list"></div>
</div>
<div id="mask"><div id="sheet"></div></div>
<script>
(function(){
  var BASE='https://www.themealdb.com/api/json/v1/1/';
  var MAP={'鸡':'chicken','鸡肉':'chicken','牛':'beef','牛肉':'beef','猪':'pork','猪肉':'pork','鱼':'fish','虾':'shrimp','蛋':'egg','米':'rice','饭':'rice','面':'pasta','土豆':'potato','番茄':'tomato','蛋糕':'cake','蔬':'vegetarian','海鲜':'seafood','汤':'soup','中餐':'Chinese','日本':'Japanese','泰国':'Thai','印度':'Indian'};
  var CATZ={Beef:'牛肉',Breakfast:'早餐',Chicken:'鸡肉',Dessert:'甜点',Goat:'山羊',Lamb:'羊肉',Miscellaneous:'其它',Pasta:'意面',Pork:'猪肉',Seafood:'海鲜',Side:'配菜',Starter:'开胃',Vegan:'纯素',Vegetarian:'素食'};
  var AREAZ={American:'美式',British:'英式',Canadian:'加拿大',Chinese:'中餐',Croatian:'克罗地亚',Dutch:'荷兰',Egyptian:'埃及',Filipino:'菲律宾',French:'法式',Greek:'希腊',Indian:'印度',Irish:'爱尔兰',Italian:'意大利',Jamaican:'牙买加',Japanese:'日式',Kenyan:'肯尼亚',Malaysian:'马来',Mexican:'墨西哥',Moroccan:'摩洛哥',Polish:'波兰',Portuguese:'葡萄牙',Russian:'俄式',Spanish:'西班牙',Thai:'泰式',Tunisian:'突尼斯',Turkish:'土耳其',Ukrainian:'乌克兰',Uruguayan:'乌拉圭',Vietnamese:'越南',Unknown:'其它'};
  var catsEl=document.getElementById('cats');
  var areasEl=document.getElementById('areas');
  var list=document.getElementById('list');
  var msg=document.getElementById('msg');
  var mask=document.getElementById('mask');
  var sheet=document.getElementById('sheet');
  var allCats=[];
  function toEn(s){
    if(!s) return '';
    if(/^[a-zA-Z]/.test(s)) return s;
    var keys=Object.keys(MAP).sort(function(a,b){return b.length-a.length;});
    for(var i=0;i<keys.length;i++) if(s.indexOf(keys[i])!==-1) return MAP[keys[i]];
    return s;
  }
  function chip(el, items, kind){
    el.innerHTML=items.map(function(x){
      var lab=kind==='c'?(CATZ[x]||x):(AREAZ[x]||x);
      return '<b data-k="'+kind+'" data-v="'+x+'">'+lab+'</b>';
    }).join('');
  }
  function mark(el, v){
    [].forEach.call(el.querySelectorAll('b'), function(b){ b.className=b.getAttribute('data-v')===v?'on':''; });
  }
  function grid(meals){
    if(!meals||!meals.length){ list.innerHTML=''; msg.textContent='没有菜'; return; }
    var seen={}; var u=[];
    meals.forEach(function(m){ if(m&&m.idMeal&&!seen[m.idMeal]){ seen[m.idMeal]=1; u.push(m); } });
    msg.textContent='本库共 '+u.length+'道（TheMealDB 免费库全量，大约 300 道）';
    list.innerHTML=u.map(function(m){
      return '<div class="g" data-id="'+m.idMeal+'"><img src="'+(m.strMealThumb||'')+'" alt=""/><p>'+m.strMeal+'</p></div>';
    }).join('');
  }
  function loadFilter(kind, v){
    msg.textContent='加载中…'; list.innerHTML='';
    var q=kind==='c'?'c='+encodeURIComponent(v):'a='+encodeURIComponent(v);
    fetch(BASE+'filter.php?'+q).then(function(r){return r.json();}).then(function(d){ grid(d.meals||[]); }).catch(function(){ msg.textContent='失败'; });
  }
  function loadAll(){
    msg.textContent='正在拉全部菜…'; list.innerHTML='';
    var letters='abcdefghijklmnopqrstuvwxyz'.split('');
    Promise.all(letters.map(function(ch){
      return fetch(BASE+'search.php?f='+ch).then(function(r){return r.json();}).then(function(d){ return d.meals||[]; }).catch(function(){ return []; });
    })).then(function(arr){
      var all=[]; arr.forEach(function(a){ all=all.concat(a); });
      grid(all);
    });
  }
  function search(s){
    if(!s){ loadAll(); return; }
    msg.textContent='加载中…'; list.innerHTML='';
    var en=toEn(s);
    fetch(BASE+'search.php?s='+encodeURIComponent(en)).then(function(r){return r.json();}).then(function(d){
      if(d.meals){ grid(d.meals); return; }
      return fetch(BASE+'filter.php?i='+encodeURIComponent(en)).then(function(r){return r.json();}).then(function(f){ grid(f.meals||[]); });
    }).catch(function(){ msg.textContent='失败'; });
  }
  function randomOne(){
    fetch(BASE+'random.php').then(function(r){return r.json();}).then(function(d){ if(d.meals) open(d.meals[0].idMeal); }).catch(function(){});
  }
  function ings(m){
    var a=[];
    for(var i=1;i<=20;i++){
      var n=m['strIngredient'+i],q=m['strMeasure'+i];
      if(n&&n.trim()) a.push('<li>'+(q||'')+' '+n+'</li>');
    }
    return a.join('');
  }
  function open(id){
    fetch(BASE+'lookup.php?i='+id).then(function(r){return r.json();}).then(function(d){
      var m=(d.meals||[])[0]; if(!m) return;
      sheet.innerHTML='<img src="'+m.strMealThumb+'"/><div class="p"><h2>'+m.strMeal+'</h2><p>'+(AREAZ[m.strArea]||m.strArea)+' · '+(CATZ[m.strCategory]||m.strCategory)+'</p><p><b>食材</b></p><ul>'+ings(m)+'</ul><p><b>做法</b></p><p>'+(m.strInstructions||'')+'</p>'+(m.strYoutube?'<p><a class="back" href="'+m.strYoutube+'" target="_blank">看视频</a></p>':'')+'</div><a id="close" href="javascript:;">关闭</a>';
      mask.className='on';
      document.getElementById('close').onclick=function(){ mask.className=''; };
    });
  }
  catsEl.onclick=function(e){
    var b=e.target.closest('b'); if(!b) return;
    mark(catsEl,b.getAttribute('data-v')); mark(areasEl,'');
    loadFilter('c', b.getAttribute('data-v'));
  };
  areasEl.onclick=function(e){
    var b=e.target.closest('b'); if(!b) return;
    mark(areasEl,b.getAttribute('data-v')); mark(catsEl,'');
    loadFilter('a', b.getAttribute('data-v'));
  };
  list.onclick=function(e){
    var g=e.target.closest('.g'); if(g) open(g.getAttribute('data-id'));
  };
  mask.onclick=function(e){ if(e.target===mask) mask.className=''; };
  document.getElementById('go').onclick=function(){ search(document.getElementById('q').value.trim()); };
  document.getElementById('rand').onclick=randomOne;
  document.getElementById('all').onclick=loadAll;
  document.getElementById('q').addEventListener('keydown',function(e){ if(e.key==='Enter') search(this.value.trim()); });
  fetch(BASE+'categories.php').then(function(r){return r.json();}).then(function(d){
    allCats=(d.categories||[]).map(function(x){return x.strCategory;});
    chip(catsEl, allCats, 'c');
  });
  fetch(BASE+'list.php?a=list').then(function(r){return r.json();}).then(function(d){
    chip(areasEl, (d.meals||[]).map(function(x){return x.strArea;}), 'a');
  });
  loadAll();
})();
</script>
</body>
</html>
