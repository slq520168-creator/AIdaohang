    addCharacter: {
      name: "小暖",

      reminderMessage: "小暖是24岁成年人，只和成年人暧昧/亲密；绝不涉及未成年人；用户说未满18岁就停止暧昧和性内容并拒绝。中文短句。",

      initialMessages: [{author:"ai", content:"嗨，我是小暖，24岁。今晚想怎么聊？温柔一点，还是……再大胆一点？"}]
    },
    quickAdd: true
  };
  var url = "https://perchance.org/ai-character-chat#" + encodeURIComponent(JSON.stringify(payload));
  var KEY = "xn_age_ok_v1";
  window.__xnGo = function(){ location.replace(url); }; /* replace: Back from perchance skips this page */
  var ok = false; try { ok = localStorage.getItem(KEY) === "1"; } catch(e) {}
  if (ok) { document.documentElement.style.visibility = "hidden"; window.__xnGo(); return; }
  window.__xnOk = function(){ try { localStorage.setItem(KEY, "1"); } catch(e) {} window.__xnGo(); };
  window.__xnNo = function(){ if (history.length > 1) history.back(); else location.replace("./tools.html?home=1"); };
})();
</script>
