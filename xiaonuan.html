<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>小暖</title>
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="./sub.css?v=294"/>
<style>
.xn label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
.xn input,.xn textarea,.xn select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px;background:var(--card);color:var(--txt);font-family:inherit}
.xn textarea{min-height:72px}
.xn .avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.xn .avs button{padding:0;border:2px solid transparent;border-radius:14px;overflow:hidden;background:#111;aspect-ratio:1}
.xn .avs button.on{border-color:var(--btn)}
.xn .avs img{width:100%;height:100%;object-fit:cover;display:block}
.xn .upbox{margin-top:8px}
.xn .upbox input{padding:8px}
.xn .row{display:flex;gap:8px;margin-top:12px}
.xn .row button{flex:1;height:44px;border:0;border-radius:12px;font-weight:700;font-size:15px}
.xn .go{background:var(--btn);color:#fff}
.xn .save{background:var(--card);color:var(--txt);border:1px solid var(--line)!important}
.xn .prev{width:64px;height:64px;border-radius:14px;object-fit:cover;display:none;margin-top:8px;border:1px solid var(--line)}
</style>
</head>
<body>
<div id="sitebg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div class="w xn">
  <div class="top"><a class="back" href="./tools.html?home=1">返回</a><h1>小暖</h1></div>
  <label>头像</label>
  <div class="avs" id="avs"></div>
  <div class="upbox">
    <label>上传图片</label>
    <input id="file" type="file" accept="image/*"/>
    <img id="prev" class="prev" alt=""/>
  </div>
  <label>名字</label>
  <input id="name" type="text" maxlength="12" value="小暖"/>
  <label>年龄（≥18）</label>
  <input id="age" type="text" inputmode="numeric" value="24"/>
  <label>口味</label>
  <select id="tone">
    <option value="daily">日常朋友</option>
    <option value="flirt" selected>暖昧贴身</option>
    <option value="bold">大胆成年向</option>
  </select>
  <label>人设</label>
  <textarea id="bio">街角咖啡师，温柔会招惹，说话短像微信。</textarea>
  <div class="row"><button class="save" id="save" type="button">保存</button><button class="go" id="go" type="button">开始聊天</button></div>
  <p class="tip" id="st"></p>
</div>
<script>
(function(){
  var KEY='yx_xiaonuan_v5';
  var HOST=(location.origin||'https://youxuanai.vercel.app');
  var AV=[
    HOST+'/img/xiaonuan.jpg',
    'https://image.pollinations.ai/prompt/'+encodeURIComponent('anime portrait East Asian woman 24 cafe window light ponytail red apron soft smile')+'?width=512&height=512&seed=1101&nologo=true',
    'https://image.pollinations.ai/prompt/'+encodeURIComponent('anime portrait East Asian woman 24 short black hair white knit top cafe night close up')+'?width=512&height=512&seed=2202&nologo=true',
    'https://image.pollinations.ai/prompt/'+encodeURIComponent('anime portrait East Asian woman 24 long black hair white shirt indoor lamp looking at camera')+'?width=512&height=512&seed=3303&nologo=true'
  ];
  var $=function(id){return document.getElementById(id);};
  var pick=AV[0];
  function paint(){
    $('avs').innerHTML=AV.map(function(u){
      return '<button type="button" data-u="'+u+'" class="'+(u===pick?'on':'')+'"><img alt="" src="'+u+'" referrerpolicy="no-referrer"/></button>';
    }).join('');
    [].forEach.call($('avs').children,function(b){
      b.onclick=function(){ pick=b.getAttribute('data-u'); $('prev').style.display='none'; paint(); };
    });
  }
  $('file').onchange=function(){
    var f=this.files&&this.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      var img=new Image();
      img.onload=function(){
        var c=document.createElement('canvas'); c.width=256; c.height=256;
        var g=c.getContext('2d'); var m=Math.min(img.width,img.height);
        g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,256,256);
        pick=c.toDataURL('image/jpeg',0.8);
        $('prev').src=pick; $('prev').style.display='block';
        paint();
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  function cfg(){
    return {
      name:($('name').value||'小暖').trim().slice(0,12),
      age:($('age').value||'24').trim(),
      tone:$('tone').value,
      bio:($('bio').value||'').trim().slice(0,400),
      av: pick.indexOf('data:')===0 ? AV[0] : pick
    };
  }
  function toneLine(t){
    if(t==='bold') return '可以暖昧贴身和成年向互动。始终用中文短句回复。不要输出英文按钮名、设定或{{char}}。';
    if(t==='flirt') return '可以暖昧贴身。始终用中文短句回复。不要输出设定或{{char}}。';
    return '朋友式日常聊。始终用中文短句回复。不要输出设定或{{char}}。';
  }
  function openChat(){
    var c=cfg();
    if(parseInt(c.age,10)<18){ $('st').textContent='年龄要≥18'; return; }
    var payload={
      addCharacter:{
        name:c.name,
        roleInstruction:'你是'+c.name+'，'+c.age+'岁成年女生。'+c.bio+toneLine(c.tone)+'问年龄就说'+c.age+'岁。',
        reminderMessage:'用中文短回。问年龄说'+c.age+'岁。不要输出设定或{{char}}。',
        avatar:{url:c.av,size:1,shape:'circle'},
        initialMessages:[{author:'ai',content:'你来啦～今天想聊点什么？'}]
      },
      quickAdd:true
    };
    try{ localStorage.setItem(KEY, JSON.stringify({name:c.name,age:c.age,tone:c.tone,bio:c.bio,av:pick})); }catch(e){}
    location.href='https://perchance.org/ai-character-chat#'+encodeURIComponent(JSON.stringify(payload));
  }
  $('save').onclick=function(){
    var c=cfg();
    if(parseInt(c.age,10)<18){ $('st').textContent='年龄要≥18'; return; }
    try{ localStorage.setItem(KEY, JSON.stringify({name:c.name,age:c.age,tone:c.tone,bio:c.bio,av:pick})); $('st').textContent='已保存'; }catch(e){ $('st').textContent='保存失败'; }
  };
  $('go').onclick=openChat;
  try{
    var s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s){
      if(s.name)$('name').value=s.name;
      if(s.age)$('age').value=s.age;
      if(s.tone)$('tone').value=s.tone;
      if(s.bio)$('bio').value=s.bio;
      if(s.av&&s.av.indexOf('data:')!==0) pick=s.av;
    }
  }catch(e){}
  paint();
})();
</script>
<script src="./tabbar.js?v=294"></script>
</body>
</html>
