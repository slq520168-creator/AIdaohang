<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>小暖</title>
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="./sub.css?v=296"/>
<style>
.xn label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
.xn input,.xn textarea,.xn select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px;background:var(--card);color:var(--txt);font-family:inherit}
.xn textarea{min-height:120px}
.xn .avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.xn .avs button{padding:0;border:2px solid transparent;border-radius:14px;overflow:hidden;background:#111;aspect-ratio:1}
.xn .avs button.on{border-color:var(--btn)}
.xn .avs img{width:100%;height:100%;object-fit:cover;display:block}
.xn .tones{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.xn .tones button{height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--txt);font-size:13px}
.xn .tones button.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.xn .row{display:flex;gap:8px;margin-top:14px}
.xn .row button{flex:1;height:46px;border:0;border-radius:12px;font-weight:700;font-size:15px}
.xn .go{background:var(--btn);color:#fff}
.xn .save{background:var(--card);color:var(--txt);border:1px solid var(--line)!important}
.xn .prev{width:64px;height:64px;border-radius:14px;object-fit:cover;display:none;margin-top:8px}
</style>
</head>
<body>
<div id="sitebg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div class="w xn">
  <div class="top"><a class="back" href="./tools.html?home=1">返回</a><h1>小暖</h1></div>

  <label>头像（先选一张）</label>
  <div class="avs" id="avs"></div>
  <label>上传图片</label>
  <input id="file" type="file" accept="image/*"/>
  <img id="prev" class="prev" alt=""/>

  <label>名字</label>
  <input id="name" type="text" maxlength="12" value="小暖"/>

  <label>年龄（≥18）</label>
  <input id="age" type="text" inputmode="numeric" value="24"/>

  <label>聊天尺度（大胆在这里）</label>
  <div class="tones" id="tones">
    <button type="button" data-v="daily">日常</button>
    <button type="button" data-v="flirt">暖昧</button>
    <button type="button" data-v="bold" class="on">大胆聊天</button>
  </div>

  <label>人设（直接改这里的字）</label>
  <textarea id="bio">街角咖啡师。温柔、会招惹、喜欢贴着聊。说话短，像微信。</textarea>

  <div class="row">
    <button class="save" id="save" type="button">保存人设</button>
    <button class="go" id="go" type="button">按这个人设去聊</button>
  </div>
  <p class="tip" id="st">改完人设和尺度，再点右边按钮才会带进聊天。</p>
</div>
<script>
(function(){
  var KEY='yx_xiaonuan_v7';
  var HOST=location.origin||'https://youxuanai.vercel.app';
  var AV=[
    HOST+'/img/xiaonuan.jpg',
    'https://image.pollinations.ai/prompt/'+encodeURIComponent('anime portrait East Asian woman 24 cafe window ponytail red apron smile')+'?width=512&height=512&seed=1101&nologo=true',
    'https://image.pollinations.ai/prompt/'+encodeURIComponent('anime portrait East Asian woman 24 short black hair white knit top night cafe')+'?width=512&height=512&seed=2202&nologo=true',
    'https://image.pollinations.ai/prompt/'+encodeURIComponent('anime portrait East Asian woman 24 long black hair white shirt indoor lamp')+'?width=512&height=512&seed=3303&nologo=true'
  ];
  var $=function(id){return document.getElementById(id);};
  var pick=AV[0], tone='bold';
  function paintAv(){
    $('avs').innerHTML=AV.map(function(u){
      return '<button type="button" data-u="'+u+'" class="'+(u===pick?'on':'')+'"><img alt="" src="'+u+'" referrerpolicy="no-referrer"/></button>';
    }).join('');
    [].forEach.call($('avs').children,function(b){
      b.onclick=function(){ pick=b.getAttribute('data-u'); paintAv(); };
    });
  }
  function paintTone(){
    [].forEach.call($('tones').children,function(b){
      b.className=b.getAttribute('data-v')===tone?'on':'';
    });
  }
  $('tones').onclick=function(e){
    var b=e.target.closest('button'); if(!b) return;
    tone=b.getAttribute('data-v'); paintTone();
  };
  $('file').onchange=function(){
    var f=this.files&&this.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      var img=new Image();
      img.onload=function(){
        var c=document.createElement('canvas'); c.width=256;c.height=256;
        var g=c.getContext('2d'), m=Math.min(img.width,img.height);
        g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,256,256);
        $('prev').src=c.toDataURL('image/jpeg',0.8); $('prev').style.display='block';
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  function cfg(){
    return {
      name:($('name').value||'小暖').trim().slice(0,12),
      age:($('age').value||'24').trim(),
      tone:tone,
      bio:($('bio').value||'').trim().slice(0,600),
      av:pick
    };
  }
  function store(c){ try{ localStorage.setItem(KEY, JSON.stringify(c)); }catch(e){} }
  function role(c){
    var extra=c.tone==='bold'?'可以暖昧、贴身、大胆的成年向互动。':c.tone==='flirt'?'可以暖昧贴身。':'只作日常朋友聊。';
    return '你叫'+c.name+'，'+c.age+'岁。'+c.bio+extra+'用中文短句回。问多大就说'+c.age+'岁。只说对话，不要把人设念出来。';
  }
  $('save').onclick=function(){
    var c=cfg();
    if(parseInt(c.age,10)<18){ $('st').textContent='年龄要≥18'; return; }
    store(c); $('st').textContent='人设已保存，再点「按这个人设去聊」';
  };
  $('go').onclick=function(){
    var c=cfg();
    if(parseInt(c.age,10)<18){ $('st').textContent='年龄要≥18'; return; }
    store(c);
    var payload={addCharacter:{name:c.name,roleInstruction:role(c),avatar:{url:c.av,size:1,shape:'circle'},initialMessages:[{author:'ai',content:'你来啦～想聊点什么？'}]},quickAdd:true};
    location.href='https://perchance.org/ai-character-chat#'+encodeURIComponent(JSON.stringify(payload));
  };
  try{
    var s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s){
      if(s.name)$('name').value=s.name;
      if(s.age)$('age').value=s.age;
      if(s.bio)$('bio').value=s.bio;
      if(s.tone) tone=s.tone;
      if(s.av) pick=s.av;
    }
  }catch(e){}
  paintAv(); paintTone();
})();
</script>
<script src="./tabbar.js?v=296"></script>
</body>
</html>
