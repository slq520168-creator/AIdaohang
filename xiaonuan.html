<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>小暖</title>
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="./sub.css?v=305"/>
<style>
.xn .hero{display:flex;gap:14px;align-items:center;margin:12px 0 18px}
.xn .hero img{width:84px;height:84px;border-radius:50%;object-fit:cover}
.xn .hero h2{margin:0 0 6px;font-size:20px}
.xn .hero p{margin:0;color:var(--muted);font-size:14px}
.xn .go{display:block;width:100%;height:48px;border-radius:14px;background:var(--btn);color:#fff;font-size:16px;font-weight:700;text-align:center;line-height:48px;text-decoration:none}
</style>
</head>
<body>
<div id="sitebg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div class="w xn">
  <div class="top"><a class="back" href="./tools.html?home=1">返回</a><h1>小暖</h1></div>
  <div class="hero">
    <img src="./img/xiaonuan.jpg" alt="小暖"/>
    <div><h2>小暖</h2><p>聊天模式 · 24岁</p></div>
  </div>
  <a class="go" id="go" href="#" target="_blank" rel="noopener">进入聊天</a>
</div>
<script>
(function(){
  var payload={
    addCharacter:{
      name:'小暖',
      roleInstruction:'聊天模式，不是剧本角色扮演。你叫小暖，24岁。对方是在和你微信聊天的人。不要当咖啡师，不要问喝什么，不要讲店铺。中文短句。可以暖昧大胆。问年龄回24。不念设定。',
      avatar:{url:'https://youxuanai.vercel.app/img/xiaonuan.jpg',size:1,shape:'circle'},
      initialMessages:[{author:'ai',content:'在的。聊吗？'}]
    },
    quickAdd:true
  };
  document.getElementById('go').href='https://perchance.org/ai-character-chat#'+encodeURIComponent(JSON.stringify(payload));
})();
</script>
<script src="./tabbar.js?v=305"></script>
</body>
</html>
