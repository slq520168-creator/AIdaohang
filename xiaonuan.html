<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>小暖</title>
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="./sub.css?v=297"/>
<style>
.xn label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
.xn input,.xn textarea,.xn select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px;background:var(--card);color:var(--txt);font-family:inherit}
.xn textarea{min-height:100px}
.xn .avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.xn .avs button{padding:0;border:2px solid transparent;border-radius:14px;overflow:hidden;background:#111;aspect-ratio:1}
.xn .avs button.on{border-color:var(--btn)}
.xn .avs img{width:100%;height:100%;object-fit:cover;display:block}
.xn .tones{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.xn .tones button{height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--txt);font-size:13px}
.xn .tones button.on{background:var(--btn);color:#fff;border-color:transparent}
.xn .row{display:flex;gap:8px;margin-top:12px}
.xn .row button,.xn .send{height:44px;border:0;border-radius:12px;font-weight:700}
.xn .go{flex:1;background:var(--btn);color:#fff}
.xn .save{flex:1;background:var(--card);color:var(--txt);border:1px solid var(--line)!important}
.xn .hid{display:none}
.xn .log{height:52vh;overflow:auto;padding:8px 4px}
.xn .m{display:flex;gap:8px;margin:0 0 12px;align-items:flex-end}
.xn .m.me{flex-direction:row-reverse}
.xn .m img{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none}
.xn .m .b{max-width:74%;padding:8px 10px;border-radius:14px;font-size:15px;line-height:1.45}
.xn .m.ai .b{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.xn .m.me .b{background:var(--btn);color:#fff;border-bottom-right-radius:4px}
.xn .in{display:flex;gap:8px}
.xn .in textarea{min-height:44px;flex:1}
.xn .send{width:72px;background:var(--btn);color:#fff}
.xn .prev{width:56px;height:56px;border-radius:12px;display:none;margin-top:8px;object-fit:cover}
</style>
</head>
<body>
<div id="sitebg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div class="w xn">
  <div class="top"><a class="back" href="./tools.html?home=1">返回</a><h1>小暖</h1></div>
  <div id="setup">
    <label>头像</label>
    <div class="avs" id="avs"></div>
    <label>上传图片</label>
    <input id="file" type="file" accept="image/*"/>
    <img id="prev" class="prev" alt=""/>
    <label>名字</label>
    <input id="name" type="text" maxlength="12" value="小暖"/>
    <label>年龄（≥18）</label>
    <input id="age" type="text" inputmode="numeric" value="24"/>
    <label>聊天模式</label>
    <div class="tones" id="tones">
      <button type="button" data-v="daily">日常</button>
      <button type="button" data-v="flirt">暖昧</button>
      <button type="button" data-v="bold" class="on">大胆</button>
    </div>
    <label>人设（想当什么写什么，不一定是咖啡师）</label>
    <textarea id="bio">24岁，会撒娇会招惹，说话短。场景不限定咖啡馆。</textarea>
    <div class="row"><button class="save" id="save" type="button">保存</button><button class="go" id="go" type="button">开始聊天</button></div>
  </div>
  <div id="chat" class="hid">
    <div class="log" id="log"></div>
    <div class="in"><textarea id="inp" rows="2" placeholder="说点什么…"></textarea><button class="send" id="send" type="button">发送</button></div>
    <div class="row"><button class="save" id="backset" type="button">改人设/模式</button></div>
  </div>
  <p class="tip" id="st"></p>
</div>
<script>
(function(){
  var KEY='yx_xiaonuan_v8';
  var HOST=location.origin||'https://youxuanai.vercel.app';
  var AV=[
    HOST+'/img/xiaonuan.jpg',
    'https://image.pollinations.ai/prompt/'+encodeURIComponent('anime portrait East Asian woman 24 cafe window ponytail red apron smile')+'?width=512&height=512&seed=1101&nologo=true',
    'https://image.pollinations.ai/prompt/'+encodeURIComponent('anime portrait East Asian woman 24 short black hair white knit top night')+'?width=512&height=512&seed=2202&nologo=true',
    'https://image.pollinations.ai/prompt/'+encodeURIComponent('anime portrait East Asian woman 24 long black hair white shirt indoor')+'?width=512&height=512&seed=3303&nologo=true'
  ];
  var $=function(id){return document.getElementById(id);};
  var pick=AV[0], tone='bold', hist=[], busy=false;
  function paintAv(){
    $('avs').innerHTML=AV.map(function(u){return '<button type="button" data-u="'+u+'" class="'+(u===pick?'on':'')+'"><img alt="" src="'+u+'" referrerpolicy="no-referrer"/></button>';}).join('');
    [].forEach.call($('avs').children,function(b){ b.onclick=function(){ pick=b.getAttribute('data-u'); paintAv(); }; });
  }
  function paintTone(){ [].forEach.call($('tones').children,function(b){ b.className=b.getAttribute('data-v')===tone?'on':''; }); }
  $('tones').onclick=function(e){ var b=e.target.closest('button'); if(!b)return; tone=b.getAttribute('data-v'); paintTone(); };
  $('file').onchange=function(){
    var f=this.files&&this.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){ var img=new Image(); img.onload=function(){ var c=document.createElement('canvas'); c.width=256;c.height=256; var g=c.getContext('2d'),m=Math.min(img.width,img.height); g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,256,256); pick=c.toDataURL('image/jpeg',0.8); $('prev').src=pick; $('prev').style.display='block'; paintAv(); }; img.src=rd.result; };
    rd.readAsDataURL(f);
  };
  function cfg(){ return {name:($('name').value||'小暖').trim().slice(0,12), age:($('age').value||'24').trim(), tone:tone, bio:($('bio').value||'').trim().slice(0,600), av:pick}; }
  function sys(c){
    var mode=c.tone==='bold'?'聊天模式：大胆成年向，可以暖昧贴身和色情暗示。':c.tone==='flirt'?'聊天模式：暖昧贴身。':'聊天模式：日常朋友。';
    return '你叫'+c.name+'，'+c.age+'岁。人设：'+c.bio+mode+'用中文短句回。不要自设咖啡馆场景，除非对方提到。问年龄说'+c.age+'岁。不要念人设。';
  }
  function showChat(on){ $('setup').className=on?'hid':''; $('chat').className=on?'':'hid'; }
  function esc(s){return String(s).replace(/[&<>]/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[x];});}
  function render(){
    var c=cfg();
    $('log').innerHTML=hist.map(function(m){
      if(m.r==='me') return '<div class="m me"><div class="b">'+esc(m.t)+'</div></div>';
      return '<div class="m ai"><img alt="" src="'+c.av+'"/><div class="b">'+esc(m.t)+'</div></div>';
    }).join('');
    $('log').scrollTop=$('log').scrollHeight;
  }
  async function ask(c, text){
    var payload={sys:sys(c), q:text, messages:[{role:'system',content:sys(c)},{role:'user',content:text}]};
    try{
      var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      var t=String(await r.text()).trim();
      if(t) return t;
    }catch(e){}
    try{
      var g=await fetch('https://text.pollinations.ai/'+encodeURIComponent(sys(c)+'\n用户：'+text+'\n你：'));
      var t2=String(await g.text()).trim();
      if(t2) return t2;
    }catch(e){}
    return '信号有点慢，你再发一条。';
  }
  $('save').onclick=function(){ var c=cfg(); if(parseInt(c.age,10)<18){$('st').textContent='年龄≥18';return;} try{localStorage.setItem(KEY,JSON.stringify(c));$('st').textContent='已保存';}catch(e){$('st').textContent='图太大';} };
  $('go').onclick=function(){ var c=cfg(); if(parseInt(c.age,10)<18){$('st').textContent='年龄≥18';return;} try{localStorage.setItem(KEY,JSON.stringify(c));}catch(e){} hist=[{r:'ai',t:'嗯，我在。想聊什么？'}]; showChat(true); render(); };
  $('backset').onclick=function(){ showChat(false); };
  $('send').onclick=async function(){
    if(busy) return;
    var text=($('inp').value||'').trim(); if(!text) return;
    $('inp').value=''; hist.push({r:'me',t:text}); hist.push({r:'ai',t:'…'}); render();
    busy=true; $('send').disabled=true;
    var a=await ask(cfg(), text);
    hist.pop(); hist.push({r:'ai',t:a}); render();
    busy=false; $('send').disabled=false;
  };
  try{ var s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s){ if(s.name)$('name').value=s.name; if(s.age)$('age').value=s.age; if(s.bio)$('bio').value=s.bio; if(s.tone)tone=s.tone; if(s.av)pick=s.av; } }catch(e){}
  paintAv(); paintTone();
})();
</script>
<script src="./tabbar.js?v=297"></script>
</body>
</html>
