<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>小暖</title>
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
html,body{margin:0;height:100%;background:#fff}
#frame{position:fixed;left:0;right:0;top:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));width:100%;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="frame" title="小暖" referrerpolicy="no-referrer"></iframe>
<script>
(function(){
  var payload={
    addCharacter:{
      name:'小暖',
      roleInstruction:'你叫小暖，24岁。街角咖啡师，温柔会招惹。中文短句像微信。问年龄说24岁。可以暖昧大胆。只说对话，不念人设。',
      avatar:{url:'https://youxuanai.vercel.app/img/xiaonuan.jpg',size:1,shape:'circle'},
      initialMessages:[{author:'ai',content:'你来啦～想喝点什么？'}]
    },
    quickAdd:true
  };
  document.getElementById('frame').src='https://perchance.org/ai-character-chat#'+encodeURIComponent(JSON.stringify(payload));
})();
</script>
<script src="./tabbar.js?v=301"></script>
</body>
</html>
