<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>电影</title>
<style>
body{margin:0;font-family:-apple-system,PingFang SC,sans-serif;background:#f4f6fb;color:#111}
.w{padding:10px 10px 88px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.cats button{flex:0 0 auto;height:28px;padding:0 12px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;font-size:12px}
.cats button.on{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#fff;border:0;border-radius:12px;overflow:hidden;padding:0;text-align:left;width:100%}
.card img{width:100%;height:150px;object-fit:cover;display:block;background:#111}
.card b{display:block;padding:8px 8px 2px;font-size:13px}
.card em{display:block;padding:0 8px 8px;font-style:normal;color:#6b7280;font-size:11px}
.player{display:none;position:fixed;inset:0;background:#000;z-index:40}
.player.on{display:block}
.player .x{height:44px;width:100%;border:0;background:#111;color:#fff}
.player iframe{width:100%;height:calc(100% - 44px);border:0}
</style>
</head>
<body>
<div class="w">
  <a href="./tools.html?home=1">返回</a>
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="player" id="player"><button class="x" id="close" type="button">关闭</button><iframe id="frame" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
<script>
var F={
"电影":[
["卡萨布兰卡","Casablanca1942","https://archive.org/services/img/Casablanca1942"],
["谜中谜","Charade1963","https://archive.org/services/img/Charade1963"],
["夜长梦多","BigSleep1946","https://archive.org/services/img/BigSleep1946"],
["活死人之夜","night_of_the_living_dead","https://archive.org/services/img/night_of_the_living_dead"],
["星期五女郎","his_girl_friday","https://archive.org/services/img/his_girl_friday"]
],
"电视剧":[
["福尔摩斯","sherlockholmes","https://archive.org/services/img/sherlockholmes"],
["独行侠","TheLoneRanger","https://archive.org/services/img/TheLoneRanger"],
["超人","superman_batman_1940s","https://archive.org/services/img/superman_batman_1940s"]
],
"动漫":[
["教皇耶","Popeye_Alien","https://archive.org/services/img/Popeye_Alien"],
["大力水手","popeye","https://archive.org/services/img/popeye"],
["贝蒂娃娃","bettyboop","https://archive.org/services/img/bettyboop"]
],
"纪录片":[
["北方的纳努克","nanookOfTheNorth","https://archive.org/services/img/nanookOfTheNorth"],
["柏林：城市交响曲","BerlinSymphonyofaGreatCity","https://archive.org/services/img/BerlinSymphonyofaGreatCity"],
["人类的故事","The.Story.of.Mankind","https://archive.org/services/img/The.Story.of.Mankind"]
],
"综艺":[
["卓别林演讲","TheGreatDictator","https://archive.org/services/img/TheGreatDictator"],
["摩登时代","modern_times","https://archive.org/services/img/modern_times"]
],
"短剧":[
["将军号","TheGeneral_201401","https://archive.org/services/img/TheGeneral_201401"],
["我的高德弗里","my_man_godfrey","https://archive.org/services/img/my_man_godfrey"]
],
"电视直播":[
["央视直播","https://tv.cctv.com/live/","https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/CCTV_Logo.svg/320px-CCTV_Logo.svg.png"],
["Pluto TV","https://pluto.tv/","https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Pluto_TV_logo.svg/320px-Pluto_TV_logo.svg.png"]
]
};
var cur="电影";
var cats=document.getElementById("cats"), grid=document.getElementById("grid");
function paint(){
  cats.innerHTML=Object.keys(F).map(function(k){return '<button type="button" data-k="'+k+'" class="'+(k===cur?"on":"")+'">'+k+"</button>";}).join("");
  grid.innerHTML=(F[cur]||[]).map(function(x,i){
    return '<button class="card" data-i="'+i+'"><img alt="" src="'+x[2]+'"><b>'+x[0]+'</b><em>点开播放</em></button>';
  }).join("");
}
cats.onclick=function(e){var b=e.target.closest("button"); if(!b) return; cur=b.dataset.k; paint();};
grid.onclick=function(e){
  var c=e.target.closest(".card"); if(!c) return;
  var x=F[cur][+c.dataset.i];
  var src=/^https?:/.test(x[1])?x[1]:("https://archive.org/embed/"+x[1]);
  document.getElementById("frame").src=src;
  document.getElementById("player").className="player on";
};
document.getElementById("close").onclick=function(){document.getElementById("player").className="player"; document.getElementById("frame").src="";};
paint();
</script>
<script src="tabbar.js?v=319"></script>
</body></html>
