<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>电影</title>
<style>
body{margin:0;font-family:-apple-system,PingFang SC,sans-serif;background:#f4f6fb;color:#111}
.w{padding:10px 10px 88px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.cats button{flex:0 0 auto;height:28px;padding:0 12px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;font-size:12px}
.cats button.on{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#fff;border-radius:12px;overflow:hidden;border:0;padding:0;text-align:left;width:100%}
.card img{width:100%;height:132px;object-fit:cover;display:block;background:#111}
.card b{display:block;padding:6px 8px 8px;font-size:13px}
.player{display:none;position:fixed;inset:0;background:#000;z-index:30}
.player.on{display:block}
.player iframe{width:100%;height:calc(100% - 44px);border:0}
.player .x{height:44px;width:100%;border:0;background:#111;color:#fff}
</style>
</head>
<body>
<div class="w">
  <a href="./tools.html?home=1">返回</a>
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="player" id="player"><button class="x" type="button" id="close">关闭</button><iframe id="frame" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
<script>
var F={
"经典":[["活死人之夜","night_of_the_living_dead"],["谜中谜","Charade1963"],["星期五女郎","his_girl_friday"],["将军号","TheGeneral_201401"]],
"喜剧":[["我的高德弗里","my_man_godfrey"],["迪克和简","DickAndJane1977"]],
"惊悚":[["夜长梦多","TheBigSleep1946"],["卡萨布兰卡","Casablanca1942"]],
"纪录":[["北方的纳努克","nanookOfTheNorth"],["柏林：城市交响曲","BerlinSymphonyofaGreatCity"]],
"短片":[["大独裁者演讲","TheGreatDictator"],["摩登时代","modern_times"]]
};
var cur="经典";
var cats=document.getElementById("cats"), grid=document.getElementById("grid");
function paint(){
  cats.innerHTML=Object.keys(F).map(function(k){return '<button type="button" data-k="'+k+'" class="'+(k===cur?"on":"")+'">'+k+"</button>";}).join("");
  grid.innerHTML=(F[cur]||[]).map(function(x){return '<button class="card" data-id="'+x[1]+'"><img alt="" src="https://archive.org/services/img/'+x[1]+'"><b>'+x[0]+"</b></button>";}).join("");
}
cats.onclick=function(e){var b=e.target.closest("button"); if(!b) return; cur=b.dataset.k; paint();};
grid.onclick=function(e){var c=e.target.closest(".card"); if(!c) return; document.getElementById("frame").src="https://archive.org/embed/"+c.dataset.id; document.getElementById("player").className="player on";};
document.getElementById("close").onclick=function(){document.getElementById("player").className="player"; document.getElementById("frame").src="";};
paint();
</script>
<script src="tabbar.js?v=317"></script>
</body>
</html>
