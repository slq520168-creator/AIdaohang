<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Guide</title>
<link rel="stylesheet" href="style.css?v=107"/>
<style>
#box{display:block;padding:16px 16px 40px;margin:8px 0 24px;line-height:1.8;background:#fff;border:1px solid #e5e7eb}
#box h3{font-size:20px;margin-bottom:6px}
#box .sub{color:#6b7280;font-size:13px;margin-bottom:8px;word-break:break-all}
#box ol{margin:8px 0 0 18px}
#box li{margin:0 0 12px}
#box a.btn{display:inline-block;margin-top:12px;background:#2563eb;color:#fff;text-decoration:none;padding:10px 14px;border-radius:12px}
#gate{position:fixed;inset:0;z-index:99999;background:rgba(20,16,14,.62);display:flex;align-items:center;justify-content:center;padding:18px}
.gatebox{width:100%;max-width:340px;background:#fff;border-radius:16px;padding:20px 18px 18px}
.gatet{margin:0 0 12px;font-size:18px;font-weight:600;color:#3b2f2c}
#gateIn{width:100%;box-sizing:border-box;border:1px solid #d9cfc8;border-radius:12px;padding:12px;font-size:16px;margin:0 0 12px}
#gateGo{width:100%;border:0;background:#d97888;color:#fff;border-radius:12px;padding:12px;font-size:16px;font-weight:600}
#gateErr{visibility:hidden;color:#c0392b;font-size:13px;margin:10px 0 0}
</style>
</head>
<body>
<div id="sitebg" aria-hidden="true"></div>
<div id="scroll">
<header class="top"><a href="tools.html?v=107" style="color:inherit;text-decoration:none">← 返回</a></header>
<article class="card" id="box">加载中…</article>
</div>
<script src="lock.js?v=107"></script>
<script>
function esc(s){return String(s||'').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"')}
function splitHow(how){
  const t=String(how||'').trim();
  if(!t) return [];
  const parts=t.split(/(?:\d+[.\u3001\u3002]\s*|\u3002|;|\n)+/).map(x=>x.trim()).filter(x=>x.length>1);
  return parts.length?parts:[t];
}
function isHttp(u){return /^https?:\/\//i.test(u||'')}
(async()=>{
  const box=document.getElementById('box');
  const n=decodeURIComponent(new URLSearchParams(location.search).get('n')||'');
  const v='107';
  const guideFiles=['data/hot-guides.json?v='+v,'data/hot-guides2.json?v='+v,'data/hot-guides3.json?v='+v];
  const maps=await Promise.all(guideFiles.map(f=>fetch(f).then(r=>r.ok?r.json():{}).catch(()=>{})));
  let g=null;
  for(const m of maps){
    if(!m||typeof m!=='object') continue;
    if(m[n]) {g=m[n]; break;}
    const hit=Object.keys(m).find(k=>k===n || (m[k]&&m[k].title===n));
    if(hit){g=m[hit]; break;}
  }
  if(g&&Array.isArray(g.steps)&&g.steps.length){
    document.title=g.title||n;
    box.innerHTML='<h3>'+esc(g.title||n)+'</h3><p class="sub">通宵教程</p><ol>'+g.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>';
    return;
  }
  const files=['data/packs.json?v='+v,'data/tools.json?v='+v,'data/more.json?v='+v];
  for(let i=2;i<=125;i++) files.push('data/more'+i+'.json?v='+v);
  const arrs=await Promise.all(files.map(f=>fetch(f).then(r=>r.ok?r.json():[]).catch(()=>[])));
  const t=arrs.flat().find(x=>x&&x.name===n)||{name:n,url:'',desc:'',how:''};
  let steps=splitHow(t.how);
  if(!steps.length) steps=[t.desc||'点下面打开官网'];
  document.title=t.name||n;
  const url=isHttp(t.url)?t.url:'';
  const btn=url
    ?('<p class="sub">'+esc(url)+'</p><p><a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener">打开官网</a></p>')
    :'<p class="sub">这条没有网址</p>';
  box.innerHTML='<h3>'+esc(t.name||n)+'</h3><p class="sub">'+esc(t.desc||t.cat||'')+'</p><ol>'+steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>'+btn;
})();
</script>
</body>
</html>
