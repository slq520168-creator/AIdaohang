<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>小说</title>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
html,body{margin:0;background:#f3f0ea;color:#111;font-family:-apple-system,"PingFang SC",sans-serif}
.w{padding:12px 12px 88px}
h1{margin:6px 0 8px;font-size:18px}
label{display:block;font-size:13px;color:#6b7280;margin:10px 0 6px}
input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:10px;padding:10px;font:16px/1.45 inherit;background:#fff}
textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:8px;margin-top:12px}
button{flex:1;height:44px;border:0;border-radius:10px;background:#111;color:#fff;font-size:16px;font-weight:700}
button.sub{background:#fff;color:#111;border:1px solid #ddd}
button:disabled{opacity:.55}
.st{min-height:20px;margin:8px 0;font-size:13px;color:#6b7280}
.st.err{color:#dc2626}
.out{white-space:pre-wrap;background:#fff;border-radius:12px;padding:14px;min-height:180px;line-height:1.7;font-size:15px}
html[data-theme=dark],html[data-theme=dark] body{background:#05060a;color:#e6edf3}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea,html[data-theme=dark] .out{background:#161b22;color:#e6edf3;border-color:#30363d}
html[data-theme=dark] button{background:#2563eb;color:#fff}
html[data-theme=dark] button.sub{background:#161b22;color:#e6edf3;border-color:#30363d}
</style>
</head>
<body>
<div class="w">
  <h1>写小说</h1>
  <label>主题</label>
  <textarea id="theme" placeholder="写什么故事，人物和结局一并写上"></textarea>
  <label>类型</label>
  <select id="genre">
    <option>都市</option><option>言情</option><option>玄幻</option>
    <option>悬疑</option><option>科幻</option><option>战神</option><option>古言</option>
  </select>
  <div class="row">
    <button id="go" type="button">生成第一章</button>
    <button id="more" class="sub" type="button">续写下一章</button>
  </div>
  <div class="st" id="st"></div>
  <div class="out" id="out"></div>
</div>
<script>
(function(){
  var theme=document.getElementById('theme');
  var genre=document.getElementById('genre');
  var go=document.getElementById('go');
  var more=document.getElementById('more');
  var st=document.getElementById('st');
  var out=document.getElementById('out');
  var chap=0,busy=false,book='';
  function set(t,c){st.textContent=t||'';st.className='st'+(c?' '+c:'');}
  async function gen(cont){
    var idea=(theme.value||'').trim();
    if(!idea){set('先写主题','err');theme.focus();return;}
    if(busy)return;busy=true;go.disabled=more.disabled=true;
    if(!cont){chap=1;book='';out.textContent='';}else chap+=1;
    set('正在写第'+chap+'章');
    var q=cont
      ? ('你是小说作家。类型：'+genre.value+'\n主题：'+idea+'\n接上文续写第'+chap+'章，只输出正文：\n'+book.slice(-900))
      : ('你是小说作家。类型：'+genre.value+'\n主题：'+idea+'\n写第1章中文正文约2000字，有章标题，不要解释。');
    try{
      var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'novel',sys:'你是专业小说作家，只写正文。',q:q})});
      var t=String(await r.text()||'').trim();
      if(!t)throw 1;
      book+=(book?'\n\n':'')+t;
      out.textContent=book;
      set('已写到第'+chap+'章');
    }catch(e){set('失败，再点','err');}
    busy=false;go.disabled=more.disabled=false;
  }
  go.onclick=function(){gen(false);};
  more.onclick=function(){if(!book)gen(false);else gen(true);};
})();
</script>
<script src="tabbar.js?v=313"></script>
</body></html>
