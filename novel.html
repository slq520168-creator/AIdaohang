<style>
html,body{margin:0;background:#f3f0ea;color:#111;font-family:-apple-system,"PingFang SC",sans-serif;overflow-x:hidden}
.w{padding:12px 12px 88px;max-width:760px;margin:0 auto;box-sizing:border-box}
.hd{display:flex;align-items:center;gap:8px;margin:6px 0 8px}
h1{margin:0;font-size:18px;flex:1;min-width:0}
label{display:block;font-size:13px;color:#6b7280;margin:10px 0 6px}
input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:10px;padding:10px;font:16px/1.45 inherit;background:#fff;color:inherit}
textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:8px;margin-top:12px}
button{flex:1;min-width:0;height:44px;border:0;border-radius:10px;background:#111;color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
button.sub{background:#fff;color:#111;border:1px solid #ddd}
button.sm{flex:0 0 auto;height:34px;padding:0 12px;font-size:14px;font-weight:600}
button:disabled{opacity:.55}
.st{min-height:20px;margin:8px 0;font-size:13px;color:#6b7280}
.st.err{color:#dc2626}
.st.ok{color:#15803d}
.out{white-space:pre-wrap;background:#fff;border-radius:12px;padding:14px;min-height:180px;line-height:1.7;font-size:16px;border:1px solid #ddd;overflow:hidden;resize:none;word-break:break-word}
.bar2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 6px;font-size:13px;color:#6b7280}
.bar2 b{color:inherit;font-weight:600}
.sv{font-size:12px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume{display:none;margin:8px 0 0;padding:10px 12px;border-radius:12px;background:#fff7e6;border:1px solid #f5d9a6;font-size:14px;line-height:1.5;color:#7a4b00}
.resume.on{display:block}
.lib{display:none;margin:4px 0 10px;background:#fff;border:1px solid #ddd;border-radius:12px;padding:10px}
.lib.on{display:block}
.lib .lt{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lib .lt b{flex:1;font-size:15px}
.it{border-top:1px solid #eee;padding:10px 0}
.it:first-of-type{border-top:0}
.it .nm{font-size:15px;font-weight:600;word-break:break-all}
.it.cur .nm::after{content:" ●";color:#2563eb;font-size:11px;vertical-align:middle}
.it .mt{font-size:12px;color:#6b7280;margin:2px 0 8px}
.it .ac{display:flex;gap:6px;flex-wrap:wrap}
.it .ac button{flex:1 1 0;height:34px;font-size:14px;font-weight:600}
.it .ac button.del{background:#fff;color:#dc2626;border:1px solid #f1b4b4}
.it .ac button.del.sure{background:#dc2626;color:#fff;border-color:#dc2626}
.it .rn{display:flex;gap:6px;margin-bottom:8px}
.it .rn input{flex:1;height:36px;padding:6px 10px}
.it .rn button{flex:0 0 auto;height:36px;padding:0 12px;font-size:14px}
.empty{font-size:13px;color:#6b7280;padding:6px 0}
html[data-theme=dark],html[data-theme=dark] body{background:#05060a;color:#e6edf3}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea,html[data-theme=dark] .out,html[data-theme=dark] .lib{background:#161b22;color:#e6edf3;border-color:#30363d}
html[data-theme=dark] button{background:#2563eb;color:#fff}
html[data-theme=dark] button.sub{background:#161b22;color:#e6edf3;border-color:#30363d}
html[data-theme=dark] .it{border-top-color:#30363d}
html[data-theme=dark] .it .ac button.del{background:#161b22;color:#f87171;border-color:#7f1d1d}
html[data-theme=dark] .it .ac button.del.sure{background:#dc2626;color:#fff;border-color:#dc2626}
html[data-theme=dark] .resume{background:#2a2111;border-color:#5c4617;color:#f5d38a}
html[data-theme=dark] .st,html[data-theme=dark] label,html[data-theme=dark] .bar2,html[data-theme=dark] .sv,html[data-theme=dark] .it .mt,html[data-theme=dark] .empty{color:#9aa8b6}
html[data-theme=dark] .st.err{color:#f87171}
html[data-theme=dark] .st.ok{color:#4ade80}
</style>
</head>

<script>
var NV=[["都市", "雨夜来信", "雨下到第三天，信箱里多了一封没有邮票的信。林晚拆开，里面只有一行字：别在十点出门。她把信压在水杯下，十点还是出了门。楼下的路灯灭了一盏，路口站着一个穿她旧外套的人。那人转过身，是十年前的自己，手里拿着同一封信。", "https://picsum.photos/id/1031/800/600"], ["悬疑", "港口灯塔", "守塔人老周连续三晚看见对岸有人挥灯。第四晚他划船过去，灯塔门开着，屋里没有人，桌上却放着他的值班表，日期写成明天。他回到自己的灯塔，桌上的表也少了一页。", "https://picsum.photos/id/1015/800/600"], ["言情", "晚自习", "同桌把没写完的纸条夹进课本，上面只有一个明天的日期。第二天她没来。第三天课本里多了一张新纸条：我在操场最后一圈等你。她跑到操场，灯已经灭了，只有跑道上还有湿的脚印。", "https://picsum.photos/id/1060/800/600"], ["科幻", "末班地铁", "末班车多停了一站，站名是明天。车门打开，站台上没有人，广播却在报她的名字。她没有下去。车再开时，窗外的城市灯火都变成了她还没住过的楼。", "https://picsum.photos/id/133/800/600"], ["武侠", "客栈夜雨", "刀客把伞留在门槛，人已经不在。店小二说他只喝了一碗酒，付的是十年前的铜钱。雨停后，伞柄上刻着一个还没发生的地名。", "https://picsum.photos/id/1018/800/600"], ["历史", "城门未关", "守城兵把令牌交还给一个不该出现的人。那人说城门今夜不必关，因为敌军已经在城里吃过晚饭。守兵回头，城楼上的灯一盏盏灭了。", "https://picsum.photos/id/1019/800/600"], ["灵异", "旧收音机", "半夜只播出一个已经停播的频率。女声报时，报的是她母亲去世那天的钟点。她关掉开关，喇叭里仍在说话，说别关，下一首是你小时候要听的。", "https://picsum.photos/id/1016/800/600"], ["校园", "操场灯", "熄灯后还有人在跑最后一圈。看门的说操场已经锁了。她趴在铁门上看，跑道上的人穿的是她昨天丢掉的校服。", "https://picsum.photos/id/1027/800/600"], ["职场", "加班灯", "最后一盏灯关掉时，合同自己改了一行。甲方名字变成了她自己。她刷新页面，修改时间是明天凌晨。", "https://picsum.photos/id/20/800/600"], ["冒险", "地图缺口", "地图缺的那一块，正好是他们脚下。向导说这块地没有名字。夜里帐篷外有人敲杆，说名字在你们口袋里。她摸出口袋，里面是一张画着缺口的新地图。", "https://picsum.photos/id/101/800/600"], ["奇幻", "镜中集市", "镜子里的集市只在雨天营业。她买了一把钥匙，摊主说回家对着镜子用。钥匙插进镜面，集市的灯全灭了，只剩她自己的窗口还亮着。", "https://picsum.photos/id/106/800/600"], ["治愈", "清晨面包", "面包出炉时，失踪的猫坐在窗台。店主说这猫昨天就在，只是你没看见。她把第一炉面包掰开，里面是热的，猫却已经不在了，窗台上留着一圈面粉手印。", "https://picsum.photos/id/292/800/600"]];
var g=document.getElementById("ngal");
NV.forEach(function(w){var d=document.createElement("div");d.className="nc";d.innerHTML="<img alt=\"\"><div class=\"m\"><b></b><button type=\"button\">复制</button></div>";d.querySelector("img").src=w[3];d.querySelector("b").textContent=w[0]+" · "+w[1];d.querySelector("button").onclick=function(e){e.stopPropagation();navigator.clipboard.writeText(w[2]).then(function(){d.querySelector("button").textContent="已复制";});};d.onclick=function(){document.getElementById("rt").textContent=w[1];document.getElementById("rb").textContent=w[2];document.getElementById("reader").style.display="block";};g.appendChild(d);});
document.getElementById("rclose").onclick=function(){document.getElementById("reader").style.display="none";};
document.getElementById("ownN").onclick=function(){var m=document.getElementById("maker");m.style.display=m.style.display==="none"?"block":"none";};
</script>
