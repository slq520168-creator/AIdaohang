<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>面对面翻译</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;background:#f6f3ee;color:#1f1b16;font-family:-apple-system,"PingFang SC",sans-serif}
.wrap{height:100dvh;max-width:480px;margin:0 auto;display:grid;grid-template-rows:1fr auto 1fr}
.pane{display:flex;flex-direction:column;padding:8px 10px;min-height:0}
.flip{transform:rotate(180deg)}
.name{text-align:center;font-size:16px;font-weight:700;color:#6a4e2e}
.stage{position:relative;flex:1;min-height:0;margin:4px 0}
.box{height:100%;padding:8px 8px 58px;border:1px solid #e4d8c6;border-radius:10px;background:#fff;font-size:22px;font-weight:650;text-align:center;overflow:auto;-webkit-user-select:text;user-select:text}
.mic{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:56px;height:56px;border:0;border-radius:50%;background:#86efac;color:#14532d;font-size:22px;box-shadow:0 2px 8px rgba(22,163,74,.35)}
.mic.live{background:#16a34a;color:#fff}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.btn{height:34px;border:1px solid #e0d3bf;border-radius:8px;background:#fff;color:#5a442c;font-weight:700;font-size:12px}
textarea{margin-top:6px;width:100%;min-height:42px;border-radius:10px;padding:8px 10px;font-size:16px;border:1px solid #e0d3bf;-webkit-user-select:text;user-select:text}
.mid{padding:6px 12px;background:#efe8dc;border-top:1px solid #e4d8c6;border-bottom:1px solid #e4d8c6;text-align:center}
select{height:26px;border-radius:6px;font-weight:700;font-size:12px}
.tip{font-size:11px;color:#7a6448;margin-top:3px}
</style>
<script src="./noscale.js?v=268"></script>
</head>
<body>
<div class="wrap">
<section class="pane flip">
  <div class="bar">
    <button class="btn" id="speakA" type="button" data-i18n="ft_speak">Speak</button>
    <button class="btn" id="camA" type="button" data-i18n="ft_photo">Photo</button>
    <button class="btn" id="clearA" type="button" data-i18n="ft_clear">Clear</button>
    <button class="btn" id="sendA" type="button" data-i18n="ft_go">Translate</button>
  </div>
  <div class="name" id="nameA">English</div>
  <div class="stage"><div class="box" id="boxA"></div><button class="mic" id="micA" type="button">🎤</button></div>
</section>
<div class="mid">
  <select id="fromLang">
    <option value="zh-CN">中文</option>
    <option value="en">English</option>
    <option value="km-KM">ភាសាខ្មែរ</option>
    <option value="th-TH">ไทย</option>
    <option value="vi-VN">Vi</option>
    <option value="ja-JP">日</option>
    <option value="ko-KR">한</option>
  </select>
  →
  <select id="toLang">
    <option value="en" selected>English</option>
    <option value="zh-CN">中文</option>
    <option value="km-KM">ភាសាខ្មែរ</option>
    <option value="th-TH">ไทย</option>
    <option value="vi-VN">Vi</option>
    <option value="ja-JP">日</option>
    <option value="ko-KR">한</option>
  </select>
  <div class="tip" data-i18n="ft_tip">按住话筒说话，松手发出</div>
</div>
<section class="pane">
  <div class="name" id="nameB">中文</div>
  <div class="stage"><div class="box" id="boxB"></div><button class="mic" id="micB" type="button">🎤</button></div>
  <div class="bar">
    <button class="btn" id="speakB" type="button" data-i18n="ft_speak">播报</button>
    <button class="btn" id="camB" type="button" data-i18n="ft_photo">拍照</button>
    <button class="btn" id="clearB" type="button" data-i18n="ft_clear">清空</button>
    <button class="btn" id="sendB" type="button" data-i18n="ft_go">翻译</button>
  </div>
  <textarea id="inputB"></textarea>
</section>
</div>
<input id="file" type="file" accept="image/*" capture="environment" hidden>
<audio id="player" playsinline></audio>
<script src="./i18n.js?v=260"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const NAMES={"zh-CN":"中文",en:"English","km-KM":"ភាសាខ្មែរ","th-TH":"ไทย","vi-VN":"Việt","ja-JP":"日","ko-KR":"한"};
const SPEECH={"zh-CN":"zh-CN",en:"en-US","km-KM":"km-KH","th-TH":"th-TH","vi-VN":"vi-VN","ja-JP":"ja-JP","ko-KR":"ko-KR"};
const TTS={"zh-CN":"zh",en:"en","km-KM":"km","th-TH":"th","vi-VN":"vi","ja-JP":"ja","ko-KR":"ko"};
const $=id=>document.getElementById(id);
let live=null, rec=null, heard="", sending=false, ocrSide="B";
function code(l){
  l=String(l||"");
  if(l.indexOf("zh")===0)return "zh";
  if(l.indexOf("km")===0)return "km";
  if(l.indexOf("th")===0)return "th";
  if(l.indexOf("vi")===0)return "vi";
  if(l.indexOf("ja")===0)return "ja";
  if(l.indexOf("ko")===0)return "ko";
  return "en";
}
function paint(){
  $("nameA").textContent=NAMES[$("toLang").value]||"A";
  $("nameB").textContent=NAMES[$("fromLang").value]||"B";
  $("micA").classList.toggle("live",live==="A");
  $("micB").classList.toggle("live",live==="B");
}
function hush(){
  try{speechSynthesis.cancel();}catch(e){}
  try{$("player").pause();$("player").removeAttribute("src");}catch(e){}
}
function stopRec(){
  if(!rec)return;
  rec.onresult=rec.onerror=rec.onend=null;
  try{rec.stop();}catch(e){}
  rec=null;window.__navRec=null;
}
function speakNow(text,lang){
  text=String(text||"").trim();if(!text)return;
  hush();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=SPEECH[lang]||"en-US";u.volume=1;u.rate=1;
  speechSynthesis.speak(u);
  setTimeout(function(){
    if(speechSynthesis.speaking)return;
    const a=$("player");
    a.src="https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl="+(TTS[lang]||"en")+"&q="+encodeURIComponent(text);
    a.play().catch(function(){});
  },500);
}
async function translate(text,from,to){
  if(from===to)return text;
  const res=await fetch("./api/translate?q="+encodeURIComponent(text)+"&sl="+code(from)+"&tl="+code(to));
  const data=await res.json();
  const out=(data&&data.text)?String(data.text).trim():"";
  if(!out)throw new Error("fail");
  return out;
}
async function send(side,text){
  text=String(text||"").trim();
  if(!text||sending)return;
  sending=true;
  if(side==="A")$("boxA").textContent=text;
  else{$("boxB").textContent=text;$("inputB").value=text;}
  const from=side==="B"?$("fromLang").value:$("toLang").value;
  const to=side==="B"?$("toLang").value:$("fromLang").value;
  const other=side==="A"?"B":"A";
  $("box"+other).textContent="...";
  try{
    const dst=await translate(text,from,to);
    $("box"+other).textContent=dst;
    if(other==="B")$("inputB").value=dst;
    speakNow(dst,to);
  }catch(e){$("box"+other).textContent="fail";}
  sending=false;
}
function startHold(side){
  if(live)return;
  hush();stopRec();
  heard="";live=side;paint();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$("box"+side).textContent="请用Safari";live=null;paint();return;}
  rec=new SR();window.__navRec=rec;
  rec.lang=SPEECH[side==="B"?$("fromLang").value:$("toLang").value]||"zh-CN";
  rec.continuous=true;rec.interimResults=true;
  rec.onresult=function(ev){
    let t="";for(let i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;
    t=t.trim();if(!t)return;heard=t;$("box"+side).textContent=t;
  };
  rec.onerror=function(){};
  rec.onend=function(){};
  try{rec.start();}catch(e){}
}
function endHold(side){
  if(live!==side)return;
  const text=heard||$("box"+side).textContent;
  live=null;stopRec();paint();
  send(side,text);
}
function bindHold(side){
  const el=$("mic"+side);
  el.addEventListener("pointerdown",function(e){e.preventDefault();el.setPointerCapture(e.pointerId);startHold(side);},{passive:false});
  el.addEventListener("pointerup",function(e){e.preventDefault();endHold(side);},{passive:false});
  el.addEventListener("pointercancel",function(){endHold(side);});
  el.addEventListener("contextmenu",function(e){e.preventDefault();});
}
bindHold("A");bindHold("B");
$("sendA").onclick=function(){send("A",$("boxA").textContent);};
$("sendB").onclick=function(){send("B",$("inputB").value||$("boxB").textContent);};
$("speakA").onclick=function(){speakNow($("boxA").textContent,$("toLang").value);};
$("speakB").onclick=function(){speakNow($("boxB").textContent||$("inputB").value,$("fromLang").value);};
$("clearA").onclick=function(){$("boxA").textContent="";hush();};
$("clearB").onclick=function(){$("boxB").textContent="";$("inputB").value="";hush();};
$("fromLang").onchange=$("toLang").onchange=paint;
$("inputB").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send("B",$("inputB").value);}});
$("camA").onclick=function(){ocrSide="A";$("file").click();};
$("camB").onclick=function(){ocrSide="B";$("file").click();};
$("file").onchange=async function(e){
  const file=e.target.files&&e.target.files[0];const side=ocrSide;e.target.value="";
  if(!file)return;$("box"+side).textContent="...";
  try{
    const worker=await Tesseract.createWorker("eng+chi_sim");
    const result=await worker.recognize(file);await worker.terminate();
    const t=(result.data.text||"").replace(/\s+/g," ").trim();
    if(t)send(side,t);else $("box"+side).textContent="";
  }catch(err){$("box"+side).textContent="";}
};
window.addEventListener("pagehide",function(){stopRec();hush();});
paint();
</script>
</body>
</html>
