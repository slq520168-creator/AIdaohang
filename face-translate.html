<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>面对面翻译</title>
<style>
  :root { --gold:#d4b07a; --gold2:#f0d7a8; --ink:#f6f1e8; --mute:#b7a894; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#0b0c10; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans Khmer",serif; }
  .wrap { height:100dvh; max-width:480px; margin:0 auto; display:grid; grid-template-rows:1fr auto 1fr; background:radial-gradient(1200px 400px at 50% -10%,rgba(212,176,122,.16),transparent 55%),radial-gradient(800px 320px at 50% 110%,rgba(212,176,122,.10),transparent 50%),linear-gradient(180deg,#14161c 0%,#0c0d12 50%,#14161c 100%); }
  .pane { display:flex; flex-direction:column; padding:14px 16px 10px; min-height:0; }
  .a { transform:rotate(180deg); }
  .name { text-align:center; font-size:22px; font-weight:700; letter-spacing:.28em; color:var(--gold2); padding:4px 0 8px; }
  .big { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; font-size:clamp(22px,6vw,34px); font-weight:650; line-height:1.4; word-break:break-word; padding:6px; }
  .bar { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .btn { height:42px; border:1px solid rgba(212,176,122,.35); border-radius:12px; background:rgba(255,255,255,.04); color:var(--gold2); font-weight:700; font-size:14px; }
  .btn.live { background:#8a2a2a; color:#fff; border-color:#c45; }
  textarea { margin-top:8px; width:100%; min-height:42px; max-height:78px; resize:none; border-radius:12px; padding:10px 12px; font-size:16px; background:rgba(255,255,255,.04); color:var(--ink); border:1px solid rgba(212,176,122,.22); }
  .mid { padding:8px 12px 10px; border-top:1px solid rgba(212,176,122,.28); border-bottom:1px solid rgba(212,176,122,.28); background:rgba(8,8,12,.55); }
  .mid .lab { text-align:center; font-size:11px; color:var(--mute); letter-spacing:.2em; margin-bottom:6px; }
  .pick { display:flex; align-items:center; gap:8px; }
  select { flex:1; height:40px; border-radius:10px; padding:0 10px; background:#17181e; color:var(--gold2); border:1px solid rgba(212,176,122,.4); font-size:15px; font-weight:700; text-align:center; }
  .arrow { color:var(--gold); font-size:18px; width:22px; text-align:center; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <section class="pane a">
    <div class="name" id="nameA">英语</div>
    <div class="big" id="textA"></div>
    <div class="bar">
      <button class="btn" id="micA" type="button">语音</button>
      <button class="btn" id="camA" type="button">拍照</button>
      <button class="btn" id="sendA" type="button">翻译</button>
    </div>
    <textarea id="inputA"></textarea>
  </section>
  <div class="mid">
    <div class="lab">主控选语言</div>
    <div class="pick">
      <select id="fromLang">
        <option value="zh-CN">中文</option>
        <option value="en">英语</option>
        <option value="km-KM">高棉语</option>
      </select>
      <div class="arrow">→</div>
      <select id="toLang">
        <option value="en" selected>英语</option>
        <option value="zh-CN">中文</option>
        <option value="km-KM">高棉语</option>
      </select>
    </div>
  </div>
  <section class="pane b">
    <div class="name" id="nameB">中文</div>
    <div class="big" id="textB"></div>
    <div class="bar">
      <button class="btn" id="micB" type="button">语音</button>
      <button class="btn" id="camB" type="button">拍照</button>
      <button class="btn" id="sendB" type="button">翻译</button>
    </div>
    <textarea id="inputB"></textarea>
  </section>
</div>
<input id="file" type="file" accept="image/*" capture="environment">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const NAME = { "zh-CN": "中文", "en": "英语", "km-KM": "高棉语" };
const OCR = { "zh-CN": "chi_sim", "en": "eng", "km-KM": "khm" };
const SPEECH = { "zh-CN": "zh-CN", "en": "en-US", "km-KM": "km-KH" };
const $ = id => document.getElementById(id);
let ocrSide = "B";
function applyLang() {
  $("nameB").textContent = NAME[$("fromLang").value];
  $("nameA").textContent = NAME[$("toLang").value];
  $("textA").textContent = "";
  $("textB").textContent = "";
}
$("fromLang").onchange = $("toLang").onchange = applyLang;
applyLang();
async function translate(text, from, to) {
  if (from === to) return text;
  const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=" + encodeURIComponent(from + "|" + to);
  const res = await fetch(url);
  const data = await res.json();
  const out = data && data.responseData && data.responseData.translatedText || "";
  if (!out || /INVALID|QUERY LENGTH|MYMEMORY WARNING/i.test(out)) throw new Error("fail");
  return out;
}
function speak(text, lang) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = SPEECH[lang] || "en-US";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
async function go(side, text) {
  text = (text || "").trim();
  if (!text) return;
  const fromMain = $("fromLang").value;
  const toMain = $("toLang").value;
  const from = side === "B" ? fromMain : toMain;
  const to = side === "B" ? toMain : fromMain;
  const other = side === "A" ? "B" : "A";
  $("text" + side).textContent = text;
  $("text" + other).textContent = "…";
  try {
    const dst = await translate(text, from, to);
    $("text" + other).textContent = dst;
    speak(dst, to);
    $("input" + side).value = "";
  } catch (e) {
    $("text" + other).textContent = "翻译失败";
  }
}
$("sendA").onclick = () => go("A", $("inputA").value);
$("sendB").onclick = () => go("B", $("inputB").value);
["A","B"].forEach(s => {
  $("input"+s).addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); go(s, $("input"+s).value); }
  });
});
const recs = { A:null, B:null };
function bindMic(side) {
  $("mic"+side).onclick = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    if (recs[side]) { recs[side].stop(); recs[side]=null; $("mic"+side).textContent="语音"; $("mic"+side).classList.remove("live"); return; }
    const rec = new SR();
    rec.lang = SPEECH[side==="B" ? $("fromLang").value : $("toLang").value];
    rec.interimResults = false;
    rec.onresult = ev => go(side, ev.results[0][0].transcript);
    rec.onend = () => { recs[side]=null; $("mic"+side).textContent="语音"; $("mic"+side).classList.remove("live"); };
    rec.start();
    recs[side]=rec;
    $("mic"+side).textContent="停";
    $("mic"+side).classList.add("live");
  };
}
bindMic("A"); bindMic("B");
$("camA").onclick = () => { ocrSide="A"; $("file").click(); };
$("camB").onclick = () => { ocrSide="B"; $("file").click(); };
$("file").onchange = async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const from = ocrSide==="B" ? $("fromLang").value : $("toLang").value;
  try {
    const worker = await Tesseract.createWorker(OCR[from] || "eng");
    const result = await worker.recognize(file);
    await worker.terminate();
    const cleaned = (result.data.text || "").replace(/\s+/g, " ").trim();
    if (!cleaned) return;
    await go(ocrSide, cleaned);
  } catch (err) {}
  e.target.value = "";
};
</script>
</body>
</html>
