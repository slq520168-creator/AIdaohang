<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>面对面翻译</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;background:#f6f3ee;color:#1f1b16;font-family:-apple-system,"PingFang SC",sans-serif;touch-action:manipulation}
.wrap{height:100dvh;max-width:480px;margin:0 auto;display:grid;grid-template-rows:1fr auto 1fr;background:#f6f3ee}
.pane{display:flex;flex-direction:column;padding:8px 10px;min-height:0}
.flip{transform:rotate(180deg)}
.name{text-align:center;font-size:16px;font-weight:700;letter-spacing:.14em;color:#6a4e2e}
.stage{position:relative;flex:1;min-height:72px;margin:4px 0}
.box{height:100%;padding:8px 8px 58px;border:1px solid #e4d8c6;border-radius:10px;background:#fff;font-size:clamp(16px,4.6vw,24px);font-weight:650;text-align:center;overflow:auto;-webkit-user-select:text;user-select:text}
.wave{position:absolute;left:8%;right:8%;bottom:10px;height:36px;width:84%;pointer-events:none}
.mic{position:absolute;left:50%;top:calc(50% + 5mm);transform:translate(-50%,-50%);width:56px;height:56px;border:0;border-radius:50%;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(22,163,74,.4)}
.mic svg{width:26px;height:26px;pointer-events:none}
.mic.live{background:#15803d}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.btn{height:34px;border:1px solid #e0d3bf;border-radius:8px;background:#fff;color:#5a442c;font-weight:700;font-size:11px}
textarea{margin-top:6px;width:100%;min-height:42px;resize:none;border-radius:10px;padding:8px 10px;font-size:16px;background:#fff;border:1px solid #e0d3bf;-webkit-user-select:text;user-select:text}
.mid{padding:2px 16px;border-top:1px solid #e4d8c6;border-bottom:1px solid #e4d8c6;background:#efe8dc}
.pick{display:flex;align-items:center;justify-content:center;gap:4px}
select{width:34%;height:22px;border-radius:5px;background:#fff;color:#3d2e1c;border:1px solid #e0d3bf;font-size:11px;font-weight:700;text-align:center}
.kb{display:grid;gap:3px}.kr{display:flex;gap:3px}
.k{flex:1;height:28px;border:0;border-radius:6px;background:#fff;font-size:13px;font-weight:700;box-shadow:0 0 0 1px #e4d8c6}
.k.act{background:#efe8dc}.k.wide{flex:2}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
<section class="pane flip">
  <div class="name" id="nameA">English</div>
  <div class="stage"><div class="box" id="boxA"></div><canvas class="wave" id="waveA"></canvas><button class="mic" id="micA" type="button" aria-label="mic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/><path d="M8 22h8"/></svg></button></div>
  <div class="kb" id="kbA"></div>
  <div class="bar">
    <button class="btn" id="speakA" type="button">Speak</button>
    <button class="btn" id="camA" type="button">Photo</button>
    <button class="btn" id="clearA" type="button">Clear</button>
    <button class="btn" id="sendA" type="button">Translate</button>
  </div>
</section>
<div class="mid"><div class="pick">
  <select id="fromLang"><option value="zh-CN">中文</option><option value="en">English</option><option value="km-KM">ភាសាខ្មែរ</option></select>
  <div>→</div>
  <select id="toLang"><option value="en" selected>English</option><option value="zh-CN">中文</option><option value="km-KM">ភាសាខ្មែរ</option></select>
</div></div>
<section class="pane">
  <div class="name" id="nameB">中文</div>
  <div class="stage"><div class="box" id="boxB"></div><canvas class="wave" id="waveB"></canvas><button class="mic" id="micB" type="button" aria-label="mic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/><path d="M8 22h8"/></svg></button></div>
  <div class="bar">
    <button class="btn" id="speakB" type="button">播报</button>
    <button class="btn" id="camB" type="button">拍照</button>
    <button class="btn" id="clearB" type="button">清空</button>
    <button class="btn" id="sendB" type="button">翻译</button>
  </div>
  <textarea id="inputB" lang="zh-CN"></textarea>
</section>
</div>
<input id="file" type="file" accept="image/*" capture="environment">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const UI={"zh-CN":{name:"中文",speak:"播报",cam:"拍照",clear:"清空",send:"翻译",space:"空格"},en:{name:"English",speak:"Speak",cam:"Photo",clear:"Clear",send:"Translate",space:"space"},"km-KM":{name:"ភាសាខ្មែរ",speak:"អាន",cam:"ថត",clear:"លុប",send:"បកប្រែ",space:"ដកំ"}};
const OCR={"zh-CN":"chi_sim",en:"eng","km-KM":"khm"};
const SPEECH={"zh-CN":"zh-CN",en:"en-US","km-KM":"km-KH"};
const EN=["qwertyuiop","asdfghjkl","zxcvbnm"], KM=["កខគងចឆជញ","តថទនបផពម","យរលវសហអ","ាិីុូេោំ់"];
const $=id=>document.getElementById(id);
let draftA="", ocrSide="B", live=null, heard="", rec=null, raf=0, actx=null, an=null, stream=null, done=false, lock=0, hideT=0;
function code(l){return String(l).indexOf("zh")===0?"zh-CN":String(l).indexOf("km")===0?"km":"en";}
function otherLang(v){return v==="zh-CN"?"en":"zh-CN";}
function preventSame(w){if($("fromLang").value===$("toLang").value){if(w==="from")$("toLang").value=otherLang($("fromLang").value);else $("fromLang").value=otherLang($("toLang").value);}}
function pickVoice(lang){const list=speechSynthesis.getVoices()||[],p=(SPEECH[lang]||"en-US").slice(0,2).toLowerCase();return list.find(v=>/en-US/i.test(v.lang)&&/Samantha|Siri|Google US English/i.test(v.name))||list.find(v=>(v.lang||"").toLowerCase().startsWith(p))||null;}
function speakNow(text,lang){text=String(text||"").trim();if(!text||lang==="km-KM")return;try{speechSynthesis.cancel();}catch(e){}const u=new SpeechSynthesisUtterance(text);u.lang=SPEECH[lang]||"en-US";u.volume=1;const v=pickVoice(lang);if(v)u.voice=v;speechSynthesis.speak(u);}
function addA(ch){draftA+=ch;$("boxA").textContent=draftA;}function delA(){draftA=draftA.slice(0,-1);$("boxA").textContent=draftA;}
function makeKb(){const root=$("kbA");root.innerHTML="";const lang=$("toLang").value;(lang==="km-KM"?KM:EN).forEach(row=>{const r=document.createElement("div");r.className="kr";[...row].forEach(ch=>{const b=document.createElement("button");b.className="k";b.type="button";b.textContent=ch;b.onclick=()=>addA(ch);r.appendChild(b);});root.appendChild(r);});const last=document.createElement("div");last.className="kr";const d=document.createElement("button");d.className="k act";d.type="button";d.textContent="⌫";d.onclick=delA;const s=document.createElement("button");s.className="k wide act";s.type="button";s.textContent=UI[lang].space;s.onclick=()=>addA(" ");last.appendChild(d);last.appendChild(s);root.appendChild(last);}
function paint(){const a=UI[$("toLang").value],b=UI[$("fromLang").value];$("nameA").textContent=a.name;$("speakA").textContent=a.speak;$("camA").textContent=a.cam;$("clearA").textContent=a.clear;$("sendA").textContent=a.send;$("nameB").textContent=b.name;$("speakB").textContent=b.speak;$("camB").textContent=b.cam;$("clearB").textContent=b.clear;$("sendB").textContent=b.send;$("micA").classList.toggle("live",live==="A");$("micB").classList.toggle("live",live==="B");}
function applyLang(){preventSame("to");paint();makeKb();$("inputB").lang=$("fromLang").value;}
$("fromLang").onchange=function(){preventSame("from");applyLang();};
$("toLang").onchange=function(){preventSame("to");applyLang();};
$("speakA").onclick=()=>speakNow($("boxA").textContent,$("toLang").value);
$("speakB").onclick=()=>speakNow($("boxB").textContent||$("inputB").value,$("fromLang").value);
$("clearA").onclick=function(){draftA="";$("boxA").textContent="";try{speechSynthesis.cancel();}catch(e){}};
$("clearB").onclick=function(){$("boxB").textContent="";$("inputB").value="";try{speechSynthesis.cancel();}catch(e){}};
function readGoogle(data){if(!data||data.error)return"";if(typeof data==="string")return data;if(Array.isArray(data)){if(typeof data[0]==="string")return data[0];return data.map(row=>Array.isArray(row)?(row[0]||""):String(row||"")).join("");}return"";}
async function translate(text,from,to){if(from===to)return text;const sl=code(from),tl=code(to);const urls=["./api/translate?q="+encodeURIComponent(text)+"&sl="+sl+"&tl="+tl,"https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl="+sl+"&tl="+tl+"&q="+encodeURIComponent(text)];for(const url of urls){try{const res=await fetch(url);const data=await res.json();const out=readGoogle(data).trim();if(out)return out;}catch(e){}}throw new Error("fail");}
function putText(side,text){if(side==="A"){draftA=text;$("boxA").textContent=text;}else{$("inputB").value=text;$("boxB").textContent=text;}}
async function send(side,text){text=(text||(side==="A"?draftA:$("inputB").value)||"").trim();if(!text)return;putText(side,text);const from=side==="B"?$("fromLang").value:$("toLang").value,to=side==="B"?$("toLang").value:$("fromLang").value,other=side==="A"?"B":"A";$("box"+other).textContent="...";try{const dst=await translate(text,from,to);$("box"+other).textContent=dst;speakNow(dst,to);}catch(e){$("box"+other).textContent="fail";}}
$("sendA").onclick=()=>send("A");$("sendB").onclick=()=>send("B");
$("inputB").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send("B");}});
function hardStop(){
  if(raf){cancelAnimationFrame(raf);raf=0;}
  ["A","B"].forEach(s=>{const c=$("wave"+s);if(c)c.getContext("2d").clearRect(0,0,c.width,c.height);});
  if(rec){rec.onresult=rec.onerror=rec.onend=null;try{rec.abort?rec.abort():rec.stop();}catch(e){}rec=null;}
  if(stream){stream.getTracks().forEach(t=>{try{t.stop();}catch(e){}});stream=null;}
  try{if(actx)actx.close();}catch(e){}
  actx=null;an=null;
}
function dropMic(){done=true;live=null;hardStop();paint();}
function draw(side){
  const c=$("wave"+side);if(!c||!an)return;
  const g=c.getContext("2d");
  (function tick(){
    if(live!==side||!an)return;
    const w=c.width=Math.max(140,c.clientWidth*2),h=c.height=Math.max(48,c.clientHeight*2);
    const data=new Uint8Array(an.fftSize);an.getByteTimeDomainData(data);
    g.clearRect(0,0,w,h);g.beginPath();g.lineWidth=3;g.strokeStyle="#16a34a";
    const step=w/data.length;
    for(let i=0;i<data.length;i++){const x=i*step,y=(data[i]/255)*h;i?g.lineTo(x,y):g.moveTo(x,y);}
    g.stroke();raf=requestAnimationFrame(tick);
  })();
}
function startRec(side){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  rec=new SR();
  rec.lang=SPEECH[side==="B"?$("fromLang").value:$("toLang").value]||"zh-CN";
  rec.continuous=false;rec.interimResults=true;
  rec.onresult=function(ev){let t="";for(let i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;t=t.trim();if(!t)return;heard=t;putText(side,t);if(ev.results[ev.results.length-1].isFinal)finish(side);};
  rec.onerror=function(){if(heard)finish(side);};
  rec.onend=function(){if(!done&&heard)finish(side);};
  try{rec.start();}catch(e){}
}
function finish(side){
  if(done)return;done=true;
  const text=heard;live=null;hardStop();paint();
  if(side&&text)send(side,text);
}
function begin(side){
  done=false;heard="";live=side;paint();
  startRec(side);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return;
  navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(async function(s){
    if(live!==side){s.getTracks().forEach(t=>t.stop());return;}
    stream=s;
    const AC=window.AudioContext||window.webkitAudioContext;
    actx=new AC();if(actx.state==="suspended")await actx.resume();
    an=actx.createAnalyser();an.fftSize=256;
    actx.createMediaStreamSource(stream).connect(an);
    draw(side);
  }).catch(function(){});
}
function tap(side){
  const now=Date.now();
  if(now-lock<500)return;
  lock=now;
  if(live===side)finish(side);else begin(side);
}
function bindMic(side){
  const el=$("mic"+side);
  el.addEventListener("contextmenu",e=>e.preventDefault());
  el.addEventListener("click",function(e){e.preventDefault();tap(side);});
}
bindMic("A");bindMic("B");
window.addEventListener("pagehide",dropMic);
window.addEventListener("freeze",dropMic);
document.addEventListener("visibilitychange",function(){
  if(document.hidden){hideT=setTimeout(dropMic,800);}
  else if(hideT){clearTimeout(hideT);hideT=0;}
});
$("camA").onclick=function(){ocrSide="A";$("file").click();};
$("camB").onclick=function(){ocrSide="B";$("file").click();};
$("file").onchange=async function(e){const file=e.target.files&&e.target.files[0];if(!file)return;const from=ocrSide==="B"?$("fromLang").value:$("toLang").value;try{const worker=await Tesseract.createWorker(OCR[from]||"eng");const result=await worker.recognize(file);await worker.terminate();const cleaned=(result.data.text||"").replace(/\s+/g," ").trim();if(cleaned)await send(ocrSide,cleaned);}catch(err){}e.target.value="";};
applyLang();
</script>
</body>
</html>
