<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>面对面翻译</title>
<style>
  :root { --gold:#d4b07a; --gold2:#f0d7a8; --ink:#f6f1e8; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#0b0c10; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans Khmer",sans-serif; }
  .wrap { height:100dvh; max-width:480px; margin:0 auto; display:grid; grid-template-rows:1fr auto 1fr; background:radial-gradient(900px 360px at 50% 0,rgba(212,176,122,.14),transparent 55%),linear-gradient(180deg,#14161c,#0c0d12 50%,#14161c); }
  .pane { display:flex; flex-direction:column; padding:8px 10px; min-height:0; }
  .flip { transform:rotate(180deg); }
  .name { text-align:center; font-size:18px; font-weight:700; letter-spacing:.28em; color:var(--gold2); padding:2px 0 6px; }
  .box { flex:1; min-height:48px; margin-bottom:6px; padding:8px 10px; border:1px solid rgba(212,176,122,.28); border-radius:12px; background:rgba(255,255,255,.04); font-size:clamp(18px,5vw,28px); font-weight:650; line-height:1.35; text-align:center; overflow:auto; }
  .bar { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:6px; }
  .btn { height:36px; border:1px solid rgba(212,176,122,.35); border-radius:10px; background:rgba(255,255,255,.04); color:var(--gold2); font-weight:700; font-size:13px; }
  .btn.live { background:#8a2a2a; color:#fff; }
  .kb { display:grid; gap:4px; }
  .kr { display:flex; gap:4px; justify-content:center; }
  .k { flex:1; height:32px; border:0; border-radius:7px; background:#1c1e26; color:#f3ead8; font-size:13px; font-weight:700; }
  .k.wide { flex:2.2; }
  .k.act { background:#2a2418; color:var(--gold2); }
  .mid { padding:7px 10px; border-top:1px solid rgba(212,176,122,.28); border-bottom:1px solid rgba(212,176,122,.28); background:rgba(8,8,12,.55); }
  .pick { display:flex; align-items:center; gap:8px; }
  select { flex:1; height:36px; border-radius:10px; padding:0 8px; background:#17181e; color:var(--gold2); border:1px solid rgba(212,176,122,.4); font-size:14px; font-weight:700; text-align:center; }
  .arrow { color:var(--gold); width:18px; text-align:center; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <section class="pane flip">
    <div class="name" id="nameA">英语</div>
    <div class="box" id="boxA"></div>
    <div class="bar">
      <button class="btn" id="micA" type="button">语音</button>
      <button class="btn" id="camA" type="button">拍照</button>
      <button class="btn" id="sendA" type="button">翻译</button>
    </div>
    <div class="kb" id="kbA"></div>
  </section>
  <div class="mid">
    <div class="pick">
      <select id="fromLang">
        <option value="zh-CN">中文</option>
        <option value="en">英语</option>
        <option value="km-KM">高棉语</option>
      </select>
      <div class="arrow">→</div>
      <select id="toLang">
        <option value="en" selected>英语</option>
        <option value="zh-CN">中文</option>
        <option value="km-KM">高棉语</option>
      </select>
    </div>
  </div>
  <section class="pane">
    <div class="name" id="nameB">中文</div>
    <div class="box" id="boxB"></div>
    <div class="bar">
      <button class="btn" id="micB" type="button">语音</button>
      <button class="btn" id="camB" type="button">拍照</button>
      <button class="btn" id="sendB" type="button">翻译</button>
    </div>
    <div class="kb" id="kbB"></div>
  </section>
</div>
<input id="file" type="file" accept="image/*" capture="environment">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const NAME = { "zh-CN":"中文", "en":"英语", "km-KM":"高棉语" };
const OCR = { "zh-CN":"chi_sim", "en":"eng", "km-KM":"khm" };
const SPEECH = { "zh-CN":"zh-CN", "en":"en-US", "km-KM":"km-KH" };
const ROWS = ["qwertyuiop","asdfghjkl","zxcvbnm"];
const $ = id => document.getElementById(id);
let ocrSide = "B";
const draft = { A:"", B:"" };

function applyLang(){
  $("nameB").textContent = NAME[$("fromLang").value];
  $("nameA").textContent = NAME[$("toLang").value];
}
$("fromLang").onchange = $("toLang").onchange = applyLang;
applyLang();

function paint(side){ $("box"+side).textContent = draft[side]; }
function add(side, ch){ draft[side] += ch; paint(side); }
function del(side){ draft[side] = draft[side].slice(0,-1); paint(side); }

function makeKb(side){
  const root = $("kb"+side);
  root.innerHTML = "";
  ROWS.forEach((row,i)=>{
    const r = document.createElement("div");
    r.className = "kr";
    if(i===2){
      const s = document.createElement("button");
      s.className="k act"; s.type="button"; s.textContent="⌫";
      s.onclick=()=>del(side); r.appendChild(s);
    }
    [...row].forEach(ch=>{
      const b=document.createElement("button");
      b.className="k"; b.type="button"; b.textContent=ch;
      b.onclick=()=>add(side, ch);
      r.appendChild(b);
    });
    root.appendChild(r);
  });
  const last=document.createElement("div"); last.className="kr";
  const sp=document.createElement("button"); sp.className="k wide"; sp.type="button"; sp.textContent="空格";
  sp.onclick=()=>add(side," ");
  const go=document.createElement("button"); go.className="k wide act"; go.type="button"; go.textContent="发送";
  go.onclick=()=>send(side);
  last.appendChild(sp); last.appendChild(go); root.appendChild(last);
}
makeKb("A"); makeKb("B");

async function translate(text, from, to){
  if(from===to) return text;
  const url = "https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+encodeURIComponent(from+"|"+to);
  const res = await fetch(url);
  const data = await res.json();
  const out = data && data.responseData && data.responseData.translatedText || "";
  if(!out || /INVALID|QUERY LENGTH|MYMEMORY WARNING/i.test(out)) throw new Error("fail");
  return out;
}
function speak(text, lang){
  if(!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = SPEECH[lang] || "en-US";
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
async function send(side, text){
  text = (text || draft[side] || "").trim();
  if(!text) return;
  const fromMain=$("fromLang").value, toMain=$("toLang").value;
  const from = side==="B" ? fromMain : toMain;
  const to = side==="B" ? toMain : fromMain;
  const other = side==="A" ? "B" : "A";
  draft[side]=text; paint(side);
  draft[other]="…"; paint(other);
  try{
    const dst = await translate(text, from, to);
    draft[other]=dst; paint(other); speak(dst, to);
  }catch(e){ draft[other]="翻译失败"; paint(other); }
}
$("sendA").onclick=()=>send("A");
$("sendB").onclick=()=>send("B");
const recs={A:null,B:null};
function bindMic(side){
  $("mic"+side).onclick=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR) return;
    if(recs[side]){ recs[side].stop(); recs[side]=null; $("mic"+side).textContent="语音"; $("mic"+side).classList.remove("live"); return; }
    const rec=new SR();
    rec.lang=SPEECH[side==="B"?$("fromLang").value:$("toLang").value];
    rec.onresult=ev=>send(side, ev.results[0][0].transcript);
    rec.onend=()=>{ recs[side]=null; $("mic"+side).textContent="语音"; $("mic"+side).classList.remove("live"); };
    rec.start(); recs[side]=rec; $("mic"+side).textContent="停"; $("mic"+side).classList.add("live");
  };
}
bindMic("A"); bindMic("B");
$("camA").onclick=()=>{ ocrSide="A"; $("file").click(); };
$("camB").onclick=()=>{ ocrSide="B"; $("file").click(); };
$("file").onchange=async e=>{
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  const from=ocrSide==="B"?$("fromLang").value:$("toLang").value;
  try{
    const worker=await Tesseract.createWorker(OCR[from]||"eng");
    const result=await worker.recognize(file); await worker.terminate();
    const cleaned=(result.data.text||"").replace(/\s+/g," ").trim();
    if(cleaned) await send(ocrSide, cleaned);
  }catch(err){}
  e.target.value="";
};
</script>
</body>
</html>
