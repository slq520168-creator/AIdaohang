<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>面对面翻译</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#f6f3ee;font-family:-apple-system,"PingFang SC",sans-serif;color:#1f1b16}
.wrap{height:100dvh;max-width:480px;margin:0 auto;display:grid;grid-template-rows:1fr auto 1fr}
.pane{display:flex;flex-direction:column;padding:10px;min-height:0}
.flip{transform:rotate(180deg)}
.name{text-align:center;font-weight:700;color:#6a4e2e}
.box{flex:1;margin:6px 0;padding:10px 10px 56px;border:1px solid #e4d8c6;border-radius:10px;background:#fff;font-size:20px;font-weight:650;text-align:center;overflow:auto}
.stage{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.mic{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:56px;height:56px;border:0;border-radius:50%;background:#16a34a;color:#fff;font-size:22px}
.mic.live{background:#15803d}
.bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.btn{height:34px;border:1px solid #e0d3bf;border-radius:8px;background:#fff;font-weight:700;font-size:12px}
.mid{padding:6px 12px;background:#efe8dc;border-top:1px solid #e4d8c6;border-bottom:1px solid #e4d8c6;text-align:center}
select{height:28px;border-radius:6px;font-weight:700}
textarea{margin-top:6px;width:100%;min-height:40px;border-radius:10px;padding:8px;border:1px solid #e0d3bf;font-size:16px}
.tip{font-size:11px;color:#7a6448;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
<section class="pane flip">
  <div class="name" id="nameA">高棉</div>
  <div class="stage"><div class="box" id="boxA"></div><button class="mic" id="micA" type="button">🎤</button></div>
  <div class="bar">
    <button class="btn" id="speakA" type="button">播报</button>
    <button class="btn" id="clearA" type="button">清</button>
    <button class="btn" id="sendA" type="button">翻</button>
  </div>
</section>
<div class="mid">
  <select id="fromLang">
    <option value="zh-CN">中文</option>
    <option value="en">EN</option>
    <option value="km-KM">ភាសាខ្មែរ</option>
    <option value="th-TH">ไทย</option>
    <option value="vi-VN">Vi</option>
    <option value="ja-JP">日</option>
    <option value="ko-KR">한</option>
  </select>
  ↔
  <select id="toLang">
    <option value="km-KM" selected>ភាសាខ្មែរ</option>
    <option value="zh-CN">中文</option>
    <option value="en">EN</option>
    <option value="th-TH">ไทย</option>
    <option value="vi-VN">Vi</option>
    <option value="ja-JP">日</option>
    <option value="ko-KR">한</option>
  </select>
  <div class="tip">两人轮流：点绿色麦 → 说 → 再点一下结束</div>
</div>
<section class="pane">
  <div class="name" id="nameB">中文</div>
  <div class="stage"><div class="box" id="boxB"></div><button class="mic" id="micB" type="button">🎤</button></div>
  <div class="bar">
    <button class="btn" id="speakB" type="button">播报</button>
    <button class="btn" id="clearB" type="button">清</button>
    <button class="btn" id="sendB" type="button">翻</button>
  </div>
  <textarea id="inputB" placeholder="也可打字回车"></textarea>
</section>
</div>
<audio id="player" playsinline></audio>
<script>
const NAMES={"zh-CN":"中文",en:"English","km-KM":"ភាសាខ្មែរ","th-TH":"ไทย","vi-VN":"Việt","ja-JP":"日","ko-KR":"한"};
const SPEECH={"zh-CN":"zh-CN",en:"en-US","km-KM":"km-KH","th-TH":"th-TH","vi-VN":"vi-VN","ja-JP":"ja-JP","ko-KR":"ko-KR"};
const TTS={"zh-CN":"zh",en:"en","km-KM":"km","th-TH":"th","vi-VN":"vi","ja-JP":"ja","ko-KR":"ko"};
const $=id=>document.getElementById(id);
let live=null, rec=null, heard="", done=false, lock=0;
function code(l){
  l=String(l||"");
  if(l.indexOf("zh")===0)return "zh";
  if(l.indexOf("km")===0)return "km";
  if(l.indexOf("th")===0)return "th";
  if(l.indexOf("vi")===0)return "vi";
  if(l.indexOf("ja")===0)return "ja";
  if(l.indexOf("ko")===0)return "ko";
  return "en";
}
function paint(){
  $("nameA").textContent=NAMES[$("toLang").value]||"A";
  $("nameB").textContent=NAMES[$("fromLang").value]||"B";
  $("micA").classList.toggle("live",live==="A");
  $("micB").classList.toggle("live",live==="B");
}
function hush(){
  try{speechSynthesis.cancel();}catch(e){}
  try{$("player").pause();}catch(e){}
}
function stopRec(){
  if(!rec)return;
  rec.onresult=rec.onerror=rec.onend=null;
  try{rec.abort?rec.abort():rec.stop();}catch(e){}
  rec=null;window.__navRec=null;
}
function speakNow(text,lang){
  text=String(text||"").trim();if(!text)return;
  hush();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=SPEECH[lang]||"en-US";u.volume=1;
  speechSynthesis.speak(u);
  setTimeout(function(){
    if(speechSynthesis.speaking)return;
    $("player").src="https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl="+(TTS[lang]||"en")+"&q="+encodeURIComponent(text);
    $("player").play().catch(function(){});
  },600);
}
async function translate(text,from,to){
  if(from===to)return text;
  const res=await fetch("./api/translate?q="+encodeURIComponent(text)+"&sl="+code(from)+"&tl="+code(to));
  const data=await res.json();
  const out=(data&&data.text)?String(data.text).trim():"";
  if(!out)throw new Error("fail");
  return out;
}
async function send(side,text){
  text=(text||(side==="A"?$("boxA").textContent:$("inputB").value||$("boxB").textContent)||"").trim();
  if(!text)return;
  if(side==="A")$("boxA").textContent=text;else{$("boxB").textContent=text;$("inputB").value=text;}
  const from=side==="B"?$("fromLang").value:$("toLang").value;
  const to=side==="B"?$("toLang").value:$("fromLang").value;
  const other=side==="A"?"B":"A";
  $("box"+other).textContent="...";
  try{
    const dst=await translate(text,from,to);
    $("box"+other).textContent=dst;
    if(other==="B")$("inputB").value=dst;
    speakNow(dst,to);
  }catch(e){$("box"+other).textContent="fail";}
}
function finish(side){
  if(done)return;done=true;
  const text=heard;live=null;stopRec();paint();
  if(side&&text)send(side,text);
}
function startRec(side){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$("box"+side).textContent="请用手机自带浏览器";return;}
  rec=new SR();window.__navRec=rec;
  rec.lang=SPEECH[side==="B"?$("fromLang").value:$("toLang").value]||"zh-CN";
  rec.continuous=false;rec.interimResults=true;
  rec.onresult=function(ev){
    let t="";for(let i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;
    t=t.trim();if(!t)return;heard=t;$("box"+side).textContent=t;
    if(ev.results[ev.results.length-1].isFinal)finish(side);
  };
  rec.onerror=function(){if(heard)finish(side);else{live=null;stopRec();paint();}};
  rec.onend=function(){if(!done&&heard)finish(side);else if(!done){live=null;stopRec();paint();}};
  try{rec.start();}catch(e){}
}
function begin(side){
  hush();stopRec();
  done=false;heard="";live=side;paint();
  startRec(side);
}
function tap(side){
  const now=Date.now();if(now-lock<400)return;lock=now;
  if(live===side)finish(side);
  else begin(side);
}
$("micA").onclick=function(){tap("A");};
$("micB").onclick=function(){tap("B");};
$("sendA").onclick=function(){send("A",$("boxA").textContent);};
$("sendB").onclick=function(){send("B",$("inputB").value||$("boxB").textContent);};
$("speakA").onclick=function(){speakNow($("boxA").textContent,$("toLang").value);};
$("speakB").onclick=function(){speakNow($("boxB").textContent||$("inputB").value,$("fromLang").value);};
$("clearA").onclick=function(){$("boxA").textContent="";hush();};
$("clearB").onclick=function(){$("boxB").textContent="";$("inputB").value="";hush();};
$("fromLang").onchange=$("toLang").onchange=paint;
$("inputB").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send("B",$("inputB").value);}});
window.addEventListener("pagehide",function(){stopRec();hush();});
document.addEventListener("visibilitychange",function(){if(document.hidden){stopRec();hush();live=null;paint();}});
paint();
</script>
</body>
</html>
