<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>面对面翻译</title>
<style>
  :root { --gold:#d4b07a; --gold2:#f0d7a8; --ink:#f6f1e8; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#0b0c10; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans Khmer",sans-serif; }
  .wrap { height:100dvh; max-width:480px; margin:0 auto; display:grid; grid-template-rows:1fr auto 1fr; background:radial-gradient(900px 360px at 50% 0,rgba(212,176,122,.14),transparent 55%),linear-gradient(180deg,#14161c,#0c0d12 50%,#14161c); }
  .pane { display:flex; flex-direction:column; padding:6px 10px; min-height:0; }
  .flip { transform:rotate(180deg); }
  .name { text-align:center; font-size:16px; font-weight:700; letter-spacing:.24em; color:var(--gold2); }
  .box { flex:1; min-height:36px; margin:4px 0; padding:6px 8px; border:1px solid rgba(212,176,122,.28); border-radius:10px; background:rgba(255,255,255,.04); font-size:clamp(16px,4.6vw,24px); font-weight:650; text-align:center; overflow:auto; }
  .bar { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
  .btn { height:32px; border:1px solid rgba(212,176,122,.35); border-radius:8px; background:rgba(255,255,255,.04); color:var(--gold2); font-weight:700; font-size:12px; }
  .btn.live { background:#8a2a2a; color:#fff; }
  textarea { margin-top:6px; width:100%; min-height:40px; resize:none; border-radius:10px; padding:8px 10px; font-size:16px; background:#fff; color:#111; border:1px solid rgba(212,176,122,.35); }
  .mid { padding:6px 10px; border-top:1px solid rgba(212,176,122,.28); border-bottom:1px solid rgba(212,176,122,.28); background:rgba(8,8,12,.55); }
  .pick { display:flex; align-items:center; gap:8px; }
  select { flex:1; height:34px; border-radius:8px; background:#17181e; color:var(--gold2); border:1px solid rgba(212,176,122,.4); font-size:14px; font-weight:700; text-align:center; }
  .cand { display:flex; gap:4px; overflow-x:auto; min-height:30px; margin:4px 0; }
  .cand b { flex:0 0 auto; padding:4px 8px; border-radius:8px; background:#2a2418; color:var(--gold2); font-size:16px; }
  .kb { display:grid; gap:3px; }
  .kr { display:flex; gap:3px; }
  .k { flex:1; height:28px; border:0; border-radius:6px; background:#1c1e26; color:#f3ead8; font-size:12px; font-weight:700; }
  .k.act { background:#2a2418; color:var(--gold2); }
  .k.wide { flex:2; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <section class="pane flip">
    <div class="name" id="nameA">英语</div>
    <div class="box" id="boxA"></div>
    <div class="cand" id="candA"></div>
    <div class="kb" id="kbA"></div>
    <div class="bar">
      <button class="btn" id="micA" type="button">语音</button>
      <button class="btn" id="speakA" type="button">播报</button>
      <button class="btn" id="camA" type="button">拍照</button>
      <button class="btn" id="clearA" type="button">清空</button>
      <button class="btn" id="sendA" type="button">翻译</button>
    </div>
  </section>
  <div class="mid">
    <div class="pick">
      <select id="fromLang">
        <option value="zh-CN">中文</option>
        <option value="en">英语</option>
        <option value="km-KM">高棉语</option>
      </select>
      <div>→</div>
      <select id="toLang">
        <option value="en" selected>英语</option>
        <option value="zh-CN">中文</option>
        <option value="km-KM">高棉语</option>
      </select>
    </div>
  </div>
  <section class="pane">
    <div class="name" id="nameB">中文</div>
    <div class="box" id="boxB"></div>
    <div class="bar">
      <button class="btn" id="micB" type="button">语音</button>
      <button class="btn" id="speakB" type="button">播报</button>
      <button class="btn" id="camB" type="button">拍照</button>
      <button class="btn" id="clearB" type="button">清空</button>
      <button class="btn" id="sendB" type="button">翻译</button>
    </div>
    <textarea id="inputB" lang="zh-CN"></textarea>
  </section>
</div>
<input id="file" type="file" accept="image/*" capture="environment">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const NAME = {"zh-CN":"中文","en":"英语","km-KM":"高棉语"};
const OCR = {"zh-CN":"chi_sim","en":"eng","km-KM":"khm"};
const SPEECH = {"zh-CN":"zh-CN","en":"en-US","km-KM":"km-KH"};
const PY = {
nihao:["你好"],xiexie:["谢谢"],zaijian:["再见"],duibuqi:["对不起"],meiguanxi:["没关系"],qingwen:["请问"],duoshao:["多少"],qian:["钱"],mai:["买"],chi:["吃"],he:["喝"],shui:["水"],fan:["饭"],hao:["好"],buhao:["不好"],shi:["是","事"],bushi:["不是"],wo:["我"],ni:["你"],ta:["他","她"],men:["们"],de:["的"],le:["了"],ma:["吗"],ne:["呢"],bu:["不"],hen:["很"],yao:["要"],neng:["能"],keyi:["可以"],zai:["在"],zhe:["这"],na:["那"],li:["里"],qu:["去"],lai:["来"],kan:["看"],shuo:["说"],ting:["听"],dong:["懂"],budong:["不懂"],bang:["帮"],mang:["忙"],xiex:["谢"],qing:["请"],wen:["问"],duo:["多"],shao:["少"],da:["大"],xiao:["小"],ren:["人"],tian:["天"],di:["地"],shang:["上"],xia:["下"],zuo:["做","左"],you:["有","右"],mei:["没"],youqian:["有钱"],mfan:["饭"],jiu:["就","酒"],cha:["茶"],kafei:["咖啡"],dianhua:["电话"],weixin:["微信"],fanyi:["翻译"],yingyu:["英语"],zhongwen:["中文"],gaomian:["高棉"]
};
const ROWS = ["qwertyuiop","asdfghjkl","zxcvbnm"];
const $ = id => document.getElementById(id);
let ocrSide="B", py="", draftA="", voices=[];
function loadVoices(){ voices = speechSynthesis.getVoices()||[]; }
loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;
function applyLang(){
  $("nameB").textContent = NAME[$("fromLang").value];
  $("nameA").textContent = NAME[$("toLang").value];
  $("inputB").lang = $("fromLang").value;
  py=""; renderCand();
}
$("fromLang").onchange=$("toLang").onchange=applyLang;
function renderCand(){
  const box=$("candA"); box.innerHTML="";
  if(!$("toLang") || $("toLang").value!=="zh-CN" || !py) return;
  const keys = Object.keys(PY).filter(k=>k.startsWith(py) || py.startsWith(k)).sort((a,b)=>a.length-b.length);
  const seen={};
  keys.forEach(k=> PY[k].forEach(ch=>{ if(!seen[ch]){ seen[ch]=1; const b=document.createElement("b"); b.textContent=ch; b.onclick=()=>pick(ch,k); box.appendChild(b);} }));
  if(py){ const keep=document.createElement("b"); keep.textContent=py; keep.onclick=()=>pick(py,""); box.appendChild(keep); }
}
function pick(ch,k){
  draftA += ch;
  if(k && py.startsWith(k)) py = py.slice(k.length); else py="";
  $("boxA").textContent = draftA + (py?py:"");
  renderCand();
}
function addA(ch){
  if($("toLang").value==="zh-CN"){ py+=ch; $("boxA").textContent=draftA+py; renderCand(); }
  else { draftA+=ch; $("boxA").textContent=draftA; }
}
function delA(){
  if(py){ py=py.slice(0,-1); $("boxA").textContent=draftA+py; renderCand(); }
  else { draftA=draftA.slice(0,-1); $("boxA").textContent=draftA; }
}
(function makeKb(){
  const root=$("kbA");
  ROWS.forEach((row,i)=>{
    const r=document.createElement("div"); r.className="kr";
    [...row].forEach(ch=>{ const b=document.createElement("button"); b.className="k"; b.type="button"; b.textContent=ch; b.onclick=()=>addA(ch); r.appendChild(b); });
    root.appendChild(r);
  });
  const last=document.createElement("div"); last.className="kr";
  [["⌫","del"],["空格","sp"],["确认","ok"]].forEach(([t,k])=>{
    const b=document.createElement("button"); b.className="k act"+(k!=="del"?" wide":""); b.type="button"; b.textContent=t;
    b.onclick=()=>{ if(k==="del") delA(); else if(k==="sp"){ if(py){ draftA+=py; py=""; } else draftA+=" "; $("boxA").textContent=draftA; renderCand(); } else { if(py){ draftA+=py; py=""; $("boxA").textContent=draftA; renderCand(); } } };
    last.appendChild(b);
  });
  root.appendChild(last);
})();
function speakNow(text,lang){
  text=String(text||"").trim(); if(!text) return;
  try{speechSynthesis.cancel();}catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  u.lang=SPEECH[lang]||"zh-CN"; u.rate=1;
  const pre=u.lang.slice(0,2);
  const v=(speechSynthesis.getVoices()||[]).find(x=>(x.lang||"").toLowerCase().startsWith(pre));
  if(v) u.voice=v;
  setTimeout(()=>speechSynthesis.speak(u),40);
}
$("speakA").onclick=()=>speakNow($("boxA").textContent,$("toLang").value);
$("speakB").onclick=()=>speakNow($("boxB").textContent||$("inputB").value,$("fromLang").value);
$("clearA").onclick=()=>{ draftA=""; py=""; $("boxA").textContent=""; renderCand(); speechSynthesis.cancel(); };
$("clearB").onclick=()=>{ $("boxB").textContent=""; $("inputB").value=""; speechSynthesis.cancel(); };
async function translate(text,from,to){
  if(from===to) return text;
  const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+encodeURIComponent(from+"|"+to);
  const res=await fetch(url); const data=await res.json();
  const out=data&&data.responseData&&data.responseData.translatedText||"";
  if(!out||/INVALID|QUERY LENGTH|MYMEMORY WARNING/i.test(out)) throw new Error("fail");
  return out;
}
async function send(side,text){
  if(side==="A"){ if(py){ draftA+=py; py=""; } text=(text||draftA||"").trim(); }
  else text=(text||$("inputB").value||"").trim();
  if(!text) return;
  const fromMain=$("fromLang").value,toMain=$("toLang").value;
  const from=side==="B"?fromMain:toMain, to=side==="B"?toMain:fromMain, other=side==="A"?"B":"A";
  $("box"+side).textContent=text;
  $("box"+other).textContent="…";
  try{
    const dst=await translate(text,from,to);
    $("box"+other).textContent=dst; speakNow(dst,to);
    if(side==="A"){ draftA=""; py=""; } else $("inputB").value="";
  }catch(e){ $("box"+other).textContent="翻译失败"; }
}
$("sendA").onclick=()=>send("A"); $("sendB").onclick=()=>send("B");
$("inputB").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send("B"); }});
const recs={A:null,B:null};
function bindMic(side){
  $("mic"+side).onclick=function(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;
    if(recs[side]){ recs[side].stop(); recs[side]=null; $("mic"+side).textContent="语音"; $("mic"+side).classList.remove("live"); return; }
    const rec=new SR(); rec.lang=SPEECH[side==="B"?$("fromLang").value:$("toLang").value];
    rec.onresult=ev=>send(side, ev.results[0][0].transcript);
    rec.onend=()=>{ recs[side]=null; $("mic"+side).textContent="语音"; $("mic"+side).classList.remove("live"); };
    rec.start(); recs[side]=rec; $("mic"+side).textContent="停"; $("mic"+side).classList.add("live");
  };
}
bindMic("A"); bindMic("B"); applyLang();
$("camA").onclick=()=>{ ocrSide="A"; $("file").click(); };
$("camB").onclick=()=>{ ocrSide="B"; $("file").click(); };
$("file").onchange=async e=>{
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  const from=ocrSide==="B"?$("fromLang").value:$("toLang").value;
  try{
    const worker=await Tesseract.createWorker(OCR[from]||"eng");
    const result=await worker.recognize(file); await worker.terminate();
    const cleaned=(result.data.text||"").replace(/\s+/g," ").trim();
    if(cleaned) await send(ocrSide, cleaned);
  }catch(err){}
  e.target.value="";
};
</script>
</body>
</html>
