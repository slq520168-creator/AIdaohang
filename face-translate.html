<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>面对面翻译</title>
<style>
  :root { --gold:#d4b07a; --gold2:#f0d7a8; --ink:#f6f1e8; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#0b0c10; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans Khmer",sans-serif; }
  .wrap { height:100dvh; max-width:480px; margin:0 auto; display:grid; grid-template-rows:1fr auto 1fr; background:radial-gradient(900px 360px at 50% 0,rgba(212,176,122,.14),transparent 55%),linear-gradient(180deg,#14161c,#0c0d12 50%,#14161c); }
  .pane { display:flex; flex-direction:column; padding:8px 12px; min-height:0; }
  .flip { transform:rotate(180deg); }
  .name { text-align:center; font-size:18px; font-weight:700; letter-spacing:.28em; color:var(--gold2); padding:2px 0 6px; }
  .box { flex:1; min-height:44px; margin-bottom:6px; padding:8px 10px; border:1px solid rgba(212,176,122,.28); border-radius:12px; background:rgba(255,255,255,.04); font-size:clamp(18px,5vw,28px); font-weight:650; line-height:1.35; text-align:center; overflow:auto; }
  .bar { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
  .btn { height:36px; border:1px solid rgba(212,176,122,.35); border-radius:10px; background:rgba(255,255,255,.04); color:var(--gold2); font-weight:700; font-size:12px; }
  .btn.live { background:#8a2a2a; color:#fff; }
  textarea { margin-top:6px; width:100%; min-height:40px; max-height:72px; resize:none; border-radius:12px; padding:8px 10px; font-size:16px; background:#fff; color:#111; border:1px solid rgba(212,176,122,.35); }
  .mid { padding:8px 12px; border-top:1px solid rgba(212,176,122,.28); border-bottom:1px solid rgba(212,176,122,.28); background:rgba(8,8,12,.55); }
  .pick { display:flex; align-items:center; gap:8px; }
  select { flex:1; height:36px; border-radius:10px; padding:0 8px; background:#17181e; color:var(--gold2); border:1px solid rgba(212,176,122,.4); font-size:14px; font-weight:700; text-align:center; }
  .arrow { color:var(--gold); width:18px; text-align:center; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <section class="pane flip">
    <div class="name" id="nameA">英语</div>
    <div class="box" id="boxA"></div>
    <div class="bar">
      <button class="btn" id="micA" type="button">语音</button>
      <button class="btn" id="speakA" type="button">播报</button>
      <button class="btn" id="camA" type="button">拍照</button>
      <button class="btn" id="clearA" type="button">清空</button>
      <button class="btn" id="sendA" type="button">翻译</button>
    </div>
    <textarea id="inputA"></textarea>
  </section>
  <div class="mid">
    <div class="pick">
      <select id="fromLang">
        <option value="zh-CN">中文</option>
        <option value="en">英语</option>
        <option value="km-KM">高棉语</option>
      </select>
      <div class="arrow">→</div>
      <select id="toLang">
        <option value="en" selected>英语</option>
        <option value="zh-CN">中文</option>
        <option value="km-KM">高棉语</option>
      </select>
    </div>
  </div>
  <section class="pane">
    <div class="name" id="nameB">中文</div>
    <div class="box" id="boxB"></div>
    <div class="bar">
      <button class="btn" id="micB" type="button">语音</button>
      <button class="btn" id="speakB" type="button">播报</button>
      <button class="btn" id="camB" type="button">拍照</button>
      <button class="btn" id="clearB" type="button">清空</button>
      <button class="btn" id="sendB" type="button">翻译</button>
    </div>
    <textarea id="inputB" lang="zh-CN"></textarea>
  </section>
</div>
<input id="file" type="file" accept="image/*" capture="environment">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const NAME = { "zh-CN":"中文", "en":"英语", "km-KM":"高棉语" };
const OCR = { "zh-CN":"chi_sim", "en":"eng", "km-KM":"khm" };
const SPEECH = { "zh-CN":"zh-CN", "en":"en-US", "km-KM":"km-KH" };
const $ = id => document.getElementById(id);
let ocrSide = "B";
let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices() || []; }
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;

function applyLang(){
  $("nameB").textContent = NAME[$("fromLang").value];
  $("nameA").textContent = NAME[$("toLang").value];
  $("inputB").lang = $("fromLang").value;
  $("inputA").lang = $("toLang").value;
}
$("fromLang").onchange = $("toLang").onchange = applyLang;
applyLang();

function pickVoice(lang){
  loadVoices();
  const pre = (lang || "zh").slice(0,2).toLowerCase();
  return voices.find(v => (v.lang||"").toLowerCase().startsWith(pre))
      || voices.find(v => (v.lang||"").toLowerCase().indexOf(pre) !== -1)
      || null;
}
function speakNow(text, lang){
  text = String(text || "").trim();
  if (!text) return;
  try { speechSynthesis.cancel(); } catch(e) {}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = SPEECH[lang] || lang || "zh-CN";
  u.rate = 1;
  u.pitch = 1;
  const v = pickVoice(u.lang);
  if (v) u.voice = v;
  setTimeout(function(){ speechSynthesis.speak(u); }, 40);
}
$("speakA").onclick = function(){ speakNow($("boxA").textContent || $("inputA").value, $("toLang").value); };
$("speakB").onclick = function(){ speakNow($("boxB").textContent || $("inputB").value, $("fromLang").value); };
$("clearA").onclick = function(){ $("boxA").textContent=""; $("inputA").value=""; try{speechSynthesis.cancel();}catch(e){} };
$("clearB").onclick = function(){ $("boxB").textContent=""; $("inputB").value=""; try{speechSynthesis.cancel();}catch(e){} };

async function translate(text, from, to){
  if (from === to) return text;
  const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=" + encodeURIComponent(from + "|" + to);
  const res = await fetch(url);
  const data = await res.json();
  const out = data && data.responseData && data.responseData.translatedText || "";
  if (!out || /INVALID|QUERY LENGTH|MYMEMORY WARNING/i.test(out)) throw new Error("fail");
  return out;
}
async function send(side){
  const text = ((side==="A" ? $("inputA").value : $("inputB").value) || "").trim();
  if (!text) return;
  const fromMain=$("fromLang").value, toMain=$("toLang").value;
  const from = side==="B" ? fromMain : toMain;
  const to = side==="B" ? toMain : fromMain;
  const other = side==="A" ? "B" : "A";
  $("box"+side).textContent = text;
  $("box"+other).textContent = "…";
  try{
    const dst = await translate(text, from, to);
    $("box"+other).textContent = dst;
    speakNow(dst, to);
    if(side==="A") $("inputA").value=""; else $("inputB").value="";
  }catch(e){ $("box"+other).textContent="翻译失败"; }
}
$("sendA").onclick = function(){ send("A"); };
$("sendB").onclick = function(){ send("B"); };
$("inputA").addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send("A"); } });
$("inputB").addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send("B"); } });

const recs={A:null,B:null};
function bindMic(side){
  $("mic"+side).onclick=function(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR) return;
    if(recs[side]){ recs[side].stop(); recs[side]=null; $("mic"+side).textContent="语音"; $("mic"+side).classList.remove("live"); return; }
    const rec=new SR();
    rec.lang=SPEECH[side==="B"?$("fromLang").value:$("toLang").value];
    rec.onresult=function(ev){
      const t=ev.results[0][0].transcript;
      if(side==="A") $("inputA").value=t; else $("inputB").value=t;
      send(side);
    };
    rec.onend=function(){ recs[side]=null; $("mic"+side).textContent="语音"; $("mic"+side).classList.remove("live"); };
    rec.start(); recs[side]=rec; $("mic"+side).textContent="停"; $("mic"+side).classList.add("live");
  };
}
bindMic("A"); bindMic("B");
$("camA").onclick=function(){ ocrSide="A"; $("file").click(); };
$("camB").onclick=function(){ ocrSide="B"; $("file").click(); };
$("file").onchange=async function(e){
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  const from=ocrSide==="B"?$("fromLang").value:$("toLang").value;
  try{
    const worker=await Tesseract.createWorker(OCR[from]||"eng");
    const result=await worker.recognize(file); await worker.terminate();
    const cleaned=(result.data.text||"").replace(/\s+/g," ").trim();
    if(cleaned){
      if(ocrSide==="A") $("inputA").value=cleaned; else $("inputB").value=cleaned;
      await send(ocrSide);
    }
  }catch(err){}
  e.target.value="";
};
</script>
</body>
</html>
