<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>面对面翻译</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#f6f3ee; color:#1f1b16; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans Khmer",sans-serif; }
  .wrap { height:100dvh; max-width:480px; margin:0 auto; display:grid; grid-template-rows:1fr auto 1fr; background:#f6f3ee; }
  .pane { display:flex; flex-direction:column; padding:8px 10px; min-height:0; }
  .flip { transform:rotate(180deg); }
  .name { text-align:center; font-size:16px; font-weight:700; letter-spacing:.14em; color:#6a4e2e; }
  .stage { position:relative; flex:1; min-height:72px; margin:4px 0; }
  .box { height:100%; padding:8px 8px 58px; border:1px solid #e4d8c6; border-radius:10px; background:#fff; font-size:clamp(16px,4.6vw,24px); font-weight:650; text-align:center; overflow:auto; }
  .wave { position:absolute; left:8%; right:8%; bottom:10px; height:36px; width:84%; pointer-events:none; }
  .mic { position:absolute; left:50%; top:calc(50% + 5mm); transform:translate(-50%,-50%); width:56px; height:56px; border:0; border-radius:50%; background:#16a34a; color:#fff; font-size:28px; line-height:56px; box-shadow:0 2px 8px rgba(22,163,74,.4); }
  .mic.live { background:#15803d; animation:pulse .9s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:translate(-50%,-50%) scale(1.08); } }
  .bar { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-top:6px; }
  .btn { height:34px; border:1px solid #e0d3bf; border-radius:8px; background:#fff; color:#5a442c; font-weight:700; font-size:11px; }
  textarea { margin-top:6px; width:100%; min-height:42px; resize:none; border-radius:10px; padding:8px 10px; font-size:16px; background:#fff; color:#111; border:1px solid #e0d3bf; }
  .mid { padding:2px 16px; border-top:1px solid #e4d8c6; border-bottom:1px solid #e4d8c6; background:#efe8dc; }
  .pick { display:flex; align-items:center; justify-content:center; gap:4px; }
  select { width:34%; height:22px; border-radius:5px; background:#fff; color:#3d2e1c; border:1px solid #e0d3bf; font-size:11px; font-weight:700; text-align:center; }
  .arrow { font-size:10px; opacity:.65; }
  .kb { display:grid; gap:3px; }
  .kr { display:flex; gap:3px; }
  .k { flex:1; height:28px; border:0; border-radius:6px; background:#fff; color:#2a2418; font-size:13px; font-weight:700; box-shadow:0 0 0 1px #e4d8c6; }
  .k.act { background:#efe8dc; color:#5a442c; }
  .k.wide { flex:2; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <section class="pane flip">
    <div class="name" id="nameA">English</div>
    <div class="stage">
      <div class="box" id="boxA"></div>
      <canvas class="wave" id="waveA"></canvas>
      <button class="mic" id="micA" type="button">🎙️</button>
    </div>
    <div class="kb" id="kbA"></div>
    <div class="bar">
      <button class="btn" id="speakA" type="button">Speak</button>
      <button class="btn" id="camA" type="button">Photo</button>
      <button class="btn" id="clearA" type="button">Clear</button>
      <button class="btn" id="sendA" type="button">Translate</button>
    </div>
  </section>
  <div class="mid">
    <div class="pick">
      <select id="fromLang">
        <option value="zh-CN">中文</option>
        <option value="en">English</option>
        <option value="km-KM">ភាសាខ្មែរ</option>
      </select>
      <div class="arrow">→</div>
      <select id="toLang">
        <option value="en" selected>English</option>
        <option value="zh-CN">中文</option>
        <option value="km-KM">ភាសាខ្មែរ</option>
      </select>
    </div>
  </div>
  <section class="pane">
    <div class="name" id="nameB">中文</div>
    <div class="stage">
      <div class="box" id="boxB"></div>
      <canvas class="wave" id="waveB"></canvas>
      <button class="mic" id="micB" type="button">🎙️</button>
    </div>
    <div class="bar">
      <button class="btn" id="speakB" type="button">播报</button>
      <button class="btn" id="camB" type="button">拍照</button>
      <button class="btn" id="clearB" type="button">清空</button>
      <button class="btn" id="sendB" type="button">翻译</button>
    </div>
    <textarea id="inputB" lang="zh-CN"></textarea>
  </section>
</div>
<input id="file" type="file" accept="image/*" capture="environment">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const UI = {
  "zh-CN": { name:"中文", speak:"播报", cam:"拍照", clear:"清空", send:"翻译", space:"空格" },
  "en":    { name:"English", speak:"Speak", cam:"Photo", clear:"Clear", send:"Translate", space:"space" },
  "km-KM": { name:"ភាសាខ្មែរ", speak:"អាន", cam:"ថត", clear:"លុប", send:"បកប្រែ", space:"ដកំ" }
};
const OCR = {"zh-CN":"chi_sim","en":"eng","km-KM":"khm"};
const SPEECH = {"zh-CN":"zh-CN","en":"en-US","km-KM":"km-KH"};
const EN = ["qwertyuiop","asdfghjkl","zxcvbnm"];
const KM = ["កខគងចឆជញ","តថទនបផពម","យរលវសហអ","ាិីុូេោំ់"];
const $ = id => document.getElementById(id);
const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
let ocrSide="B", draftA="", recs={A:null,B:null}, micTimer={A:0,B:0}, lastHeard={A:"",B:""}, primed=false;
function code(lang){ if(String(lang).indexOf("zh")===0) return "zh-CN"; if(String(lang).indexOf("km")===0) return "km"; return "en"; }
function otherLang(v){ return v==="zh-CN" ? "en" : "zh-CN"; }
function preventSame(which){
  if($("fromLang").value===$("toLang").value){
    if(which==="from") $("toLang").value=otherLang($("fromLang").value);
    else $("fromLang").value=otherLang($("toLang").value);
  }
}
function pickVoice(lang){
  const list=speechSynthesis.getVoices()||[];
  const pre=(SPEECH[lang]||"en-US").slice(0,2).toLowerCase();
  return list.find(v=>/en-US/i.test(v.lang)&&/Samantha|Siri|Google US English/i.test(v.name))
    || list.find(v=>(v.lang||"").toLowerCase().startsWith(pre))
    || null;
}
function speakNow(text, lang){
  text=String(text||"").trim();
  if(!text || lang==="km-KM") return;
  try{ speechSynthesis.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  u.lang=SPEECH[lang]||"en-US"; u.rate=1; u.volume=1;
  const v=pickVoice(lang); if(v) u.voice=v;
  speechSynthesis.speak(u);
}
function addA(ch){ draftA+=ch; $("boxA").textContent=draftA; }
function delA(){ draftA=draftA.slice(0,-1); $("boxA").textContent=draftA; }
function makeKb(){
  const root=$("kbA"); root.innerHTML="";
  const lang=$("toLang").value;
  const rows = lang==="km-KM" ? KM : EN;
  rows.forEach(row=>{
    const r=document.createElement("div"); r.className="kr";
    [...row].forEach(ch=>{ const b=document.createElement("button"); b.className="k"; b.type="button"; b.textContent=ch; b.onclick=()=>addA(ch); r.appendChild(b); });
    root.appendChild(r);
  });
  const last=document.createElement("div"); last.className="kr";
  const d=document.createElement("button"); d.className="k act"; d.type="button"; d.textContent="⌫"; d.onclick=delA;
  const s=document.createElement("button"); s.className="k wide act"; s.type="button"; s.textContent=UI[lang].space; s.onclick=()=>addA(" ");
  last.appendChild(d); last.appendChild(s); root.appendChild(last);
}
function paintBtns(){
  const a = UI[$("toLang").value], b = UI[$("fromLang").value];
  $("nameA").textContent=a.name; $("speakA").textContent=a.speak; $("camA").textContent=a.cam; $("clearA").textContent=a.clear; $("sendA").textContent=a.send;
  $("nameB").textContent=b.name; $("speakB").textContent=b.speak; $("camB").textContent=b.cam; $("clearB").textContent=b.clear; $("sendB").textContent=b.send;
  $("micA").classList.toggle("live", !!recs.A);
  $("micB").classList.toggle("live", !!recs.B);
}
function applyLang(){ preventSame("to"); paintBtns(); makeKb(); $("inputB").lang=$("fromLang").value; }
$("fromLang").onchange=function(){ preventSame("from"); applyLang(); };
$("toLang").onchange=function(){ preventSame("to"); applyLang(); };
$("speakA").onclick=function(){ speakNow($("boxA").textContent, $("toLang").value); };
$("speakB").onclick=function(){ speakNow($("boxB").textContent||$("inputB").value, $("fromLang").value); };
$("clearA").onclick=function(){ draftA=""; $("boxA").textContent=""; try{speechSynthesis.cancel();}catch(e){} };
$("clearB").onclick=function(){ $("boxB").textContent=""; $("inputB").value=""; try{speechSynthesis.cancel();}catch(e){} };
function readGoogle(data){
  if(!data || data.error) return "";
  if(typeof data==="string") return data;
  if(Array.isArray(data)){
    if(typeof data[0]==="string") return data[0];
    return data.map(function(row){ return Array.isArray(row)?(row[0]||""):String(row||""); }).join("");
  }
  return "";
}
async function translate(text,from,to){
  if(from===to) return text;
  const sl=code(from), tl=code(to);
  const urls=[
    "./api/translate?q="+encodeURIComponent(text)+"&sl="+encodeURIComponent(sl)+"&tl="+encodeURIComponent(tl),
    "https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl="+sl+"&tl="+tl+"&q="+encodeURIComponent(text)
  ];
  for(let i=0;i<urls.length;i++){
    try{
      const res=await fetch(urls[i]); const data=await res.json();
      const out=readGoogle(data).trim(); if(out) return out;
    }catch(e){}
  }
  throw new Error("fail");
}
function putText(side, text){
  if(side==="A"){ draftA=text; $("boxA").textContent=text; }
  else { $("inputB").value=text; $("boxB").textContent=text; }
}
async function send(side,text){
  text=(text||(side==="A"?draftA:$("inputB").value)||"").trim(); if(!text) return;
  putText(side, text);
  const fromMain=$("fromLang").value,toMain=$("toLang").value;
  const from=side==="B"?fromMain:toMain, to=side==="B"?toMain:fromMain, other=side==="A"?"B":"A";
  $("box"+other).textContent="...";
  try{
    const dst=await translate(text,from,to);
    $("box"+other).textContent=dst;
    speakNow(dst,to);
  }catch(e){ $("box"+other).textContent="fail"; }
}
$("sendA").onclick=function(){ send("A"); };
$("sendB").onclick=function(){ send("B"); };
$("inputB").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send("B"); }});
async function primeMic(){
  if(primed) return;
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    s.getTracks().forEach(t=>t.stop());
    primed=true;
  }catch(e){}
}
function killMic(side){
  if(micTimer[side]){ clearTimeout(micTimer[side]); micTimer[side]=0; }
  const rec=recs[side]; recs[side]=null;
  if(rec){ rec.onresult=null; rec.onerror=null; rec.onend=null; try{rec.stop();}catch(e){} }
  paintBtns();
}
function startMic(side){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;
  if(recs.A||recs.B){ killMic("A"); killMic("B"); }
  try{speechSynthesis.cancel();}catch(e){}
  primeMic();
  const lang=side==="B"?$("fromLang").value:$("toLang").value;
  lastHeard[side]="";
  const rec=new SR();
  rec.lang=SPEECH[lang]||"zh-CN";
  rec.continuous=false;
  rec.interimResults=true;
  rec.maxAlternatives=1;
  rec.onresult=function(ev){
    let t=""; for(let i=0;i<ev.results.length;i++) t += ev.results[i][0].transcript;
    t=t.trim(); if(!t) return;
    lastHeard[side]=t; putText(side, t);
    if(ev.results[ev.results.length-1].isFinal){
      recs[side]=null; paintBtns(); send(side, t);
    }
  };
  rec.onerror=function(){
    recs[side]=null; paintBtns();
    if(lastHeard[side]) send(side, lastHeard[side]);
  };
  rec.onend=function(){
    const had=recs[side]; recs[side]=null; paintBtns();
    if(had && lastHeard[side]) send(side, lastHeard[side]);
  };
  try{
    rec.start();
    recs[side]=rec;
    paintBtns();
    micTimer[side]=setTimeout(function(){ if(recs[side]){ try{recs[side].stop();}catch(e){} } }, 15000);
  }catch(e){ recs[side]=null; paintBtns(); }
}
$("micA").onclick=function(){ recs.A?killMic("A"):startMic("A"); };
$("micB").onclick=function(){ recs.B?killMic("B"):startMic("B"); };
document.addEventListener("visibilitychange", function(){ if(document.hidden){ killMic("A"); killMic("B"); } });
$("camA").onclick=function(){ ocrSide="A"; $("file").click(); };
$("camB").onclick=function(){ ocrSide="B"; $("file").click(); };
$("file").onchange=async function(e){
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  const from=ocrSide==="B"?$("fromLang").value:$("toLang").value;
  try{
    const worker=await Tesseract.createWorker(OCR[from]||"eng");
    const result=await worker.recognize(file); await worker.terminate();
    const cleaned=(result.data.text||"").replace(/\s+/g," ").trim();
    if(cleaned) await send(ocrSide, cleaned);
  }catch(err){}
  e.target.value="";
};
applyLang();
</script>
</body>
</html>
